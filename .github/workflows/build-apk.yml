name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Setup toolchains ──
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      # ── Build the PWA ──
      - name: Build PWA
        run: |
          cd app
          npm install
          npm run build
      - name: Copy PWA into engine
        run: |
          rm -rf engine/internal/server/web/assets
          cp -r app/dist/* engine/internal/server/web/

      # ── Build the Go engine for Android ARM64 ──
      - name: Build Go engine (Android ARM64)
        run: |
          cd engine
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o ../platforms/android/app/src/main/jniLibs/arm64-v8a/libdoomalayengine.so ./cmd/doomalay
        env:
          GOFLAGS: -mod=mod

      # ── Build the APK ──
      - name: Build APK
        run: |
          cd platforms/android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.ANDROID_DEBUG_KEY_B64 || '' }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        continue-on-error: true

      # ── Upload ──
      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            platforms/android/app/build/outputs/apk/debug/app-debug.apk
            platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doomalay-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
