name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Setup toolchains ──
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Setup Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # ── Accept Android licenses ──
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # ── Build the PWA ──
      - name: Build PWA
        run: |
          cd app
          npm install
          npm run build
      - name: Copy PWA into engine
        run: |
          rm -rf engine/internal/server/web/assets
          cp -r app/dist/* engine/internal/server/web/

      # ── Build the Go engine for Android ARM64 ──
      - name: Build Go engine (Android ARM64)
        run: |
          cd engine
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o ../platforms/android/app/src/main/jniLibs/arm64-v8a/libdoomalayengine.so ./cmd/doomalay

      # ── Build the APK ──
      - name: Build APK
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Upload ──
      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doomalay-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
