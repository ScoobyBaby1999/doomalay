name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Go engine (Android ARM64)
        run: |
          cd engine
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o ../platforms/android/app/src/main/jniLibs/arm64-v8a/libdoomalayengine.so ./cmd/doomalay

      - name: Build APK
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doomalay-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
