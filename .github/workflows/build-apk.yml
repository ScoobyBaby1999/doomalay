name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Go engine (Android ARM64)
        run: |
          cd engine
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags "-X github.com/ScoobyBaby1999/doomalay/engine/internal/buildinfo.Version=${GITHUB_REF_NAME}" \
            -o ../platforms/android/app/src/main/jniLibs/arm64-v8a/libdoomalayengine.so ./cmd/doomalay

      - name: Stamp APK version from the tag
        working-directory: platforms/android
        run: |
          # v0.30.1: the APK's versionName/versionCode tracked nothing before
          # (stuck at 0.10.1 / 19). Stamp both from the release tag so
          # Settings → About and Android's app info agree with the engine's
          # /api/health version (also ldflags-stamped above).
          #
          # v0.30.2 FIX: build.gradle.kts is KOTLIN DSL — the assignments are
          # `versionCode = 19` (with '='). The first stamping attempt used the
          # Groovy shape `versionCode 19`, so its sed matched only the word +
          # space, turning line 13 into `versionCode 300101= 19` and failing
          # the whole APK build with ScriptCompilationException. The patterns
          # below accept BOTH shapes and the guard after them hard-fails if
          # the stamped lines are not exactly `key = value` Kotlin.
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
            CODE=$(( MAJOR*10000 + MINOR*100 + PATCH ))
            sed -i -E "s/versionCode( =)? [0-9]+/versionCode = ${CODE}/" app/build.gradle.kts
            sed -i -E "s/versionName( =)? \"[^\"]*\"/versionName = \"${TAG#v}\"/" app/build.gradle.kts
            echo "APK stamped: ${TAG#v} (${CODE})"
            # Guard: the stamped lines must be valid Kotlin DSL assignments,
            # or the build dies HERE with a readable message instead of inside
            # gradle with a cryptic ScriptCompilationException.
            grep -Eq "versionCode = [0-9]+" app/build.gradle.kts \
              || { echo "::error::versionCode stamp failed"; sed -n '9,16p' app/build.gradle.kts; exit 1; }
            grep -Eq "versionName = \"[^\"]+\"" app/build.gradle.kts \
              || { echo "::error::versionName stamp failed"; sed -n '9,16p' app/build.gradle.kts; exit 1; }
            sed -n '13,14p' app/build.gradle.kts
          else
            echo "ref '$TAG' is not a semver tag — leaving gradle defaults"
          fi

      - name: Build APK
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact (non-fatal — quota is capped; releases carry the binaries)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: doomalay-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
