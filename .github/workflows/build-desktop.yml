name: Build Desktop Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary_ext: .exe
            artifact_name: doomalay-windows-amd64
          - goos: linux
            goarch: amd64
            binary_ext: ''
            artifact_name: doomalay-linux-amd64
          - goos: darwin
            goarch: arm64
            binary_ext: ''
            artifact_name: doomalay-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Go engine
        run: |
          cd engine
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o ../${{ matrix.artifact_name }}${{ matrix.binary_ext }} ./cmd/doomalay
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}${{ matrix.binary_ext }}
      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}${{ matrix.binary_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
