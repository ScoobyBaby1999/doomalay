name: Build HF Space Docker

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['platforms/hf-space/**', 'engine/**', 'brain/**']
  workflow_dispatch:

jobs:
  build-hf-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Go engine (linux/amd64)
        run: |
          cd engine
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../platforms/hf-space/engine/doomalay-engine ./cmd/doomalay
      - name: Build Docker image
        run: |
          cd platforms/hf-space
          docker build -t doomalay-hf-space .
      - name: Push to HF Space
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push the Docker image to HF Space (requires HF_TOKEN secret)
          echo "Pushing to HF Space..."
          # This uses huggingface_hub to push the Docker image
          pip install huggingface_hub
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi(token='$HF_TOKEN')
          api.upload_folder(
              folder_path='platforms/hf-space',
              repo_id='${{ vars.HF_SPACE_REPO || secrets.HF_SPACE_REPO || 'doomalay/doomalay' }}',
              repo_type='space',
          )
          "
