name: csc323-lite build

on:
  push:
    branches: ["csc323-project"]
    paths:
      - "school/csc323-lite/**"
      - ".github/workflows/csc323-lite-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution (Release)
        run: dotnet build DoomalayLite.sln -c Release
        working-directory: school/csc323-lite

      - name: Run offline smoke tests
        run: dotnet run --project tests/DoomalayLite.Smoke -c Release -- offline
        working-directory: school/csc323-lite
