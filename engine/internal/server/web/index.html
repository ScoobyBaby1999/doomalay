     the composer whenever the reader is scrolled up (idle OR mid-stream
     with the freeze engaged); 'live' adds a pulsing dot while a turn
     streams below the fold. */
  .chat-jump {
    position: absolute; right: 16px; z-index: 3;
    bottom: 110px; width: 38px; height: 38px; border-radius: 999px;
    background-color: var(--raised-chrome); border: 1px solid var(--border-strong);
    color: var(--text-1); font-size: 16px; line-height: 1;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transform: translateY(8px) scale(0.9);
    transition: opacity .18s ease, transform .18s ease, background .14s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  .chat-jump.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  .chat-jump:hover { background: var(--surface-3); }
  .chat-jump:active { transform: scale(0.92); }
  .chat-jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chat-jump.live::after {
    content: ''; position: absolute; top: 5px; right: 5px;
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--notice);
    animation: jump-live 1.6s ease-in-out infinite;
  }
  @keyframes jump-live {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chat-jump { transition: none; }
    .chat-jump.live::after { animation: none; opacity: 1; }
  }
  /* the matched bubble: a themed ring + a soft pulse that fades to a
     quieter outline (the current match stays visible while walking) */
  .find-hit {
    outline: 2px solid rgba(var(--accent-rgb), 0.9);
    outline-offset: 2px;
    border-radius: 12px;
    animation: find-pulse 1.1s ease 2;
  }
  @keyframes find-pulse {
    0%   { outline-color: rgba(var(--accent-rgb), 0.95); box-shadow: 0 0 0 6px rgba(var(--accent-rgb), 0.22); }
    70%  { box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.08); }
    100% { outline-color: rgba(var(--accent-rgb), 0.55); box-shadow: none; }
  }

  /* ══ v0.39 — DETAIL POLISH SWEEP ═══════════════════════════════════
     Keyboard users get a visible focus ring on every interactive control
     (touch users never see it — :focus-visible only); the context ring
     grows on hover; tool pills lift; transcripts + model lists get thin
     themed scrollbars; the composer glows on focus. */
  button:focus-visible, .chat-find-btn:focus-visible, .ctx-ring-btn:focus-visible,
  .chat-find-input:focus-visible, #chat-input:focus-visible, #chat-send:focus-visible {
    outline: 2px solid rgba(var(--accent-rgb), 0.85);
    outline-offset: 2px;
  }
  /* the context ring: a gentle grow + a matching glow on hover — invites
     the tap that opens the usage view */
  .ctx-ring-btn:hover .ctx-ring { transform: scale(1.14); }
  .ctx-ring-btn .ctx-ring { transition: transform .16s ease; }
  .ctx-ring-btn:hover .ctx-ring::after { opacity: 1; }
  /* tool pills: hover lift + border emphasis (they're tappable — say so) */
  .tool-pill { transition: transform .12s ease, border-color .12s ease, background .12s ease; }
  .tool-pill:hover { transform: translateY(-1px); }
  /* thin themed scrollbars: the transcript + panel-internal lists */
  #chat-scroll, #chat-messages, #mb-list, .mb-body {
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
  }
  #chat-scroll::-webkit-scrollbar, #mb-list::-webkit-scrollbar, .mb-body::-webkit-scrollbar {
    width: 5px; height: 5px;
  }
  #chat-scroll::-webkit-scrollbar-thumb, #mb-list::-webkit-scrollbar-thumb, .mb-body::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 3px;
  }
  #chat-scroll::-webkit-scrollbar-track, #mb-list::-webkit-scrollbar-track, .mb-body::-webkit-scrollbar-track {
    background: transparent;
  }
  /* the composer: a soft themed glow while focused — the chat's "you are
     here" cue, matching the find input's treatment */
  #chat-input {
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #chat-input:focus {
    border-color: rgba(var(--accent-rgb), 0.65);
    box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.14);
  }
  /* the Send button: a touch of feedback under the thumb */
  #chat-send { transition: transform .1s ease, background .15s ease, opacity .15s ease; }
  #chat-send:active { transform: scale(0.97); }
  /* message timestamps fade in slightly faster + softer curve */
  .msg-time { transition: opacity .18s ease; }
  /* the chat gate (empty state): the greeting breathes very gently —
     alive but never distracting (killed under reduced motion) */
  #chat-greeting { animation: gate-breathe 4.5s ease-in-out infinite; }
  @keyframes gate-breathe {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #chat-greeting { animation: none; }
    .find-hit { animation: none; outline-color: rgba(var(--accent-rgb), 0.8); }
    .ctx-ring-btn:hover .ctx-ring { transform: none; }
    .tool-pill:hover { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg-new { animation: none; }
  }
  /* Desktop nicety: a whisper of a border on hover so the pointer has
     something to land on (the touch UI never sees this). */
  @media (hover: hover) {
    .msg-row-user > .msg-bubble:hover, .msg-row-assistant > .msg-bubble:hover {
      outline: 1px solid rgba(var(--border-rgb), 0.6);
    }
  }
  /* ── v0.37 EDITING BANNER (pinned inside the sticky input bar) ── */
  #edit-banner {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 8px; padding: 6px 10px;
    background: rgba(var(--accent-rgb), 0.08);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    border-radius: 8px;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 180ms ease, transform 180ms ease;
  }
  #edit-banner.open { opacity: 1; transform: translateY(0); }
  #edit-banner .eb-ico { font-size: 13px; color: var(--accent); flex-shrink: 0; }
  #edit-banner .eb-text {
    flex: 1; font-size: 12px; font-weight: 600; color: var(--text-2);
    letter-spacing: 0.2px;
  }
  #edit-banner .eb-cancel {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-2); font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 6px; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
  }
  #edit-banner .eb-cancel:hover { border-color: var(--err); color: var(--err); }

  /* ── v0.44 TEMPLATE PILL: the composer's active-template chip + the
     template sheet (templatesheet.js) — the edit-banner mechanics with
     their own element, and the library rows follow the dx-pill texture ── */
  #tpl-chip {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 8px; padding: 6px 10px;
    background: rgba(var(--accent-rgb), 0.08);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    border-radius: 8px;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 180ms ease, transform 180ms ease;
  }
  #tpl-chip.open { opacity: 1; transform: translateY(0); }
  #tpl-chip .tpl-chip-ico { font-size: 13px; color: var(--accent); flex-shrink: 0; }
  #tpl-chip .tpl-chip-text {
    flex: 1; font-size: 12px; font-weight: 600; color: var(--text-2);
    letter-spacing: 0.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #tpl-chip .tpl-chip-x {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-2); font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 6px; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
  }
  #tpl-chip .tpl-chip-x:hover { border-color: var(--err); color: var(--err); }

  .ts-root { display: flex; flex-direction: column; min-height: 0; }
  .ts-actions { display: flex; gap: 8px; margin: 8px 0 10px; }
  .ts-act {
    flex: 1 1 0; background: transparent; border: 1px solid var(--border);
    color: var(--text-2); padding: 7px 4px; border-radius: 9px;
    font-size: var(--ui-small-fs); font-weight: 700; font-family: inherit;
    cursor: pointer; touch-action: manipulation; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .ts-act:active { background: var(--surface-3); }
  .ts-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .ts-group {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-3);
    margin: 12px 2px 6px; display: flex; align-items: baseline; gap: 6px;
  }
  .ts-group-n { color: var(--text-3); opacity: 0.7; font-weight: 600; }
  .ts-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 10px;
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 7px; cursor: pointer; background: var(--surface-1);
    transition: background 0.15s, border-color 0.15s;
  }
  .ts-row:active, .ts-row:hover { background: var(--surface-2); }
  .ts-row-on { border-color: rgba(var(--accent-rgb), 0.55); background: rgba(var(--accent-rgb), 0.07); }
  .ts-row-main { flex: 1 1 auto; min-width: 0; }
  .ts-row-name {
    font-size: calc(var(--ui-fs) - 1.5px); font-weight: 700; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ts-on-ico { color: var(--accent); }
  .ts-row-desc {
    font-size: var(--ui-micro-fs); color: var(--text-3); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4;
  }
  .ts-row-side { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .ts-chip {
    display: inline-block; padding: 2px 8px; border-radius: 7px;
    background-color: var(--raised-chrome); border: 1px solid var(--border);
    color: var(--text-3); font-size: var(--ui-micro-fs); font-weight: 700;
    letter-spacing: 0.2px; max-width: 110px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .ts-meta { font-size: var(--ui-micro-fs); color: var(--text-3); font-weight: 600; }
  .ts-star {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 8px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text-3); font-size: 15px; cursor: pointer;
    font-family: inherit; touch-action: manipulation; line-height: 1;
  }
  /* v1.00.5: the hardcoded amber dies (the v0982 census finding) — the
     template star rides the theme's warn semantic (the same slot the
     model-browser stars use), triplet-composed like every themed tint */
  .ts-star-on { color: var(--warn); border-color: rgba(var(--warn-rgb), 0.55); background: rgba(var(--warn-rgb), 0.1); }
  .ts-empty { text-align: center; color: var(--text-3); font-size: var(--ui-small-fs); padding: 34px 18px; line-height: 1.6; }
  .ts-empty-title { font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
  .ts-empty-sub { font-size: var(--ui-micro-fs); }
  /* v0.48: brain-outage notice — rows below it still render (deep
     research stays pre-installed) */
  .ts-notice { text-align: center; color: var(--text-3); font-size: var(--ui-micro-fs); padding: 10px 14px; line-height: 1.7; border: 1px dashed var(--border); border-radius: 12px; margin: 8px 6px 4px; }
  .ts-notice .ts-act { margin-left: 6px; }
  .ts-empty-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .ts-empty-actions .ts-act { flex: 0 1 auto; padding: 7px 14px; }
  .ts-detail-head { padding: 2px 2px 10px; }
  .ts-detail-name { font-size: var(--ui-fs); font-weight: 700; color: var(--text-1); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ts-detail-desc { font-size: var(--ui-small-fs); color: var(--text-3); line-height: 1.55; margin-top: 6px; }
  .ts-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ts-detail-body { border-top: 1px solid var(--border); padding-top: 10px; }
  .ts-stage { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
  .ts-stage-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ts-stage-n {
    width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(var(--accent-rgb), 0.14); color: var(--text-1);
    font-size: var(--ui-micro-fs); font-weight: 700;
  }
  /* v0.44 var-twin: the step number chip layers the accent gradient
     over its tint (no-op while the accent is a solid) */
  .ts-stage-n { background-image: var(--accent-gradient, none); }
  .ts-stage-name { font-size: calc(var(--ui-fs) - 2px); font-weight: 700; color: var(--text-1); }
  .ts-stage-fo { font-size: var(--ui-micro-fs); color: var(--text-3); font-weight: 600; margin-top: 4px; }
  .ts-stage-ins { font-size: var(--ui-small-fs); color: var(--text-2); line-height: 1.5; margin-top: 6px; }
  .ts-detail-actions { display: flex; gap: 8px; margin: 12px 2px 2px; }
  .ts-md { font-size: var(--ui-small-fs); }

  /* ── markdown content (the .fmt scope formatter.js renders) ── */
  .fmt { color: var(--text-1); }
  .fmt p { margin: 0.45em 0; }
  .fmt p:first-child { margin-top: 0; }
  .fmt p:last-child { margin-bottom: 0; }
  .fmt h1, .fmt h2, .fmt h3, .fmt h4 {
    color: var(--fmt-bright); font-weight: 700; margin: 0.7em 0 0.35em;
    line-height: 1.3; letter-spacing: 0.1px;
  }
  .fmt h1 { font-size: 1.3em; border-bottom: 1px solid rgba(255,255,255,0.09); padding-bottom: 0.25em; }
  .fmt h2 { font-size: 1.18em; color: var(--fmt-a1); }
  .fmt h3 { font-size: 1.08em; color: var(--fmt-a2); }
  .fmt h4 { font-size: 1em; color: var(--fmt-a3); }
  .fmt strong { color: var(--fmt-bright); font-weight: 700; }
  .fmt em { color: var(--fmt-a3); font-style: italic; }
  .fmt del { color: var(--text-3); }
  .fmt ul, .fmt ol { margin: 0.45em 0; padding-left: 1.3em; }
  .fmt li { margin: 0.22em 0; }
  .fmt li::marker { color: var(--fmt-a2); }
  .fmt hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
  .fmt blockquote {
    margin: 0.5em 0; padding: 0.3em 0.85em;
    border-left: 3px solid var(--fmt-a2);
    background: rgba(var(--accent-2-rgb),0.05); border-radius: 0 8px 8px 0;
    color: var(--text-2);
  }
  .fmt blockquote p { margin: 0.25em 0; }
  .fmt a.fmt-link, .fmt-user a.fmt-link {
    color: var(--fmt-link); text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--fmt-link) 45%, transparent);
    text-underline-offset: 2px; font-weight: 600;
    cursor: pointer;
  }
  /* v0.65 FIX: user-bubble content INHERITS the bubble's ink. .fmt's
     text-1 used to paint OVER .msg-user's --on-accent — invisible user
     text on light accents (Mono's #d4d4d4 bubble + near-white body
     text, caught by the theme suite). Links keep their underline
     affordance but ride the same ink. (fmt-slot GRADIENT rules keep
     their higher specificity — a deliberate gradient slot wins.) */
  .fmt-user { color: inherit; }
  .fmt-user a.fmt-link {
    color: inherit;
    text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
  }
  .fmt-link-cue { color: var(--fmt-link); opacity: 0.75; font-size: 0.85em; }

  /* ── v0.44 GRADIENT TEXT — the fmt slot twins ─────────────────────
     formatter.js tags the document (data-fmt-grad on :root; the per-chat
     tweaks path can do the same on #chat-root — any ancestor works) with
     the space-separated list of slots whose spec actually PAINTS a
     gradient (multi-color or a pattern). Only then do these
     background-clip:text rules engage; solid slots render exactly the
     rules above, byte-for-byte.
     The glyph color is --fmt-<slot>-ink: formatter sets it to
     'transparent' next to the attribute (a fallback var(--fmt-<slot>)
     guards against a stray attribute with no twin — text NEVER
     vanishes); a scoped view (#chat-root) opts a slot OUT of a global
     gradient by overriding the ink with its solid hex.
     Families are capped at the four text carriers: headings(a1 — h2),
     emphasis(a3 — em + h4), strong(bright — strong + h1), links(link).
     INLINE CODE (.fmt-code-inline) is deliberately SOLID: it wears a
     surface chip — background-clip:text would clip the chip itself
     into text-shaped fragments and destroy the affordance. Links keep
     their underline (text-decoration-color resolves from the solid
     twin, independent of color:) so the affordance survives clipping. */
  [data-fmt-grad~="a1"] .fmt h2 {
    background-image: var(--fmt-a1-gradient, none);
    -webkit-background-clip: text; background-clip: text;
    color: var(--fmt-a1-ink, var(--fmt-a1));
  }
  /* v1.00.2 THE GRADIENT-TEXT TIERS (PART E, ratified): short static
     gradient moments paint LOCAL-BOX — one paint per element, native
     scroll, ZERO projection (the fixed-attachment illusion is the
     OBJECT track's design; text clip:text can never ride an L2 layer,
     so the shared-field emulation only ever bought the per-motion
     re-raster tax on the phone). Body/long text stays solid ink. */
  [data-fmt-grad~="a3"] .fmt em,
  [data-fmt-grad~="a3"] .fmt h4 {
    background-image: var(--fmt-a3-gradient, none);
    -webkit-background-clip: text; background-clip: text;
    color: var(--fmt-a3-ink, var(--fmt-a3));
  }
  [data-fmt-grad~="bright"] .fmt strong,
  [data-fmt-grad~="bright"] .fmt h1 {
    background-image: var(--fmt-bright-gradient, none);
    -webkit-background-clip: text; background-clip: text;
    color: var(--fmt-bright-ink, var(--fmt-bright));
  }
  [data-fmt-grad~="link"] .fmt a.fmt-link,
  [data-fmt-grad~="link"] .fmt-user a.fmt-link {
    background-image: var(--fmt-link-gradient, none);
    -webkit-background-clip: text; background-clip: text;
    color: var(--fmt-link-ink, var(--fmt-link));
  }
  /* ── v0.28 MEDIA EMBEDS (user spec: clickable / expandable / zoom / redirect) ── */
  .fmt-media-img {
    display: block; max-width: min(100%, 460px); max-height: 62vh;
    border-radius: 10px; border: 1px solid var(--border);
    margin: 0.5em 0; cursor: zoom-in;
    object-fit: contain; background: var(--bg-app);
  }
  .fmt-yt {
    margin: 0.55em 0; max-width: min(100%, 460px);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    cursor: pointer; background: var(--surface-1);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .fmt-yt-thumb { position: relative; padding-top: 56.25%; background: color-mix(in srgb, var(--bg-panel) 90%, #000); }
  .fmt-yt-thumbimg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .fmt-yt-play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: calc(46px * var(--chat-scale)); height: calc(46px * var(--chat-scale)); border-radius: 50%;
    background: rgba(255,0,0,0.85); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(19px * var(--chat-scale)); padding-left: 4px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.55);
  }
  .fmt-yt:active .fmt-yt-play { background: #f00; }
  .fmt-yt-cap {
    padding: calc(7px * var(--chat-scale)) calc(11px * var(--chat-scale)); font-size: calc(var(--chat-fs) * 0.74);
    color: var(--text-2); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fmt-yt-open { color: var(--fmt-link); opacity: 0.75; font-size: 0.85em; }
  /* v0.62.1: the in-place player (formatter.js playYTInPlace) */
  .fmt-yt-player {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #000; z-index: 2;
  }
  .fmt-yt-pip {
    position: absolute; right: 8px; top: 8px; z-index: 3;
    width: calc(30px * var(--chat-scale)); height: calc(30px * var(--chat-scale));
    border-radius: 8px; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg-panel) 82%, #000);
    color: var(--text-1); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(15px * var(--chat-scale)); font-family: inherit;
    opacity: 0.85;
  }
  .fmt-yt-pip:active { opacity: 1; }
  /* ── v0.62.1: the universal link cards (linkviewer.js) — every
     external link opens IN the app; theme vars only ── */
  .lv-card {
    margin: 0.4em 0; max-width: min(100%, 560px);
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface-1); overflow: hidden;
    font-size: calc(var(--chat-fs) * 0.8);
  }
  .lv-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px 5px; }
  .lv-favi { width: 16px; height: 16px; border-radius: 4px; flex: none; background: var(--surface-2); }
  .lv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-1); font-weight: 600; }
  .lv-host { color: var(--text-3); flex: none; font-size: 0.9em; max-width: 40%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-x { background: none; border: none; color: var(--text-3); cursor: pointer;
    font-size: 14px; padding: 2px 4px; font-family: inherit; flex: none; }
  .lv-body { padding: 0 10px 10px; }
  .lv-frame { width: 100%; aspect-ratio: 16 / 10; border: 0; border-radius: 8px;
    background: var(--surface-2); display: block; }
  .lv-frame.tall { aspect-ratio: 16 / 9; }
  .lv-img { max-width: 100%; max-height: 380px; border-radius: 8px; display: block;
    cursor: zoom-in; background: var(--surface-2); }
  .lv-video { width: 100%; max-height: 400px; border-radius: 8px; display: block;
    background: #000; }
  .lv-desc { color: var(--text-2); line-height: 1.45; margin: 2px 0 8px; }
  .lv-ogimg { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px;
    display: block; margin-bottom: 8px; background: var(--surface-2); }
  .lv-open { display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface-2); color: var(--text-1);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 11px; font-size: 0.92em; cursor: pointer; font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  /* v0.63.4: the frameable/pdf card's ⤢ row (opens THE DOCK) */
  .lv-openwrap { margin-top: 8px; }
  .lv-note { color: var(--text-3); font-size: 0.9em; }
  .lv-loadbar { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: lv-sweep 1s linear infinite; }
  @keyframes lv-sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  /* the fullscreen pinch-zoom overlay (MediaZoom in formatter.js) */
  #media-zoom {
    position: fixed; inset: 0; z-index: 9999; display: none;
    background: rgba(var(--bg-panel-rgb), 0.94); touch-action: none;
  }
  #media-zoom.open { display: flex; align-items: center; justify-content: center; }
  #media-zoom #mz-img {
    max-width: 96vw; max-height: 92vh; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
    transition: transform 0.06s linear;
  }
  #media-zoom #mz-close, #media-zoom #mz-open {
    position: absolute; top: max(10px, env(safe-area-inset-top));
    background: rgba(var(--bg-app-rgb, 10,10,11), 0.85); border: 1px solid rgba(255,255,255,0.18);
    color: #fff; border-radius: 9px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #media-zoom #mz-close { right: 12px; }
  #media-zoom #mz-open { left: 12px; }
  .fmt-code-inline {
    background: var(--surface-2); color: var(--fmt-a1);
    padding: calc(1.5px * var(--chat-scale)) calc(6px * var(--chat-scale)); border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.88em; border: 1px solid var(--border);
    overflow-wrap: break-word; word-break: break-word;
  }
  /* code CARD: header (lang + copy + save) + scrollable body —
     v0.34: the whole card rides --chat-scale (was fixed to the ui sizes;
     code stayed tiny under a big chat font = the misalignment complaint) */
  .fmt-codecard {
    margin: 0.55em 0; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-1); overflow: hidden; max-width: 100%;
  }
  .fmt-codehead {
    display: flex; align-items: center; gap: calc(8px * var(--chat-scale));
    background: color-mix(in srgb, var(--bg-panel) 82%, #000); padding: calc(5px * var(--chat-scale)) calc(10px * var(--chat-scale));
    border-bottom: 1px solid var(--border);
  }
  .fmt-codelang {
    font-size: calc(var(--chat-fs) * 0.62); font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--fmt-a2);
    font-family: ui-monospace, Menlo, monospace;
  }
  .fmt-cbtn {
    background: transparent; border: 1px solid var(--border); color: var(--text-3);
    padding: calc(3px * var(--chat-scale)) calc(9px * var(--chat-scale)); border-radius: 6px; font-size: calc(var(--chat-fs) * 0.68);
    font-family: inherit; font-weight: 600; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .fmt-cbtn:active { background: var(--border); color: var(--fmt-bright); }
  .fmt-cbtn-save { color: var(--fmt-a3); border-color: color-mix(in srgb, var(--fmt-a3) 40%, var(--border)); }
  .fmt-codecard .fmt-pre { margin: 0; padding: calc(10px * var(--chat-scale)) calc(12px * var(--chat-scale)); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fmt-codecard pre { margin: 0; padding: calc(10px * var(--chat-scale)) calc(12px * var(--chat-scale)); overflow-x: auto; background: transparent; }
  .fmt-codetext {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: calc(var(--chat-fs) * 0.8); line-height: 1.5; color: var(--text-1);
    tab-size: 2; white-space: pre;
  }
  .fmt table { border-collapse: collapse; margin: 0.5em 0; font-size: 0.92em; width: 100%; }
  .fmt-tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  /* v0.41 polish: a header band + a hover tint for row tracking on wide
     tables (cells themselves styled further below). */
  .fmt table thead th {
    background: rgba(var(--accent-rgb), 0.10);
    font-weight: 700;
    color: var(--text-1);
  }
  .fmt table tbody tr:hover td { background: rgba(var(--accent-rgb), 0.06); }
  @media (hover: none) { .fmt table tbody tr:hover td { background: transparent; } }
  .fmt th { color: var(--fmt-a2); font-weight: 700; }
  .fmt th, .fmt td { border: 1px solid var(--border); padding: calc(5px * var(--chat-scale)) calc(9px * var(--chat-scale)); text-align: left; }
  .fmt tr:nth-child(2n) { background: rgba(255,255,255,0.02); }
  .fmt-cursor {
    display: inline-block; width: 7px; height: 1.05em;
    background: var(--fmt-a1); margin-left: 2px; vertical-align: text-bottom;
    animation: blink 1s infinite; border-radius: 1px;
  }
  /* thinking scope — dimmed markdown + stats line */
  .fmt-thinking { color: var(--text-3); }
  .fmt-thinking h1, .fmt-thinking h2, .fmt-thinking h3 { color: var(--text-2); }
  .fmt-thinking strong { color: var(--text-2); }
  .fmt-th-stats {
    font-size: calc(var(--ui-small-fs) - 1.5px); color: var(--text-3); margin-bottom: 4px;
    font-variant-numeric: tabular-nums; letter-spacing: 0.3px;
  }
  .msg-think {
    align-self: stretch; max-width: 95%;
    background: rgba(var(--accent-rgb),0.06);
    border: 1px solid rgba(var(--accent-rgb),0.2);
    border-radius: 10px; padding: calc(8px * var(--chat-scale)) calc(12px * var(--chat-scale));
  }
  .msg-think-summary {
    font-size: calc(var(--chat-fs) * 0.75); color: var(--text-2); cursor: pointer;
    user-select: none; -webkit-user-select: none;
    display: flex; align-items: center; gap: calc(6px * var(--chat-scale));
  }
  /* v0.24: live elapsed chip on the thinking summary — ticks while the
     model reasons (visible even when the bubble is collapsed). */
  .th-elapsed {
    font-size: calc(var(--chat-fs) * 0.62); color: var(--text-3, var(--text-3));
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  /* v0.25: the blinking live dot is GONE (user spec: "remove the
     flickering circle — the yellow cursor is enough"). The elapsed
     chip + the streaming cursor carry the aliveness now. */
  .msg-think-body {
    font-size: calc(var(--chat-fs) * 0.77); color: var(--text-3); margin-top: calc(6px * var(--chat-scale));
    max-height: calc(260px * var(--chat-scale)); overflow-y: auto; background: transparent; padding: 0;
    max-width: 100%;
  }

  /* ── artifact card (in-message) ── */
  .fmt-artifact {
    display: flex; align-items: center; gap: calc(10px * var(--chat-scale));
    margin: 0.6em 0; padding: calc(10px * var(--chat-scale)) calc(12px * var(--chat-scale));
    background: linear-gradient(135deg, rgba(var(--accent-2-rgb),0.08), rgba(var(--accent-2-rgb),0.04));
    border: 1px solid color-mix(in srgb, var(--fmt-a3) 45%, var(--border));
    border-radius: 12px; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .fmt-artifact-ico { font-size: calc(20px * var(--chat-scale)); flex-shrink: 0; }
  .fmt-artifact-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fmt-artifact-name { color: var(--fmt-bright); font-weight: 700; font-size: calc(var(--chat-fs) - 1px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmt-artifact-sub { color: var(--text-3); font-size: calc(var(--chat-fs) * 0.66); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmt-artifact-dl {
    background: rgba(var(--accent-2-rgb),0.12); border: 1px solid rgba(var(--accent-2-rgb),0.4);
    color: var(--fmt-link); border-radius: 8px; padding: calc(5px * var(--chat-scale)) calc(10px * var(--chat-scale));
    font-size: calc(var(--chat-fs) - 1px); cursor: pointer; flex-shrink: 0;
    touch-action: manipulation; font-family: inherit;
  }

  /* ── v0.23 ACTIVITY INDICATOR (the no-silence guarantee) ──
     One compact row at the end of the message list while a turn runs:
     five pulsing dots + phase text ("building bundle.zip · 12.4 KB") +
     elapsed seconds + a slim sweeping progress line. The chat must never
     sit frozen with hidden background work. */
  .chat-working {
    align-self: flex-start;
    display: flex; align-items: center; gap: calc(9px * var(--chat-scale));
    padding: calc(8px * var(--chat-scale)) calc(12px * var(--chat-scale)) calc(9px * var(--chat-scale));
    border-radius: 12px;
    background: rgba(var(--accent-rgb),0.05);
    border: 1px solid rgba(var(--accent-rgb),0.18);
    font-size: calc(var(--chat-fs) * 0.7); color: var(--text-2);
    position: relative; overflow: hidden;
    max-width: 92%;
    animation: cwk-in 0.18s ease-out;
  }
  @keyframes cwk-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .cwd { display: inline-flex; gap: 3.5px; align-items: center; flex-shrink: 0; }
  .cwd i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: cwd-pulse 0.9s ease-in-out infinite;
  }
  /* v0.44 var-twin: the working dots follow the accent gradient */
  .cwd i { background-image: var(--accent-gradient, none); }
  .cwd i:nth-child(2) { animation-delay: 0.12s; }
  .cwd i:nth-child(3) { animation-delay: 0.24s; }
  .cwd i:nth-child(4) { animation-delay: 0.36s; }
  .cwd i:nth-child(5) { animation-delay: 0.48s; }
  @keyframes cwd-pulse {
    0%, 100% { opacity: 0.18; transform: scale(0.82); }
    45%      { opacity: 1;   transform: scale(1.12); }
  }
  /* v0.35: the wait phase text now WRAPS (up to 2 lines) — the OpenCode 401
     "free tier can only be used…" message and long provider notices were
     single-line-ellipsized and unreadable on a phone. */
  .cwt { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; word-break: break-word; overflow-wrap: anywhere; }
  .cwe { color: var(--text-3); font-size: calc(var(--ui-small-fs) - 2px); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .cwk-bar {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb),0.55), transparent);
    background-size: 45% 100%;
    background-repeat: no-repeat;
    animation: cwk-sweep 1.4s linear infinite;
  }
  @keyframes cwk-sweep {
    0%   { background-position: -45% 0; }
    100% { background-position: 145% 0; }
  }

  /* ── v0.36 STALL ESCALATION — 120s of total silence ──
     The row turns honest: warn tones (theme vars only), the dots slow to
     an "on hold" cadence, the sweep line pauses, and a ⇄ switch-model
     chip appears so the user can act on the stuck turn immediately. */
  .chat-working-stalled {
    background: rgba(var(--warn-rgb),0.07);
    border-color: rgba(var(--warn-rgb),0.45);
    color: var(--text-1);
    flex-wrap: wrap;
    animation: cwk-stall-in 0.3s ease-out;
  }
  @keyframes cwk-stall-in {
    from { background: rgba(var(--accent-rgb),0.05); border-color: rgba(var(--accent-rgb),0.18); }
    to   { background: rgba(var(--warn-rgb),0.07);   border-color: rgba(var(--warn-rgb),0.45); }
  }
  .chat-working-stalled .cwd i {
    background: var(--warn);
    animation-duration: 2.2s; /* the "still there, but on hold" pulse */
  }
  .chat-working-stalled .cwt { color: var(--warn); }
  .chat-working-stalled .cwk-bar { animation-play-state: paused; opacity: 0.5; }
  .chat-working-stalled .cwe { color: rgba(var(--warn-rgb),0.75); }
  .cw-switch {
    flex: 1 0 100%;
    margin-top: calc(6px * var(--chat-scale));
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: calc(7px * var(--chat-scale)) calc(12px * var(--chat-scale));
    border-radius: 9px;
    background: rgba(var(--warn-rgb),0.12);
    border: 1px solid rgba(var(--warn-rgb),0.55);
    color: var(--warn);
    font-family: inherit;
    font-size: calc(var(--chat-fs) * 0.72);
    font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .cw-switch:active { transform: scale(0.97); }
  @media (hover: hover) {
    .cw-switch:hover {
      background: rgba(var(--warn-rgb),0.2);
      border-color: rgba(var(--warn-rgb),0.8);
    }
  }

  /* ── tool pills (center-aligned, tappable → expand) — v0.34: chat-scaled ── */
  .tool-pill {
    align-self: center; max-width: 92%;
    border-radius: 999px; padding: calc(6px * var(--chat-scale)) calc(12px * var(--chat-scale));
    font-size: calc(var(--chat-fs) * 0.72); font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: border-radius 0.18s, background 0.18s;
  }
  .tool-pill[data-expanded="1"] { border-radius: 12px; }
  .tool-pill-head { display: flex; align-items: center; gap: calc(7px * var(--chat-scale)); overflow: hidden; }
  .tool-pill-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tool-pill[data-expanded="1"] .tool-pill-text { white-space: normal; overflow-wrap: anywhere; }
  /* v0.28: long links inside pills WRAP — never overflow the pill box
     (user spec item 2). Collapsed+expanded, links + detail rows. */
  .tool-pill { overflow-wrap: anywhere; }
  .tool-pill-detail { min-width: 0; }
  .tool-pill-row { min-width: 0; }
  .tool-pill-row > span { min-width: 0; overflow-wrap: anywhere; }
  .tool-pill-chev { font-size: calc(var(--chat-fs) * 0.6); color: currentColor; opacity: 0.7; flex-shrink: 0; }
  .tool-pill-use { color: var(--text-1); background: rgba(var(--accent-2-rgb),0.07); border: 1px solid rgba(var(--accent-2-rgb),0.35); }
  .tool-pill-result { color: var(--ok); background: rgba(var(--ok-rgb),0.06); border: 1px solid rgba(var(--ok-rgb),0.25); }
  .tool-pill-progress { color: var(--text-3); background: transparent; border: 1px dashed var(--border); }
  .tool-pill-detail {
    margin-top: calc(8px * var(--chat-scale)); padding-top: calc(8px * var(--chat-scale));
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: calc(6px * var(--chat-scale));
    font-size: calc(var(--chat-fs) * 0.72); text-align: left;
  }
  .tool-pill-row { display: flex; gap: calc(8px * var(--chat-scale)); align-items: baseline; }
  .tool-pill-k {
    color: var(--text-3); font-size: calc(9.5px * var(--chat-scale)); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
  }
  .tool-pill-pre {
    font-family: ui-monospace, Menlo, monospace; font-size: calc(10.5px * var(--chat-scale));
    white-space: pre-wrap; word-break: break-word; color: var(--text-2);
    max-height: calc(220px * var(--chat-scale)); overflow-y: auto; max-width: 100%;
  }
  .tool-pill-link {
    display: block; color: var(--fmt-link); text-decoration: none;
    font-size: calc(var(--chat-fs) * 0.62);
    white-space: normal; overflow-wrap: anywhere; word-break: break-all;
    padding: 1px 0;
  }

  /* ── sources cards (tappable, pretty) — v0.34 chat-scaled; v0.38 COLLAPSIBLE ── */
  .src-wrap {
    align-self: stretch; max-width: 95%;
    /* v0.72: the box's own field is the OVERLAY background (its Layer
       rule windows bg-app + the border ring); the old surface-2 divider
       read as a hairline from the wrong family. */
    background: var(--bg-app); border: 1px solid var(--border);
    border-radius: 12px; padding: calc(8px * var(--chat-scale)) calc(10px * var(--chat-scale));
  }
  .src-wrap > .src-wrap-label {
    display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
    list-style: none; margin-bottom: 0;
    font-size: calc(9.5px * var(--chat-scale)); color: var(--text-3); letter-spacing: 0.8px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .src-wrap[open] > .src-wrap-label { margin-bottom: calc(6px * var(--chat-scale)); }
  .src-wrap .src-wrap-label::-webkit-details-marker { display: none; }
  .src-wrap .src-count {
    background: rgba(var(--accent-2-rgb), 0.14); color: var(--text-1);
    border-radius: 999px; padding: 0 7px; font-weight: 700; letter-spacing: 0;
    font-size: calc(9px * var(--chat-scale));
  }
  .src-wrap .src-chev { margin-left: auto; transition: transform 0.18s ease; color: var(--text-3); }
  .src-wrap[open] .src-chev { transform: rotate(0deg); }
  .src-wrap:not([open]) .src-chev { transform: rotate(-90deg); }
  .src-card {
    display: flex; align-items: center; gap: calc(10px * var(--chat-scale));
    padding: calc(7px * var(--chat-scale)) calc(8px * var(--chat-scale)); border-radius: 10px; text-decoration: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .src-card:active { background: var(--surface-3); }
  .src-card-dom {
    width: calc(26px * var(--chat-scale)); height: calc(26px * var(--chat-scale)); border-radius: 7px; flex-shrink: 0;
    background: rgba(var(--accent-2-rgb),0.1); border: 1px solid rgba(var(--accent-2-rgb),0.3);
    color: var(--fmt-a1); font-weight: 700; font-size: calc(var(--chat-fs) * 0.77);
    display: flex; align-items: center; justify-content: center;
  }
  .src-card-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .src-card-title {
    color: var(--text-2); font-size: calc(var(--chat-fs) * 0.77); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .src-card-sub { color: var(--text-3); font-size: calc(var(--chat-fs) * 0.64); }

  /* ── v0.52 dt_hublib: the PUBLIC HUB card box (the sources pattern, with
     one-press download buttons). Theme variables ONLY — no hex anywhere. ── */
  .hub-wrap {
    align-self: stretch; max-width: 95%;
    background: var(--bg-app); border: 1px solid var(--border);
    border-radius: 12px; padding: calc(8px * var(--chat-scale)) calc(10px * var(--chat-scale));
  }
  .hub-wrap > .hub-wrap-label {
    display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
    list-style: none; margin-bottom: 0;
    font-size: calc(9.5px * var(--chat-scale)); color: var(--text-3); letter-spacing: 0.8px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-wrap[open] > .hub-wrap-label { margin-bottom: calc(6px * var(--chat-scale)); }
  .hub-wrap .hub-wrap-label::-webkit-details-marker { display: none; }
  .hub-count {
    background: rgba(var(--accent-2-rgb), 0.14); color: var(--text-1);
    border-radius: 999px; padding: 0 7px; font-weight: 700; letter-spacing: 0;
    font-size: calc(9px * var(--chat-scale));
  }
  .hub-chev { margin-left: auto; transition: transform 0.18s ease; color: var(--text-3); }
  .hub-wrap[open] .hub-chev { transform: rotate(0deg); }
  .hub-wrap:not([open]) .hub-chev { transform: rotate(-90deg); }
  .hub-list { display: flex; flex-direction: column; gap: calc(5px * var(--chat-scale)); }
  /* v0.54 RENAME: the in-chat hub cards are .hmsg-* now — the old
     .hub-card name collided with the PUBLIC LIBRARY cards (equal
     specificity, so this block's align-items:center + gap leaked onto
     the library grid and broke its column layout — icons shifted per
     text length, the user-reported displacement bug). */
  .hmsg-card {
    display: flex; align-items: center; gap: calc(10px * var(--chat-scale));
    padding: calc(7px * var(--chat-scale)) calc(8px * var(--chat-scale)); border-radius: 10px;
    background: var(--surface-2); border: 1px solid transparent;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer;
    min-height: calc(44px * var(--chat-scale)); /* touch target */
  }
  .hmsg-card:active { background: var(--surface-3); }
  .hmsg-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hmsg-card-ico {
    width: calc(26px * var(--chat-scale)); height: calc(26px * var(--chat-scale)); border-radius: 7px; flex-shrink: 0;
    background: rgba(var(--accent-2-rgb),0.1); border: 1px solid rgba(var(--accent-2-rgb),0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--chat-fs) * 0.72);
  }
  .hmsg-card-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .hmsg-card-title {
    color: var(--text-2); font-size: calc(var(--chat-fs) * 0.77); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hmsg-card-title .hub-have { color: var(--ok); }
  .hmsg-card-sub {
    color: var(--text-3); font-size: calc(var(--chat-fs) * 0.64);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hmsg-card-stats {
    color: var(--text-3); font-size: calc(var(--chat-fs) * 0.58);
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hmsg-dl {
    flex-shrink: 0; width: calc(34px * var(--chat-scale)); height: calc(34px * var(--chat-scale));
    border-radius: 9px; border: 1px solid rgba(var(--accent-2-rgb),0.35);
    background: rgba(var(--accent-2-rgb),0.07); color: var(--text-1);
    font-size: calc(15px * var(--chat-scale)); font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .hmsg-dl:active { background: rgba(var(--accent-2-rgb),0.2); }
  .hmsg-dl:disabled { cursor: default; }
  .hmsg-dl.hmsg-dld {
    background: rgba(var(--ok-rgb),0.08); border-color: rgba(var(--ok-rgb),0.3);
    color: var(--ok);
  }

  /* in-chat search highlight */
  mark.chat-search-mark { background: rgba(250,204,21,0.35); color: inherit; border-radius: 3px; }
  mark.chat-search-mark.chat-search-current { background: rgba(250,204,21,0.85); color: #1a1a0e; font-weight: 700; }

  /* ── v0.18: snap-state panel (gesture.js — TWO positions only) ── */
  #chat-panel.panel-full {
    /* v0.42: height !important deleted — the sheet is always 100dvh;
       only the full-state chrome polish remains */
    border-radius: 0;
    padding-top: 4px;
  }

  /* ── message action sheet (long-press) ── */
  .msg-action-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; color: var(--text-1);
    padding: 11px 14px; font-size: var(--ui-fs); font-weight: 500;
    border-radius: 9px; cursor: pointer; font-family: inherit;
    text-align: left; touch-action: manipulation;
  }
  .msg-action-btn:active { background: var(--border); }
  .msg-action-ico { color: var(--fmt-a1); font-size: calc(var(--ui-fs) + 2px); width: 18px; }
  /* v0.37: timestamp subtitle anchoring the sheet to its message. */
  .msg-action-ts {
    padding: 8px 14px 2px; font-size: 11px; font-weight: 600;
    color: var(--text-3); font-variant-numeric: tabular-nums;
    letter-spacing: 0.3px; border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  /* v0.37: destructive actions (delete) read as such. */
  .msg-action-danger .msg-action-ico { color: var(--err); }
  .msg-action-danger { color: var(--err); }
  .msg-action-danger:active { background: rgba(var(--err-rgb), 0.12); }

  /* ── Prism tokens (custom scheme-aware theme) ── */
  .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--text-3-dim); font-style: italic; }
  .token.punctuation { color: var(--text-3); }
  .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: var(--fmt-a3); }
  .token.boolean, .token.number { color: var(--warn); }
  .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: var(--fmt-a2); }
  .token.operator, .token.entity, .token.url { color: var(--text-2); }
  .token.atrule, .token.attr-value, .token.keyword { color: var(--fmt-a1); font-weight: 600; }
  .token.function, .token.class-name { color: var(--fmt-a3); }
  .token.regex, .token.important, .token.variable { color: var(--fmt-link); }

  /* ══ v0.17 — ARTIFACTS DRAWER + EDITOR ══ */
  #artifacts-overlay { font-family: inherit; }
  #artifacts-overlay.open .art-panel { transform: translateY(0); opacity: 1; }
  .art-scrim {
    position: absolute; inset: 0;
    /* v0.74: the full-screen blur is GONE (the user's "remove all
       these effects and just render over whatever was before").
       v0.77 THE POST-PROCESS REMOVAL (user spec: "remove the blur and
       other post process effects we apply to the background or anything
       that isn't the overlay screen"): the 0.55 veil is gone TOO — the
       background renders UNTOUCHED behind the drawer (which carries its
       own opaque surface). The element stays as the tap-to-close
       surface. */
    background: transparent;
  }
  .art-panel {
    position: absolute; left: 0; right: 0; bottom: 0; top: 6vh;
    background: var(--surface-1); border: 1px solid var(--border); border-bottom: none;
    border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(30px); opacity: 0;
    transition: transform 0.24s cubic-bezier(0.32,0.72,0,1), opacity 0.2s;
    box-shadow: 0 -12px 48px rgba(0,0,0,0.6);
  }
  .art-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    /* v0.98.1: the head is the sheet's drag handle (slide down to
       dismiss, like the regular panels) — touches starting here belong
       to the drag, never to scroll. */
    touch-action: none; cursor: grab;
  }
  .art-title { font-size: calc(var(--ui-fs) + 1px); font-weight: 700; color: var(--text-1); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-count { font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3); flex-shrink: 0; }
  .art-close, .art-back {
    background: transparent; border: none; color: var(--text-3);
    font-size: 20px; cursor: pointer; padding: 4px 10px; flex-shrink: 0;
    font-family: inherit; touch-action: manipulation;
  }
  .art-body { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .art-loading, .art-empty { color: var(--text-3); font-size: calc(var(--ui-fs) - 1px); text-align: center; padding: 28px 10px; }
  .art-empty-sub { color: var(--text-3-dim); font-size: calc(var(--ui-small-fs) - 0.5px); text-align: center; padding: 0 20px; line-height: 1.6; }
  .art-row {
    display: flex; align-items: center; gap: 11px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 12px; margin-bottom: 9px; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .art-row:active { background-color: var(--surface-3); }
  .art-row-ico { font-size: 19px; flex-shrink: 0; width: 24px; text-align: center; }
  .art-row-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .art-row-name { color: var(--text-1); font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-row-sub { color: var(--text-3); font-size: calc(var(--ui-small-fs) - 1.5px); }
  .art-row-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-3);
    border-radius: 7px; padding: 5px 8px; font-size: var(--ui-small-fs); cursor: pointer;
    flex-shrink: 0; font-family: inherit; touch-action: manipulation;
  }
  .art-row-btn:active { background: var(--border); }
  .art-row-btn-danger { color: var(--err); border-color: rgba(var(--err-rgb),0.3); }
  .art-rename-input {
    flex: 1; background-color: var(--raised-chrome); border: 1px solid var(--fmt-a1);
    color: var(--text-1); border-radius: 6px; padding: 4px 8px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  .art-confirm { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .art-confirm-label { color: var(--err); font-size: calc(var(--ui-small-fs) - 2px); }
  .art-confirm-yes, .art-confirm-no {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-1); font-size: 11px; padding: 4px 9px; cursor: pointer; font-family: inherit;
  }
  .art-confirm-yes { color: var(--err); border-color: rgba(var(--err-rgb),0.4); }
  .art-ed-actions { display: flex; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
  .art-ed-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-2);
    border-radius: 8px; padding: 6px 12px; font-size: var(--ui-small-fs); font-weight: 600;
    cursor: pointer; font-family: inherit; flex-shrink: 0; touch-action: manipulation;
  }
  .art-ed-btn.dirty { color: var(--fmt-a1); border-color: rgba(var(--accent-2-rgb),0.5); background: rgba(var(--accent-2-rgb),0.07); }
  .art-ed-btn:disabled { opacity: 0.45; }
  .art-ed-btn-danger { color: var(--err); border-color: rgba(var(--err-rgb),0.35); }
  .art-ed-body { flex: 1; min-height: 0; position: relative; background: var(--surface-1); }
  .art-cm-host { position: absolute; inset: 0; }
  .art-cm-host .CodeMirror { height: 100%; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }

  /* ── v0.29 THE FILE TREE (wunderbaum, vendored MIT — dist/wunderbaum.css
     is loaded lazily; these overrides re-skin it to the app's dark theme,
     VS-Code-style: root folders flush-left, one indent per nesting level,
     collapsible, VIRTUAL SCROLLING so a whole monorepo (100k+ nodes) stays
     smooth — only the visible rows ever exist in the DOM). ───────────── */
  .art-tree {
    height: 100%;
    --wb-font-stack: inherit;
    --wb-row-outer-height: 34px;
    --wb-row-inner-height: 32px;
    --wb-node-text-color: var(--text-1);
    --wb-border-color: var(--border);
    --wb-background-color: transparent;
    --wb-background-color-dark: transparent;
    --wb-alternate-row-color: transparent;
    --wb-hover-color: rgba(var(--accent-2-rgb), 0.07);
    --wb-active-color: rgba(var(--accent-2-rgb), 0.14);
    --wb-active-cell-color: transparent;
    --wb-active-border-color: transparent;
    --wb-focus-border-color: transparent;
    --wb-grid-color: transparent;
    --wb-header-color: transparent;
    --wb-error-color: var(--err);
    font-size: var(--ui-fs);
  }
  .art-tree.wb-tree { background: transparent; }
  /* wunderbaum rows are position:absolute with only `top` set inline —
     `left` falls back to the ambiguous static position, which can shift
     an activated row leftward under some event orders. Pin it. */
  .art-tree .wb-row { left: 0; }
  .art-tree .wb-row {
    border-radius: 8px; cursor: pointer; margin: 0 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .art-tree .wb-row.wb-active .wb-col,
  .art-tree .wb-row.wb-active { background: transparent; }
  .art-tree .wb-row.wb-active > .wb-col span.wb-node { background: transparent; }
  .art-tree .wb-row:active { background: rgba(var(--accent-2-rgb), 0.10); }
  .art-tree .wb-col-span-title, .art-tree .wb-node span.wb-title {
    color: var(--text-1); font-weight: 500;
  }
  .art-tree .wb-node span.wb-icon { display: none; } /* we draw our own emoji icons */
  .art-tree .ft-ico {
    display: inline-block; width: 22px; text-align: center;
    margin-right: 6px; font-size: 15px; flex-shrink: 0;
  }
  .art-tree .wb-folder-closed .ft-ico, .art-tree span.ft-folder { opacity: 0.92; }
  .art-tree .wb-node.wb-folder .ft-ico, .art-tree .wb-row[data-wb-folder] .ft-ico { opacity: 0.92; }
  .art-tree .wb-col.ftc-size, .art-tree .wb-col.ftc-date {
    color: var(--text-3); font-size: calc(var(--ui-small-fs) - 1px);
    font-variant-numeric: tabular-nums; text-align: right; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
  }
  .art-tree .wb-col.ftc-act { flex-shrink: 0; text-align: center; }
  .art-tree .wb-expander { color: var(--text-3); }
  .art-tree .art-act-btn {
    background: transparent; border: none; color: var(--text-3);
    font-size: 15px; line-height: 1; padding: 4px 7px; cursor: pointer;
    border-radius: 6px; font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .art-tree .art-act-btn:active { background: var(--surface-2); color: var(--text-1); }
  /* the ⋯ action strip (mobile action sheet at the bottom of the drawer) */
  .art-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
    background: var(--surface-1); border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateY(110%); transition: transform 0.22s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .art-sheet.open { transform: translateY(0); }
  .art-sheet-name {
    color: var(--text-1); font-weight: 700; font-size: var(--ui-fs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 2px 10px;
  }
  .art-sheet-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background-color: var(--raised-chrome); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text-1); font-size: var(--ui-fs); font-weight: 600;
    padding: 13px 14px; margin-bottom: 7px; cursor: pointer; font-family: inherit;
    text-align: left; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .art-sheet-btn:active { background: var(--surface-1); }
  .art-sheet-btn.danger { color: var(--err); border-color: rgba(var(--err-rgb),0.3); }
  .art-sheet-cancel { justify-content: center; opacity: 0.75; margin-bottom: 0; }
  .art-sheet-ico { width: 22px; text-align: center; flex-shrink: 0; }
  .art-sheet-input {
    width: 100%; background-color: var(--raised-chrome); border: 1px solid var(--fmt-a1);
    border-radius: 8px; color: var(--text-1); font-size: var(--ui-fs);
    padding: 12px 12px; font-family: inherit; outline: none; margin-bottom: 8px;
  }

  /* ── v0.23 VIEWERS (docx · xlsx · archives) ── */
  .vw-xlsx, .vw-arch { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .vw-doc { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .vw-doc { padding: 22px 20px 40px; max-width: 720px; margin: 0 auto; color: var(--text-1); font-size: var(--ui-fs); line-height: 1.62; }
  .vw-title { font-size: 24px; font-weight: 800; text-align: center; color: var(--text-1); margin: 10px 0 18px; }
  .vw-h1 { font-size: calc(var(--ui-fs) + 4px); font-weight: 700; color: var(--text-1); margin: 20px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .vw-h2 { font-size: 15.5px; font-weight: 700; color: var(--text-1); margin: 16px 0 6px; }
  .vw-quote { border-left: 3px solid var(--fmt-a2, var(--accent)); padding: 4px 12px; margin: 10px 0; color: var(--text-2); font-style: italic; background: rgba(var(--accent-rgb),0.04); border-radius: 0 8px 8px 0; }
  .vw-li { margin: 4px 0 4px 4px; }
  .vw-li-bullet::before { content: "•"; color: var(--fmt-a2, var(--accent)); margin-right: 9px; }
  .vw-li-num { counter-increment: vwn; }
  .vw-li-num::before { content: counter(vwn) "."; color: var(--fmt-a2, var(--accent)); margin-right: 9px; font-weight: 700; font-size: var(--ui-small-fs); }
  .vw-p { margin: 8px 0; }
  .vw-b { font-weight: 700; color: var(--text-1); }
  .vw-sheets { display: flex; gap: 6px; padding: 10px 12px 0; overflow-x: auto; flex-shrink: 0; }
  .vw-tab {
    background: transparent; border: 1px solid var(--border); color: var(--text-2);
    padding: 5px 14px; border-radius: 8px 8px 0 0; font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .vw-tab[data-on="1"] { background: rgba(var(--accent-2-rgb),0.08); border-color: rgba(var(--accent-2-rgb),0.4); color: var(--text-1); }
  .vw-sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .vw-table { border-collapse: collapse; font-size: var(--ui-small-fs); min-width: 40%; }
  .vw-table td { border: 1px solid var(--border); padding: 5px 10px; color: var(--text-2); white-space: nowrap; }
  .vw-table td.vw-th { background: rgba(var(--accent-rgb),0.07); color: var(--text-1); font-weight: 700; position: sticky; top: 0; }
  .vw-table td.vw-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ok); }
  .vw-arch-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .vw-arch-fmt { font-size: calc(var(--ui-small-fs) - 2px); font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-3); background: rgba(var(--accent-2-rgb),0.08); border: 1px solid rgba(var(--accent-2-rgb),0.3); padding: 3px 8px; border-radius: 6px; }
  .vw-arch-n { color: var(--text-3); font-size: calc(var(--ui-small-fs) - 0.5px); flex: 1; }
  .vw-arch-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px; }
  .vw-arch-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
  .vw-arch-row:active { background: rgba(255,255,255,0.04); }
  .vw-arch-ico { font-size: calc(var(--ui-fs) + 1px); width: 22px; text-align: center; flex-shrink: 0; }
  .vw-arch-name { flex: 1; min-width: 0; color: var(--text-1); font-size: calc(var(--ui-small-fs) + 0.5px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .vw-arch-size { color: var(--text-3); font-size: calc(var(--ui-small-fs) - 1.5px); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .vw-arch-member { flex: 2; min-height: 0; overflow-y: auto; border-top: 1px solid var(--border); padding: 10px 12px; }
  .vw-member-title { color: var(--text-2); font-size: 12px; font-weight: 700; margin-bottom: 8px; font-family: ui-monospace, Menlo, monospace; }
  .vw-member-pre {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: var(--ui-small-fs); line-height: 1.55; color: var(--text-2);
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  .vw-member-note { color: var(--text-2); font-size: var(--ui-small-fs); padding: 8px 0; }
  .vw-text-full { padding: 14px; }
  .art-fallback-ta {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: var(--surface-1); color: var(--text-1); border: none; outline: none;
    padding: 14px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    resize: none; line-height: 1.5; box-sizing: border-box;
  }
  .art-binary { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-2); }
  .art-binary-name { color: var(--text-1); font-size: calc(var(--ui-fs) + 2px); font-weight: 700; }
  .art-binary-sub { font-size: var(--ui-small-fs); color: var(--text-3); }
  .art-toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px);
    background-color: var(--raised-chrome); color: var(--text-1); border: 1px solid var(--border);
    padding: 9px 16px; border-radius: 10px; font-size: calc(var(--ui-small-fs) + 0.5px);
    opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 4000;
    max-width: 86%; text-align: center;
  }
  .art-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── v0.18: unsaved-changes banner (in-DOM, replaces window.confirm) ── */
  .art-unsaved {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--warn) 14%, var(--surface-1));
    border-top: 1px solid rgba(var(--err-rgb),0.35);
    transform: translateY(110%); opacity: 0;
    transition: transform 0.22s cubic-bezier(0.32,0.72,0,1), opacity 0.2s;
    z-index: 5;
  }
  .art-unsaved.show { transform: translateY(0); opacity: 1; }

  .pe-identity {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-bottom: 1px solid var(--border);
    font-size: calc(var(--ui-small-fs) - 1px); flex-shrink: 0; overflow: hidden;
  }
  .pe-identity-k {
    flex-shrink: 0; font-weight: 700; font-size: var(--ui-micro-fs); letter-spacing: 0.4px;
    text-transform: uppercase; color: var(--text-3);
    background: rgba(var(--accent-rgb),0.1); border: 1px solid rgba(var(--accent-rgb),0.3);
    padding: 2px 7px; border-radius: 5px;
  }
  .pe-identity-v {
    color: var(--text-3); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl; text-align: left;
  }
  .pe-identity-hint {
    display: block; flex-shrink: 0;
    font-size: 9.5px; color: var(--text-3-dim);
    background: rgba(var(--accent-rgb),0.06); border: 1px solid rgba(var(--accent-rgb),0.18);
    padding: 2px 7px; border-radius: 5px; white-space: nowrap;
  }
  .art-unsaved-text { flex: 1; min-width: 0; color: var(--err); font-size: calc(var(--ui-small-fs) + 0.5px); font-weight: 600; }
  .art-unsaved-discard, .art-unsaved-stay {
    background: transparent; border: 1px solid var(--border); color: var(--text-1);
    border-radius: 8px; padding: 7px 12px; font-size: var(--ui-small-fs); font-weight: 600;
    cursor: pointer; font-family: inherit; flex-shrink: 0; touch-action: manipulation;
  }
  .art-unsaved-discard { color: var(--err); border-color: rgba(var(--err-rgb),0.45); }
  .art-unsaved-stay { color: var(--ok); border-color: rgba(var(--ok-rgb),0.4); }

  /* CodeMirror theme — doomalay (matches the fmt scheme) */
  .cm-s-doomalay.CodeMirror { background: var(--surface-1); color: var(--text-1); }
  .cm-s-doomalay .CodeMirror-gutters { background: color-mix(in srgb, var(--bg-panel) 88%, #000); border-right: 1px solid var(--border); }
  .cm-s-doomalay .CodeMirror-linenumber { color: var(--text-3-dim); }
  .cm-s-doomalay .CodeMirror-cursor { border-left: 2px solid var(--fmt-a1); }
  .cm-s-doomalay .CodeMirror-selected { background: rgba(var(--accent-2-rgb),0.13); }
  .cm-s-doomalay .CodeMirror-activeline-background { background: rgba(255,255,255,0.025); }
  .cm-s-doomalay .cm-keyword { color: var(--fmt-a1); }
  .cm-s-doomalay .cm-atom { color: var(--warn); }
  .cm-s-doomalay .cm-number { color: var(--warn); }
  .cm-s-doomalay .cm-def { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-variable { color: var(--text-1); }
  .cm-s-doomalay .cm-variable-2 { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-variable-3, .cm-s-doomalay .cm-type { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-property { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-operator { color: var(--text-2); }
  .cm-s-doomalay .cm-comment { color: var(--text-3-dim); font-style: italic; }
  .cm-s-doomalay .cm-string { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-string-2 { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-meta { color: var(--text-2); }
  .cm-s-doomalay .cm-qualifier { color: var(--text-2); }
  .cm-s-doomalay .cm-builtin { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-bracket { color: var(--text-3); }
  .cm-s-doomalay .cm-tag { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-attribute { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-hr { color: var(--text-3-dim); }
  .cm-s-doomalay .cm-link { color: var(--fmt-link); }
  .cm-s-doomalay .cm-error { color: var(--err); }
  .CodeMirror { font-size: calc(var(--ui-fs) - 1px); }

  /* ══ v0.27 — PANEL VIEW STACK (the master panel is THE reusable panel) ══
     Every list-style surface (personas, placeholders, usage, export,
     mind) renders as a view stacked over the chat inside #chat-panel.
     The old v0.26 sheet.js is deleted; these are its list atoms,
     re-homed. */
  #panel-view-back, #panel-view-x {
    flex-shrink: 0; width: 34px; height: 34px;
    display: none; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-2); font-size: 16px; line-height: 1; cursor: pointer;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #panel-view-back:active, #panel-view-x:active { background: var(--surface-2); }
  /* v0.34: #panel-star-btn (the ★ quick-switch) REMOVED — favorites now
     live in the model browser's own ★ tab; the button + this CSS are gone. */
  .panel-body.pv-mode {
    padding: 12px 14px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  /* rows inside panel views */
  .pv-row {
    display: flex; align-items: center; gap: 11px; width: 100%;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 13px; margin-bottom: 9px; cursor: pointer; text-align: left;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pv-row:active { background: var(--surface-2); }
  .pv-row-ico { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
  .pv-row-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pv-row-title { font-size: calc(var(--ui-fs) - 0.5px); font-weight: 600; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-row-sub { font-size: calc(var(--ui-small-fs) - 0.5px); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-row-chev { color: var(--text-3-dim); flex-shrink: 0; font-size: 14px; }
  /* v0.28: range sliders for the panel views (mind context window,
     export latest, compaction threshold). accent-color keeps the native
     thumb — themed by the engine's palette.
     v0.29 (user spec): ~14% NARROWER, taken evenly from both sides, and
     touch-action:none so a thumb drag NEVER scrolls the sheet under it
     (paired with gesture.js's ownsGesture guard). */
  .pv-range {
    display: block; width: 86%; margin: 2px auto 4px;
    height: 30px;
    accent-color: var(--accent);
    background: transparent; cursor: pointer;
    touch-action: none;
  }
  /* v0.29: EVERY range input inside the master panel claims its own
     gesture — the sheet's scroll chain must not eat thumb drags. Covers
     the appearance/theme sizing sliders too (their inline width:100%
     is gone — they inherit the same 86% centering). */
  .panel-body input[type="range"] {
    touch-action: none;
  }
  /* v0.29: the settings/appearance sliders — same 86% centered rule as
     .pv-range (their inline width:100% was removed so this applies). */
  .panel-body input.app-range {
    display: block; width: 86%; margin: 0 auto;
  }
  .pv-sub-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-top: 10px;
  }
  /* v0.29: the mind panel asked for breathing room — its rows use this
     roomier variant (labels up top, more space between groups). */
  .pv-sub-row.roomy { margin-top: 18px; }
  .pv-sub-row.roomy + .pv-range { margin-top: 4px; }
  .pv-sub-label {
    font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 600;
    color: var(--text-1); flex-shrink: 0;
  }
  .pv-sub-value {
    font-size: var(--ui-micro-fs); font-weight: 700; color: var(--text-3);
    font-variant-numeric: tabular-nums; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pv-hint { font-size: calc(var(--ui-small-fs) - 0.5px); color: var(--text-3); line-height: 1.55; margin: 2px 2px 12px; }
  /* v0.28: the persona editor's four compact mode pills (always /
     shuffle / trigger / off) — small, at the top, one tap. */
  .pe-mode-row {
    display: flex; gap: 6px; margin-bottom: 10px;
  }
  .pe-mode-pill {
    flex: 1 1 0; min-width: 0; padding: 7px 4px;
    border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px;
    box-shadow: 1px 1px 0 rgba(var(--border-rgb), 0.85);
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.2px;
    font-family: inherit; cursor: pointer; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  /* v0.29 (user spec): the persona editor's action pills (save / ↺ default
     / ⇩ .md / delete) moved from BELOW the editor to the TOP, under the mode
     pills, MATCHING their size — one compact two-row pill block. The MD
     editor then fills the rest of the panel (pe-root column + flex). */
  .pe-action-row {
    display: flex; gap: 6px; margin: 6px 0 10px;
  }
  .pe-action-row .pe-mode-pill { flex: 1 1 0; }
  .pe-root {
    display: flex; flex-direction: column;
    height: 100%;            /* .panel-body has definite height (flex item) */
    min-height: 0;
  }
  .pe-root .pe-body-fill {
    flex: 1 1 auto; min-height: 140px; position: relative;
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; margin-bottom: 2px;
  }
  .pe-body-fill .art-cm-host { position: absolute; inset: 0; }
  .pe-body-fill .art-cm-host .CodeMirror { height: 100%; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  /* placeholder scope pill (global ⇄ local) in the placeholders view */
  .ph-scope-pill {
    display: flex; align-items: stretch; border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .ph-scope-pill button {
    background: transparent; border: none; color: var(--text-3);
    font-size: var(--ui-micro-fs); font-weight: 700; padding: 10px 12px;
    cursor: pointer; font-family: inherit; letter-spacing: 0.2px;
  }
  .ph-scope-pill button[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.16); color: var(--text-1);
  }
  /* trigger builder: three boxes on one row + an example hint */
  .tr-grid {
    display: grid; grid-template-columns: 1fr 64px 1fr; gap: 8px;
    align-items: center; margin-top: 6px;
  }
  .pv-section-label {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-3); margin: 14px 2px 7px;
  }
  .pv-input, .pv-select {
    width: 100%; background-color: var(--raised-chrome); border: 1px solid var(--border);
    color: var(--text-1); padding: 11px 12px; border-radius: 10px;
    font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit; outline: none; min-height: 44px;
  }
  .pv-input:focus, .pv-select:focus { border-color: var(--accent); }
  .pv-btn {
    background-color: var(--raised-chrome); border: 1px solid var(--border-strong); color: var(--text-1);
    border-radius: 10px; padding: 11px 14px; min-height: 44px; font-size: calc(var(--ui-fs) - 0.5px);
    font-weight: 600; font-family: inherit; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .pv-btn:active { background: var(--surface-3); }
  .pv-btn-primary { background: rgba(var(--accent-rgb),0.16); border-color: rgba(var(--accent-rgb),0.5); color: var(--text-1); }
  /* v0.44 var-twin: the primary action layers the accent gradient over
     its tint (no-op while the accent is a solid) */
  .pv-btn-primary { background-image: var(--accent-gradient, none); }

  /* ══ v0.27→v0.56 — chat header pills: equal proportions, theme tones ══
     One row of peers: sandbox · model · artifacts · persona · mind —
     every pill flexes the same basis (18%), wraps when the container is
     narrow. v0.56 (user spec: "the pills of the chat metadata are all
     first color and don't follow, it's broken in a broken way"): the old
     v0.33 block force-flattened EVERY pill to the same matte surface +
     text-2 with !important — the per-pill theme tones (chatpanel.js
     PILL_TONES: sandbox→accent, model→accent-2, template→template tint,
     skills→persona tint…) could never paint. The block now owns ONLY the
     shared LAYOUT; colors + fills ride each pill's own theme tone. */
  #pill-row { flex-wrap: wrap; }
  #pill-row button, .pill-artifacts, #pill-persona, #pill-mind {
    flex: 1 1 18%; max-width: none;              /* equal proportions */
    justify-content: center;
    padding: 7px 3px;
    min-width: 0;
    line-height: 1.2;      /* one baseline for type/artifacts/persona/mind pills */
    align-items: center;
  }
  /* the search row: input takes ALL remaining width, arrows + counter
     pack to the right — on any screen width */
  #chat-searchbar { display: flex; align-items: center; gap: 6px; padding: 6px 0 4px; }
  #chat-search-input {
    flex: 1 1 auto; min-width: 0;
    background-color: var(--raised-chrome); border: 1px solid var(--border); color: var(--text-1);
    padding: 7px 12px; border-radius: 6px; font-size: 11px; font-weight: 600;
    font-family: inherit; outline: none; touch-action: manipulation;
  }
  #chat-search-input::placeholder { color: var(--text-3); font-weight: 500; }
  #chat-search-input:focus { border-color: var(--accent); }
  .chat-search-nav {
    background-color: var(--raised-chrome); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 6px; width: 34px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1; padding-top: 3px; /* ▲▼ draw high in the em box — recenter */
    font-family: inherit; cursor: pointer; flex-shrink: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .chat-search-nav:active { background: var(--surface-3); }
  .chat-search-count {
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3);
    font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; flex-shrink: 0;
  }

  /* ══ v0.27 — util row: export/share + usage, small + dark-adjacent ══
     Same squared matte language as the pills above them, one shade
     darker (surface-3 border family), visibly smaller. */
  #util-row .util-btn {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    /* v0.57: the util pills are Layer-3 chrome — the SURFACE-2 material
       (they ride the surface-2 field via the Layer-3 group above; the old
       --bg-app repaint tiled a same-var box inside a same-var box and
       stayed flat when the overlay background carried a gradient). */
    background-color: var(--raised-chrome);
    border: 1px solid var(--border);
    color: var(--text-3); padding: 5px 8px;
    border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px;
    box-shadow: 1px 1px 0 rgba(var(--border-rgb), 0.85);
    font-size: 10px; font-weight: 700; letter-spacing: 0.2px;
    font-family: inherit; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; line-height: 1.25;
    /* v0.56: no more ALL-CAPS on the util pills (user spec: remove
       capitalisation from text beneath pills). */
  }
  #util-row .util-btn:active { background-color: var(--surface-3); color: var(--text-2); }

  /* ══ v0.27 — the header METERS: context ring + per-chat cost ══
     The usage panel's context bar, duplicated as two tiny front-facing
     elements on the far right of the expand/collapse metadata row (same
     data source — /api/sessions/{id}/usage).
     v0.38 THE RING, PER SPEC: the full circle = the model's context
     window. A SOLID theme-tinted fill marks the auto-compaction ZONE
     (0 → threshold) — the part auto-compact absorbs when it fills. The
     dynamic progress bar grows 0 → used% and shifts primary → warn as
     it slides toward the compaction point; when it crosses, compaction
     fires and the bar resets. Compaction OFF: no zone, the whole circle
     is the runway, and near-full uses the adjacent --notice tone
     instead of the bright warn. Both elements open the usage view. */
  #chat-header-meters { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .ctx-ring-btn {
    width: 30px; height: 30px; padding: 3px; background: transparent;
    border: none; cursor: pointer; font-family: inherit; flex-shrink: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  /* registered so the fill animates smoothly as --p changes */
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  .ctx-ring {
    --p: 0; --thr: 70; --ring: var(--accent);
    --zone: rgba(var(--accent-rgb), 0.16); --tick-op: .95;
    /* v0.38 FIX: an empty inline <span> in a non-flex button computed to
       0×0 — the ring has been INVISIBLE since v0.27. display:block. */
    display: block;
    width: 100%; height: 100%; border-radius: 50%; position: relative;
    background: conic-gradient(
      from 0deg,
      /* the live progress — primary → warn as it climbs */
      var(--ring) 0 calc(var(--p) * 1%),
      /* the auto-compaction ZONE — solid theme-tinted fill up to the point
         (transparent when compaction is OFF — no zone, all runway) */
      var(--zone) calc(var(--p) * 1%) calc(var(--thr) * 1%),
      /* the headroom above the compaction point */
      var(--surface-3) calc(var(--thr) * 1%) 100%
    );
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
    transition: --p 0.4s ease;
  }
  /* the compaction point — a crisp hairline tick where the zone ends */
  .ctx-ring::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from calc(var(--thr) * 3.6deg - 0.45deg),
      var(--border-strong) 0 0.9deg, transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 4px));
