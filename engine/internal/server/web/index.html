     / .pub-head-bar); the util pills paint their own tint only. */
  /* THE USER'S OWN BUBBLES follow Accent 1 (user spec: "the users own
     texts … should follow theme colors") — the rule lives with the other
     message bubbles above (accent fill + gradient twin + --on-accent). */
  /* ══ v0.79.2 THE CONTENT-SAFE BORDER (the mask ring is RETIRED) ══
     The v0.77.8 outline mask ring (mask: padding-box XOR border-box,
     border-color transparent, the border field as the fill) applied to
     any element whose INLINE style carried `solid var(--border)` + a
     transparent background — and a mask hides EVERYTHING inside the
     padding-box: children AND text. Rig-proven with the exact chip
     markup: the chat-scheme chips (teal/sunset/…) rendered as their
     border ring alone — dots + labels INVISIBLE (the user's report:
     "chats color themes … are all invisible except for the selected
     color and the borders of the other options"); text-bearing outline
     pills (the send-mode button family) lost their glyphs the same way
     once a border GRADIENT went live. A pseudo-element ring can't take
     background-attachment, so the PROJ painter can't anchor it — the
     projected ring on content-bearing outlines is architecturally
     unsound, not a bug to patch. THE CONTRACT now: outline pills keep
     their SOLID border (var(--border) — the override's solid twin,
     still theme-following) and their CONTENT always paints; the
     gradient ring lives on via the PLATE stacks (filled elements —
     radius-safe, content-safe, painter-anchored). The FILLED inline
     catchers below are untouched. */
  /* the FILLED inline borders — the plate ring, per fill variable
     (surface-3 has no customizable twin: the plate is the solid look,
     the ring rides alone) */
  [style*="solid var(--border)"][style*="background:var(--surface-1)"],
  [style*="solid var(--border)"][style*="background: var(--surface-1)"],
  [style*="solid var(--border)"][style*="background-color:var(--surface-1)"],
  [style*="solid var(--border)"][style*="background-color: var(--surface-1)"] {
    /* v0.99.5: the 2-layer inline plate (the ring is the derived border) */
    background-image: var(--surface-1-gradient, none),
                      linear-gradient(var(--surface-1), var(--surface-1)) !important;
    background-origin: padding-box, padding-box !important;
    background-clip: padding-box, padding-box !important;
  }
  [style*="solid var(--border)"][style*="background:var(--surface-2)"],
  [style*="solid var(--border)"][style*="background: var(--surface-2)"],
  [style*="solid var(--border)"][style*="background-color:var(--surface-2)"],
  [style*="solid var(--border)"][style*="background-color: var(--surface-2)"] {
    background-image: linear-gradient(var(--surface-2), var(--surface-2)) !important;
  }
  [style*="solid var(--border)"][style*="background:var(--surface-3)"],
  [style*="solid var(--border)"][style*="background: var(--surface-3)"],
  [style*="solid var(--border)"][style*="background-color:var(--surface-3)"],
  [style*="solid var(--border)"][style*="background-color: var(--surface-3)"],
  [style*="solid var(--border-strong)"][style*="background:var(--surface-3)"],
  [style*="solid var(--border-strong)"][style*="background: var(--surface-3)"],
  [style*="solid var(--border-strong)"][style*="background-color:var(--surface-3)"],
  [style*="solid var(--border-strong)"][style*="background-color: var(--surface-3)"] {
    background-image: linear-gradient(var(--surface-3), var(--surface-3)) !important;
  }
  [style*="solid var(--border)"][style*="background:var(--bg-app)"],
  [style*="solid var(--border)"][style*="background: var(--bg-app)"],
  [style*="solid var(--border)"][style*="background-color:var(--bg-app)"],
  [style*="solid var(--border)"][style*="background-color: var(--bg-app)"] {
    background-image: linear-gradient(var(--bg-app), var(--bg-app)) !important;
  }
  /* ══ v0.79.3 THE BORDER FAMILY (the outline-pill rework) — v0.91.2:
     NATIVE. The fixed-attachment border-gradient window + plate + ring
     (3 projected viewport rasters per pill, fed by the PROJ painter on
     every --proj-tx/ty poke) retires for the small outline-pill family;
     the pills ride the native --raised-chrome/--raised-ring mixes —
     border-following (the ring derives from var(--border)) and
     surface-aware, derived by the browser in style recalc. The projected
     model stays on the big surfaces. User spec kept: "assign less
     variables to surface raised and assign them to border" — the ring
     is border-driven. .color-row-banner stays OUT (its inline preview
     is the documented exception to the projection model). */
  .hub-search, .chat-find, .chat-find-input, .chat-find-btn,
  .color-row-reset, .settings-nav .tab, .util-btn, .kbd {
    background-color: var(--raised-chrome);
    border-color: var(--raised-ring);
  }
  /* v0.79.3: a bright border twin (or a bright border gradient washing
     the window) gets the readable ink — the --on-surface pattern,
     applied to the border family. Base themes never trip the gate. */
  [data-bright-border] .hub-search, [data-bright-border] .chat-find,
  [data-bright-border] .chat-find-input, [data-bright-border] .chat-find-btn,
  [data-bright-border] .color-row-reset, [data-bright-border] .settings-nav .tab,
  [data-bright-border] .util-btn, [data-bright-border] .kbd {
    color: var(--on-border, var(--text-1));
    text-shadow: none;
  }
  /* v0.57→v1.03.1 HEADERS — the CARD strip. The old bg-app projection
     window re-tiled the canvas field in a small strip inside the
     panel; headers are nested elements → the flat card (distinct,
     raised, tile-free). The :active press dim stays. */
  .settings-section h3, #chat-header, .pub-head-bar {
    background-color: var(--card);
    background-image: none;
    text-shadow: var(--text-shadow);
  }
  .settings-section h3:active { filter: brightness(0.94); }
  /* v0.57: the overlay screen's text safety net — the overlay card's
     content rides whatever --bg-app the user chose (a bright mesh under
     gray text was unreadable; the sweep's finding). Inherits to every
     overlay screen's content. */
  #connect-overlay {
    text-shadow: var(--text-shadow);
  }
  /* v0.99.5 THE TEXT-GRADIENT TRACK — ONE WAY (the dual track): all
     text gradients ride the FMT FIELD's a1 stop, gate-keyed exactly like
     the chat fmt slots. The old --text-1-gradient family is RETIRED
     (ink is solid-only, never a window; body text/labels/placeholder
     text stay solid ink forever — the v0.100 tiers). What joins a1:
     the TITLE + NAME class (headers, card/row/artifact names, viewer
     headings). color: transparent only while the gradient lives (the
     -ink twin pattern); children that set their own colors keep them. */
  [data-fmt-grad~="a1"] .settings-section h3 span,
  [data-fmt-grad~="a1"] .pub-title,
  [data-fmt-grad~="a1"] .chatbot .name,
  [data-fmt-grad~="a1"] .gatelock-title,
  [data-fmt-grad~="a1"] .panel-header .meta .name,
  [data-fmt-grad~="a1"] .wsx-title,
  [data-fmt-grad~="a1"] .pv-row-title,
  [data-fmt-grad~="a1"] .ts-row-name, [data-fmt-grad~="a1"] .ts-detail-name,
  [data-fmt-grad~="a1"] .ts-stage-name,
  [data-fmt-grad~="a1"] .color-row-name, [data-fmt-grad~="a1"] .art-row-name,
  [data-fmt-grad~="a1"] .art-title, [data-fmt-grad~="a1"] .art-sheet-name,
  [data-fmt-grad~="a1"] .art-binary-name, [data-fmt-grad~="a1"] .crop-title,
  [data-fmt-grad~="a1"] .lv-title, [data-fmt-grad~="a1"] .hub-bunch-hero-name,
  [data-fmt-grad~="a1"] .hi-title,
  [data-fmt-grad~="a1"] .hubrepo-file-path,
  [data-fmt-grad~="a1"] .vw-h1, [data-fmt-grad~="a1"] .vw-h2,
  [data-fmt-grad~="a1"] .vw-title,
  [data-fmt-grad~="a1"] .vw-arch-name,
  [data-fmt-grad~="a1"] h1, [data-fmt-grad~="a1"] h2, [data-fmt-grad~="a1"] h3 {
    background-image: var(--fmt-a1-gradient, none);
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--fmt-a1-ink, var(--fmt-a1, var(--text-1)));
  }
  /* v0.74 THE LIBRARY CARD NAMES — the marquee fix. User report:
     "the library where the main text disappears or renders only as a
     shadow — maybe from the scrollable text functionality". The
     card name's INNER span (.hub-card-name-in) carried ALWAYS-ON
     will-change:transform (the marquee), promoting it to its own
     compositing layer — on WebView builds the parent's
     background-clip:text can't punch through a composited child, so
     every name in the library rendered as its text-shadow alone.
     The window now lives on the SPAN ITSELF: its clipped background
     and its glyphs paint (and slide) as ONE atomic unit, immune to
     the promotion; will-change is scoped to .marquee only, so short
     names lose the pointless layer entirely. */
  [data-fmt-grad~="a1"] .hub-card-name-in {
    background-image: var(--fmt-a1-gradient, none);
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--fmt-a1-ink, var(--fmt-a1, var(--text-1)));
  }
  /* ══ v0.77.7 THE CUSTOMIZED MARKER — ONE VARIABLE, NO Z-FIGHT ════
     User report: "the dynamic customized text that appears next to
     titles or rows that where customised still use multiple variables,
     meaning when both primary and accent 1 colors are set, they both
     color the customized and try to override each other on the z axis."
     The marker spans sat inside text-grad parents (`.color-row-name`,
     `.settings-section h3 span`) — the parent's clipped --text-1 field
     painted under the span's own accent color (both in the glyph
     region). The marker now owns its ink: the CLASS carries the color
     (a stylesheet rule the derived gates can see — accent-1 gradient
     turns it into a real accent glyph window), and this override
     retires any inherited text-grad window (no !important war with the
     gates: they load later in <head> and win at equal !important). */
  .crc-mark {
    /* v0.99.5: the marker is TEXT — the metadata ink (the dual track
       deletes accent-colored text and the z-fight override with it) */
    color: var(--text-3);
    font-size: var(--ui-micro-fs);
    font-weight: 600;
  }
  .crc-mark--chat { color: var(--text-3); }
  /* v0.65 HARDENING: the canvas name pill is backdrop-filtered — on some
     Chromium/WebView builds the backdrop-filter + background-clip:text
     combination paints an OPAQUE WHITE box (the blur layer ignores the
     text clip). The pill is already 85%-opaque; the blur is imperceptible
     there — drop it while the name rides the gradient clip. */
  [data-fmt-grad~="a1"] .chatbot .name {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  /* ══ v0.67 THE EVERY-WINDOW PASS ═════════════════════════════
     (the user's report on v0.66: "pill boxes, especially the ones that
     are outlines or borders, and all text that isn't a title text or
     header don't follow gradients still". v0.66 converted the pill row,
     the big surfaces and the headers; the STRAGGLERS are the accent-
     TINTED families scattered through every screen — tint fill + rgba
     ring + accent-colored label (the v0.56 "quiet pill" look). theme.js
     now flags [data-a1..a4-grad] per accent when its gradient twin is
     live, and the gates below turn every flagged family into what the
     model promises: a WINDOW on that accent's viewport projection.
     Solid accents never trip the gates — base themes render exactly
     as v0.66.)
     Recipes, mirroring v0.66's projPillStyle:
     · WINDOW — tint pills/badges/chips paint the accent projection
       (fixed) and their own accent-colored label flips to the derived
       readable ink (var(--on-accent-N)).
     · GLYPHS — accent-colored TEXT with no fill of its own clips the
       same fixed projection through the letters (background-clip:
       text — RETIRED in v0.99.5: text gradients are the fmt field's one way).
     · INLINE CATCHERS — the JS-built pills (model browser tone pills,
       provider Free/Paid badges, workspace chips, composer segments)
       set their tint/ring/color as INLINE styles; !important beaters
       window them exactly like the class families. Status colors
       (--ok/--err/--warn) are semantic, never windowed. */

  /* — Accent 1 WINDOWS — the header model button, the editing banners,
     the active nav tab, the selected template row, the working chip,
     table heads, the send button's ON states. */
  [data-a1-grad] #panel-model-btn,
  [data-a1-grad] #edit-banner,
  [data-a1-grad] #tpl-chip,
  [data-a1-grad] .settings-nav .tab.active[data-page="appearance"],
  [data-a1-grad] .ts-row-on,
  [data-a1-grad] .ts-stage-n,
  [data-a1-grad] .chat-working,
  [data-a1-grad] .fmt table thead th,
  [data-a1-grad] .vw-table td.vw-th,
  [data-a1-grad] #chat-send.sm-on,
  [data-a1-grad] #send-cluster.sm-cluster-on #chat-send-more,
  [data-a1-grad] .sm-row.on,
  [data-a1-grad] .sm-row.on .sm-auto {
    background-image: var(--accent-gradient, none) !important;
    color: var(--on-accent) !important;
  }
  /* the icons riding those windows flip to the ink too */
  [data-a1-grad] .ts-row-on .ts-on-ico,
  [data-a1-grad] #edit-banner .eb-ico,
  [data-a1-grad] #tpl-chip .tpl-chip-ico { color: var(--on-accent) !important; }
  /* — Accent 1 GLYPHS — the accent-colored labels with no fill.
     (v1.00.2: local-box — clip:text rides no L2 layer; the fixed
     emulation only bought the per-motion re-raster tax.) */
  [data-a1-grad] .ts-on-ico,
  [data-a1-grad] .hub-step-val {
    background-image: var(--accent-gradient, none) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    color: transparent !important;
  }

  /* — Accent 2 WINDOWS — the sizing tab, tool-use pills, artifact
     download pills, hub counts, viewer tabs, scope pills, source cards. */
  [data-a2-grad] .settings-nav .tab.active[data-page="sizing"],
  [data-a2-grad] .tool-pill-use,
  [data-a2-grad] .fmt-artifact-dl,
  [data-a2-grad] .hmsg-dl,
  [data-a2-grad] .hmsg-card-ico,
  [data-a2-grad] .hub-count,
  [data-a2-grad] .src-card-dom,
  [data-a2-grad] .src-wrap .src-count,
  [data-a2-grad] .vw-tab[data-on="1"],
  [data-a2-grad] .vw-arch-fmt,
  [data-a2-grad] .ph-scope-pill button[data-on="1"] {
    background-image: var(--accent-2-gradient, none) !important;
    color: var(--on-accent-2) !important;
  }
  /* — Accent 2 GLYPHS. (v1.00.2: local-box, same tier call.) */
  [data-a2-grad] .ts-stage-fo {
    background-image: var(--accent-2-gradient, none) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    color: transparent !important;
  }

  /* — Accent 3 WINDOWS — the general tab + the module families
     (providers' Paid thumbs ride the inline catchers below). */
  [data-a3-grad] .settings-nav .tab.active[data-page="general"] {
    background-image: var(--accent-3-gradient, none) !important;
    color: var(--on-accent-3) !important;
  }
  [data-a3-grad] .mb-pill[data-on],
  [data-a3-grad] .mb-ufchip {
    background-image: var(--accent-3-gradient, none) !important;
    color: var(--on-accent-3) !important;
  }
  /* — Accent 4 WINDOWS — scripts + sourcehut (hub + workspace inject
     their classes; the inline catchers below catch their styles). */

  /* ══ v0.70 THE ACCURACY WAVE — the named pill families ═══════════
     (the user's report: "The pill boxes … the ones we use for the
     public library, or the ones we use to connect to GitHub/gitea/self
     host … even all the ones used in the chat metadata. Most pill in
     the app don't follow their assigned gradient"). These are the
     CLASS-based families the v0.67 gates never listed (class tints
     live in stylesheets — the inline catchers only see style=""
     attributes). Every rule is gate-scoped, so a solid accent renders
     exactly the quiet tint as before; only a LIVE gradient field
     engages. Assignments are the app's own documented mapping:
     · library pills — persona→A2, template→A1, skill→A3, script→A4,
       doc→A1, default→A2 (v0.63);
     · connect pills — github/selfhost→A1, gitea→A2, gitlab→A3,
       sourcehut→A4 (v0.63); the +connect bar rides A1 (its label).
     The ink flips to the derived --on-accent-N ONLY inside the gate —
     outside it the label keeps its accent color (v0.70's accurate-ink
     contract everywhere). */

  /* the PUBLIC LIBRARY pills (the category picker) — v1.01.5 THE
     CHECKERED ACCENTS: positional tones (acc1/acc2/acc3 — 1st pill
     A1, 2nd A2, 3rd A3, 4th back to A1…). Each tone windows ITS OWN
     accent's gradient; a gradiented A2 never windows an acc1 pill. */
  [data-a1-grad] .hub-libpill[data-tone="acc1"][data-on="1"] {
    background-image: var(--accent-gradient, none) !important;
    color: var(--on-accent) !important;
  }
  [data-a2-grad] .hub-libpill[data-tone="acc2"][data-on="1"] {
    background-image: var(--accent-2-gradient, none) !important;
    color: var(--on-accent-2) !important;
  }
  [data-a3-grad] .hub-libpill[data-tone="acc3"][data-on="1"] {
    background-image: var(--accent-3-gradient, none) !important;
    color: var(--on-accent-3) !important;
  }
  /* the library CHROME pills — the publish button, the my-xyz filter,
     the tone strip — ride the BROWSED category's tone (the
     .hub-root[data-tone] scope decides which accent that is). */
  [data-a2-grad] .hub-root[data-tone="persona"] .hub-publish,
  [data-a2-grad] .hub-root:not([data-tone]) .hub-publish,
  [data-a2-grad] .hub-root[data-tone=""] .hub-publish,
  [data-a2-grad] .hub-root[data-tone="persona"] .hub-chatpill--mine.on,
  [data-a2-grad] .hub-root:not([data-tone]) .hub-chatpill--mine.on,
  [data-a2-grad] .hub-root[data-tone=""] .hub-chatpill--mine.on {
    background-image: var(--accent-2-gradient, none) !important;
    color: var(--on-accent-2) !important;
  }
  [data-a1-grad] .hub-root[data-tone="template"] .hub-publish,
  [data-a1-grad] .hub-root[data-tone="doc"] .hub-publish,
  [data-a1-grad] .hub-root[data-tone="template"] .hub-chatpill--mine.on,
  [data-a1-grad] .hub-root[data-tone="doc"] .hub-chatpill--mine.on {
    background-image: var(--accent-gradient, none) !important;
    color: var(--on-accent) !important;
  }
  [data-a3-grad] .hub-root[data-tone="skill"] .hub-publish,
  [data-a3-grad] .hub-root[data-tone="skill"] .hub-chatpill--mine.on {
    background-image: var(--accent-3-gradient, none) !important;
    color: var(--on-accent-3) !important;
  }

  /* the CONNECT pills — the workspace picker's provider pills + sign-in
     blocks (scoped by the picker's own data-prov), the provider icon
     chips, and the pinned +connect bar. */
  /* the pub-bar CONNECT button rides the provider's accent too (its
     base rule paints var(--wsp-c, …) — an indirection spelling, so the
     derivation correctly skips it and these explicit rules own it). */
  [data-a1-grad] .wsp[data-prov="github"] .wsp-pill[data-on="1"],
  [data-a1-grad] .wsp[data-prov="selfhost"] .wsp-pill[data-on="1"],
  [data-a1-grad] .wsp[data-prov="github"] .wsp-signin,
  [data-a1-grad] .wsp[data-prov="selfhost"] .wsp-signin,
  [data-a1-grad] .wsp[data-prov="github"] .wsp-pub-go,
  [data-a1-grad] .wsp[data-prov="selfhost"] .wsp-pub-go,
  [data-a1-grad] .wsx-conn,
  [data-a1-grad] .wsx-ico.k-github,
  [data-a1-grad] .wsx-ico.k-device {
    background-image: var(--accent-gradient, none) !important;
    color: var(--on-accent) !important;
  }
  [data-a2-grad] .wsp[data-prov="gitea"] .wsp-pill[data-on="1"],
  [data-a2-grad] .wsp[data-prov="gitea"] .wsp-signin,
  [data-a2-grad] .wsp[data-prov="gitea"] .wsp-pub-go,
  [data-a2-grad] .wsx-ico.k-gitea {
    background-image: var(--accent-2-gradient, none) !important;
    color: var(--on-accent-2) !important;
  }
  [data-a3-grad] .wsp[data-prov="gitlab"] .wsp-pill[data-on="1"],
  [data-a3-grad] .wsp[data-prov="gitlab"] .wsp-signin,
  [data-a3-grad] .wsp[data-prov="gitlab"] .wsp-pub-go,
  [data-a3-grad] .wsx-ico.k-gitlab {
    background-image: var(--accent-3-gradient, none) !important;
    color: var(--on-accent-3) !important;
  }

  /* — INLINE CATCHERS — the JS-built accent pills (background tint
     as an inline style: model browser pills/chips, provider Free/Paid
     badges, workspace chips, connect pills). The tint stays as the
     solid fallback UNDER the projection; the label flips to the ink.
     Both spellings (background: / background-color:) and both accent
     spacings are covered; status vars (--ok/--err/--warn) never match. */
  [data-a1-grad] [style*="background:rgba(var(--accent-rgb)"],
  [data-a1-grad] [style*="background-color:rgba(var(--accent-rgb)"],
  [data-a1-grad] [style*="background: rgba(var(--accent-rgb)"],
  [data-a1-grad] [style*="background-color: rgba(var(--accent-rgb)"] {
    background-image: var(--accent-gradient, none) !important;
    color: var(--on-accent) !important;
  }
  [data-a2-grad] [style*="background:rgba(var(--accent-2-rgb)"],
  [data-a2-grad] [style*="background-color:rgba(var(--accent-2-rgb)"],
  [data-a2-grad] [style*="background: rgba(var(--accent-2-rgb)"],
  [data-a2-grad] [style*="background-color: rgba(var(--accent-2-rgb)"] {
    background-image: var(--accent-2-gradient, none) !important;
    color: var(--on-accent-2) !important;
  }
  [data-a3-grad] [style*="background:rgba(var(--accent-3-rgb)"],
  [data-a3-grad] [style*="background-color:rgba(var(--accent-3-rgb)"],
  [data-a3-grad] [style*="background: rgba(var(--accent-3-rgb)"],
  [data-a3-grad] [style*="background-color: rgba(var(--accent-3-rgb)"] {
    background-image: var(--accent-3-gradient, none) !important;
    color: var(--on-accent-3) !important;
  }
  /* v0.99.5: THE INLINE GLYPH CATCHERS ARE RETIRED — accent-colored
     text is the INK track's business now (the dual track: no accent
     text at all). The JS-built labels that spelled color:var(--accent)
     inline are being reassigned to ink tones in the .5 pass; this block
     no longer mints clip-windows for them. */

  /* v0.45 ITEM 4 fix (kept): --bg-app-rgb was referenced (L282, L1451)
     but never defined — per-theme statics below; theme.js now also writes
     the inline triplet when the user customizes --bg-app (which beats
     these statics, like every other override). */
  :root { --bg-app-rgb: 10,10,11; }   /* midnight default */
  [data-theme="nebula"]  { --bg-app-rgb: 11,9,18; }
  [data-theme="ember"]   { --bg-app-rgb: 15,10,8; }
  [data-theme="forest"]  { --bg-app-rgb: 8,13,10; }
  [data-theme="ocean"]   { --bg-app-rgb: 7,11,16; }
  [data-theme="rose"]    { --bg-app-rgb: 16,10,13; }
  [data-theme="mono"]    { --bg-app-rgb: 10,10,10; }
  [data-theme="solar"]   { --bg-app-rgb: 6,8,16; }
  [data-theme="paper"]   { --bg-app-rgb: 244,241,234; }
  [data-theme="frost"]   { --bg-app-rgb: 238,242,247; }
  /* when the user customizes --bg-app, the inline solid overrides the
     [data-theme] block; re-derive the rgb from the inline value via a
     fallback chain (the rgba() consumers already pass a fallback). */
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- v0.81.2 THE OVER-ICONS LAYER: a second canvas ABOVE the chatbot
     icons (z 150 > #chatbots' 100; below a dragged bot 200, the dock
     500 and every panel) — the biggest dots/lines paint HERE when the
     amplifier is engaged (see app.js renderGrid). pointer-events:none:
     it is pure paint, never interaction. -->
<canvas id="c2" style="position:fixed;top:0;left:0;touch-action:none;pointer-events:none;z-index:150"></canvas>
<div id="chatbots"></div>
<!-- v0.85.3: the long-press canvas menu (user spec: "holding down the
     canvas should yield two options, new chat (rename it to new bot) and
     new tab. New bot creates a chat panel, new tab creates a browser in
     browser panel") — NEW BOT (the renamed create-chat action, still
     create-only at the exact press point) + NEW TAB (creates the web
     entity + opens its browser-in-browser panel). -->
<div id="menu" class="hidden">
  <button data-action="new-chat">＋ New Bot</button>
  <button data-action="new-tab">⧉ New Tab</button>
</div>
<button id="settings-btn" aria-label="Settings">
  <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.42-.49-.42h-3.84c-.24 0-.43.17-.47.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.12.62l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
</button>
<!-- v0.85.2: THE DOCK PILL REWORK — ONE capsule (user spec 3 + 3.2): the
     arrow's own small pill EXPANDS into a circular-edged-rectangle
     capsule that encapsulates all the pills (they ride BARE inside — no
     own bubbles). The ＋ is now the sub-expansion toggle: it grows the
     capsule to fit two more pills — new CHAT panel + new BROWSER panel
     (the standalone web globe pill is REMOVED; browser creation lives
     under ＋ now). The all-chats glyph is layers (never collides with
     the chat-panel glyph). Persists doomalay.dock.v1; wired in app.js. -->
<div id="dock-expando">
  <button id="dock-toggle" aria-label="Expand dock" aria-expanded="false"><span class="dg">›</span></button>
  <div id="dock-strip" class="hidden">
    <!-- v0.85.2: ＋ toggles the sub-expansion below (was: direct
         create — that intent now lives on the revealed "new chat
         panel" pill). -->
    <button class="dock-btn" id="dock-new" title="New panel" aria-label="New panel options" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <!-- v0.85.2 THE SUB-EXPANSION (user spec 3.2): two pills the capsule
         grows to fit — a new chat panel (message-square-plus) and a new
         browser panel (window-plus; the v0.85.3 web tab machinery). -->
    <div id="dock-sub" class="hidden">
      <button class="dock-btn" id="dock-new-chat" title="New chat panel" aria-label="Create a new chat panel">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9 10h6"/><path d="M12 7v6"/></svg>
      </button>
      <button class="dock-btn" id="dock-new-web" title="New browser panel" aria-label="Create a new browser panel">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M12 11.5v5"/><path d="M9.5 14h5"/></svg>
      </button>
    </div>
    <button class="dock-btn" id="dock-cloud" title="Cloud providers" aria-label="Cloud providers">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
    </button>
    <button class="dock-btn" id="dock-library" title="Hub library" aria-label="Hub library">
      <svg viewBox="0 0 24 24"><path d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.19 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM12 8c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
    </button>
    <!-- v0.52: the all-chats index + global search MERGED — one glyph.
         v0.85.2: the glyph is LAYERS (the stack) so it never reads as
         "one chat" against the new chat-panel pill. -->
    <button class="dock-btn" id="dock-chats" title="All chats — browse & search" aria-label="All chats — browse and search">
      <svg viewBox="0 0 24 24"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
    </button>
  </div>
</div>

<!-- v0.82.2: THE FIRST-RUN EMPTY-STATE — app.js shows this ONLY on a
     fresh install (no saved layout) with zero canvas icons; the card
     itself never blocks pan/zoom (pointer-events:none — only .ce-btn
     is interactive). The button rides the exact create+open path the
     dock's ＋ uses. -->
<div id="canvas-empty" class="hidden" aria-live="polite">
  <div class="ce-card">
    <div class="ce-glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
    </div>
    <div class="ce-title">Your canvas is empty</div>
    <div class="ce-sub">Chats live here as bubbles — drag, fling, and arrange them however you like.</div>
    <button class="ce-btn" id="canvas-empty-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Create your first chat
    </button>
    <div class="ce-tip">Tip: <b>long-press</b> anywhere on the canvas to place a chat right there.</div>
  </div>
</div>

<!-- Slide-up chat panel (hidden by default, opened by tapping a chatbot) -->
<div id="chat-scrim"></div>
<div id="chat-panel">
  <div class="handle" id="panel-handle">
    <div class="handle-bar"></div>
    <!-- v0.87.1: THE CIRCULAR TAB ICON — "right of the middle dash in
         the panel and left of the back arrow pill" (the native sheet's
         circle twin; this one rides the handle strip's free right cell,
         right of the dash). Mirrors the canvas tab icon LIVE and opens
         the browser tweaks (webtweaks.js). A <button> so gesture.js's
         drag-anchor keeps it exempt from panel drags. -->
    <button id="panel-tab-icon" aria-label="Tab icon and browser tweaks" style="display:none"></button>
  </div>
  <div class="panel-header">
    <!-- v0.27 view-stack chrome: ‹ back takes the model button's slot while
         a view (personas, usage, export, mind) is stacked over the chat;
