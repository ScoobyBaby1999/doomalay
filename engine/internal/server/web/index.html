            mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 4px));
    opacity: var(--tick-op); pointer-events: none;
  }
  .ctx-cost {
    border: none; background: transparent; cursor: pointer; font-family: inherit;
    font-size: calc(var(--ui-micro-fs) - 0.5px); font-weight: 700; letter-spacing: 0.2px;
    color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0;
    padding: 4px 2px; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-cost.priced { color: var(--warn); }

  /* ══ v0.31→v0.33 — THE PUBLIC LIBRARY (the modular hub) ════════════
     hub.js (library panel), hubitem.js (item detail), hubpublish.js
     (publish + HF connect) — all views on the master panel's stack.
     v0.33 (user spec): everything that isn't the grid rides a
     COLLAPSIBLE header; the search bar sits UNDER it, sticky together
     with the filter row (funnel + Recent|Downloads|Endorsements columns
     + the subtext) — the grid owns the rest of the screen. Every text
     size derives from --ui-fs / --ui-small-fs; the card grid sizes
     from --hub-cols (clamped so a column never drops under ~150px). */
  .hub-root { display: flex; flex-direction: column; gap: 10px; }

  /* v0.52: the chat-connection pill (the library's only binding to a
     chat — "no chat" by default; tap → the all-chats picker) */
  .hub-chatrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .hub-chatpill {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    padding: 6px 12px; margin: 0; font: inherit; cursor: pointer;
    font-size: var(--ui-small-fs); font-weight: 600; color: var(--text-1);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; transition: border-color .16s ease, background .16s ease;
    box-shadow: 1.5px 1.5px 0 rgba(var(--border-rgb), 0.55);
  }
  .hub-chatpill:hover { border-color: rgba(var(--accent-rgb), .45); }
  .hub-chatpill:active { background: rgba(var(--accent-rgb), .10); }
  .hub-chatpill-ico { display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; font-size: 14px; flex-shrink: 0; }
  .hub-chatpill-ico img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  .hub-chatpill-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hub-chatpill-chev { color: var(--text-3); font-size: calc(var(--ui-micro-fs) + 1px); flex-shrink: 0; }
  .hub-chatpill--none { color: var(--text-3); font-style: italic; }
  /* v0.58 (pt 8): MY-XYZ — the downloads FILTER pill (follows the tone) */
  .hub-chatpill--mine { border-style: dashed; }
  .hub-chatpill--mine.on {
    color: var(--hub-tone, var(--accent-2)); font-style: normal;
    border-color: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.55);
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.10);
  }

  /* ══ v0.58 — THE CATEGORY TONE (user spec pt 1) ══════════════════
     The browsed library owns ONE tone pair; the library chrome (the
     publish pill, the focused search, the sort icons, the bunch chip, the
     my-xyz pill, the steppers' value window) follows it. v0.63 (user
     spec): EVERY category rides a customizable ACCENT — no more fixed
     persona/template tints or notice orange. persona → Accent 2,
     template → Accent 1 (primary), skill → Accent 3, script → Accent 4,
     docs ride the primary (hidden format), the default/themes ride
     Accent 2 — five colors, one per customizable accent. */
  .hub-root { --hub-tone: var(--accent-2); --hub-tone-rgb: var(--accent-2-rgb); }
  .hub-root[data-tone="persona"]  { --hub-tone: var(--accent-2);      --hub-tone-rgb: var(--accent-2-rgb); }
  .hub-root[data-tone="template"] { --hub-tone: var(--accent);        --hub-tone-rgb: var(--accent-rgb); }
  .hub-root[data-tone="skill"]    { --hub-tone: var(--accent-3);      --hub-tone-rgb: var(--accent-3-rgb); }
  .hub-root[data-tone="script"]   { --hub-tone: var(--accent-4);      --hub-tone-rgb: var(--accent-4-rgb); }
  .hub-root[data-tone="doc"]      { --hub-tone: var(--accent);        --hub-tone-rgb: var(--accent-rgb); }

  /* ══ v0.56 — THE LIBRARY TOP DOCK (user spec item 9) ══════════════
     The pinned chrome is ONE dock: the collapsed "Public Library"
     header pill + the search row. On scroll the row collapses to a
     round search icon (.hub-root.scrunch); tap (or back to top)
     expands it. The dock BLENDS with the panel behind — surface-1
     glass + backdrop blur, NOT the overlay background (user spec:
     "not use the overlay background color … something that would blend
     with the rest of the background"). Even, polished radii. */
  .hub-topdock {
    position: sticky; top: 0; z-index: 6;
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 11px 6px;
    /* v0.74: the 12px backdrop blur is GONE — it blurred + distorted
       the canvas and the cards scrolling under the dock on every
       frame, one of the heaviest constant GPU costs in the library.
       The fill rises 72% → 90% so the dock stays readable bare. */
    background: color-mix(in srgb, var(--surface-1) 90%, transparent);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(var(--bg-app-rgb), 0.28);
  }
  .pub-head-bar {
    display: flex; align-items: center; gap: 10px; width: 100%;
    /* v0.52 (user spec item 9): the header is COMPACT — less of the
       library screen spent on chrome, more on the cards.
       v0.66: the background is OWNED by the projection-system header
       rule (the bg-app window — no flat repaint). */
    padding: 5px 6px;
    border-radius: 12px;
    border: none;
    font-family: inherit; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pub-title {
    font-size: var(--ui-fs); font-weight: 800; letter-spacing: 0.3px;
    color: var(--text-1);
  }
  .pub-status {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: var(--ui-micro-fs); color: var(--text-3); min-width: 0;
  }
  .pub-status b { color: var(--ok); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pub-status button {
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: var(--text-1); font-size: var(--ui-micro-fs); padding: 0; flex-shrink: 0;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .pub-chev { color: var(--text-3); font-size: var(--ui-small-fs); flex-shrink: 0;
    transition: transform 0.18s ease; }
  .pub-head-body.folded .pub-chev { transform: rotate(-90deg); }

  /* the dock's search row: search icon + input + the 4 sort icons.
     v0.56 (user spec): the search bar is ~1.5× SHORTER vertically. */
  .hub-dockrow { display: flex; align-items: center; gap: 7px; }
  .hub-searchico {
    flex: 0 0 auto; width: 30px; height: 30px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background-color: var(--raised-chrome); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-2); cursor: pointer;
    font-family: inherit; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .hub-searchico .icl { display: block; }
  .hub-searchico:hover { color: var(--hub-tone, var(--accent)); border-color: var(--hub-tone, var(--accent)); }
  .hub-search {
    flex: 1 1 auto; min-width: 0; box-sizing: border-box; background-color: var(--raised-chrome);
    border: 1px solid var(--border); color: var(--text-1);
    padding: 4px 11px; border-radius: 999px;
    outline: none; min-height: 28px;
    font-size: calc(var(--ui-fs) - 1px); font-family: inherit;
  }
  .hub-search:focus { border-color: var(--hub-tone, var(--accent)); }
  /* the sort icons — little round buttons, the active one lit */
  .hub-sortrow { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .hub-sortico {
    width: 28px; height: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent;
    border-radius: 999px; color: var(--text-3);
    cursor: pointer; font-family: inherit; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .hub-sortico .icl { display: block; }
  .hub-sortico:hover { color: var(--text-1); background-color: var(--raised-chrome); }
  .hub-sortico[data-on="1"] {
    color: var(--hub-tone, var(--accent-2));
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.12);
    border-color: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.5);
  }
  .hub-fsub {
    font-size: var(--ui-micro-fs); color: var(--text-3);
    padding: 0 4px 0; min-height: 14px;
  }

  /* THE SCRUNCH — scrolled: only the pinned bar + a round search icon.
     Back to top (or tapping the icon) restores the full row. */
  .hub-root.scrunch .hub-dockrow .hub-search,
  .hub-root.scrunch .hub-dockrow .hub-sortrow,
  .hub-root.scrunch #hub-fsub { display: none; }
  .hub-root.scrunch .hub-searchico {
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.12);
    border-color: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.5);
    color: var(--hub-tone, var(--accent-2));
  }

  /* the collapsible header body — under the dock, folds on the bar tap */
  .pub-head-body { display: flex; flex-direction: column; gap: 7px; padding: 2px 13px 9px; }
  .pub-head-body.folded { display: none; }

  /* "Browse the community for:" + the full-row library pills */
  .pub-sub {
    font-size: var(--ui-small-fs); color: var(--text-3); letter-spacing: 0.2px;
  }
  /* v0.49 (user spec): the library pills stand as COLUMNS — side by
     side, each a vertical tile (icon over label over count) — instead of
     stacked full-width rows.
     v0.52 (user spec item 9): FOUR columns don't fit an Android-native
     screen — the row now SCROLLS horizontally (each tile keeps a sane
     min-width instead of squishing to illegibility), the glyphs are
     smaller, and the tiles themselves are shorter.
     v0.56 (user spec): even polished radii + the SELECTED pills read
     FOUR different theme colors (persona purple / template green /
     skill accent-3 / theme accent-2 — "when selected don't use theme
     colors. Have them use 4 different theme colors"). */
  .hub-librow {
    display: flex; flex-direction: row; gap: 7px;
    flex-wrap: nowrap; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    overscroll-behavior-x: contain;
    margin: 0 -4px; padding: 0 4px;
  }
  .hub-librow::-webkit-scrollbar { height: 3px; }
  .hub-libpill {
    flex: 1 1 0; min-width: 74px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: 54px; padding: 7px 6px;
    background-color: var(--raised-chrome); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(var(--bg-app-rgb), 0.22);
    font-size: calc(var(--ui-small-fs)); font-weight: 700; text-align: center;
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .hub-libpill .dx-pill-ico { font-size: var(--ui-fs); flex-shrink: 0; line-height: 1; }
  .hub-libpill .dx-pill-label {
    white-space: normal; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%; line-height: 1.2;
  }
  .hub-libpill-count {
    font-size: var(--ui-small-fs); color: var(--text-3);
    font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0;
  }
  .hub-libpill[data-on="1"] {
    background: rgba(var(--accent-rgb), 0.10);
    border-color: rgba(var(--accent-rgb), 0.5); color: var(--text-1);
  }
  /* v1.01.5: THE CHECKERED ACCENTS — the lib pills ride the three
     gradient-capable accents POSITIONALLY (1st pill → A1, 2nd → A2,
     3rd → A3, 4th → A1… — user spec). The old semantic mapping parked
     scripts on accent-4, a theme-carried static that never follows the
     user's gradients. */
  .hub-libpill[data-tone="acc1"][data-on="1"] {
    background: rgba(var(--accent-rgb), 0.12);
    border-color: rgba(var(--accent-rgb), 0.55); color: var(--text-1);
  }
  .hub-libpill[data-tone="acc2"][data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.12);
    border-color: rgba(var(--accent-2-rgb), 0.55); color: var(--text-1);
  }
  .hub-libpill[data-tone="acc3"][data-on="1"] {
    background: rgba(var(--accent-3-rgb), 0.12);
    border-color: rgba(var(--accent-3-rgb), 0.55); color: var(--text-1);
  }
  .hub-libpill-ghost { cursor: default; }

  /* v0.49 → v0.56 RETIRED: the old .hub-sticky (search + filter columns
     pinned at top:0) is replaced by THE TOP DOCK above — the pinned
     "Public Library" bar + a search row that scrunches to a search icon. */

  /* tag pills (inside the collapsible header) — the shared .dx-pill */
  .hub-pillrow { display: flex; gap: 6px; flex-wrap: wrap; }

  .hub-ctlrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* v0.58 (pt 5): the steppers — compact slider-look pills. Flatter,
  smaller arrows; the VALUE window is the tinted thumb (the thing that
  pops, not the + and −); tabular numbers keep the pill from jittering. */
  .hub-ctl {
    display: inline-flex; align-items: center; gap: 4px;
    background-color: var(--raised-chrome); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 3px;
    font-size: calc(var(--ui-small-fs) - 2px); color: var(--text-3); font-weight: 700;
    letter-spacing: 0.05em;
  }
  .hub-step {
    width: 22px; height: 22px; border-radius: 999px;
    background: transparent; border: none;
    color: var(--text-3); font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }
  .hub-step:not(:disabled):hover { color: var(--text-1); }
  .hub-step:disabled { opacity: 0.3; cursor: default; }
  .hub-step-val {
    min-width: 26px; text-align: center; color: var(--text-1);
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.14);
    border-radius: 999px; padding: 2.5px 4px;
    font-variant-numeric: tabular-nums; font-weight: 800;
    font-size: calc(var(--ui-small-fs) - 1px);
  }
  /* v0.58 (pt 4): the show-bundles toggle */
  .hub-bundles {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: calc(var(--ui-small-fs) - 2px); font-weight: 700; letter-spacing: 0.05em;
    color: var(--text-3); padding: 3px 4px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-bundles-track {
    width: 30px; height: 17px; border-radius: 999px; position: relative;
    background: var(--surface-3); border: 1px solid var(--border);
    transition: background 0.18s ease, border-color 0.18s ease; flex: 0 0 auto;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.18);
  }
  .hub-bundles-dot {
    position: absolute; top: 1.5px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text-2);
    transition: transform 0.18s ease, background 0.18s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .hub-bundles.on .hub-bundles-track {
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.35);
    border-color: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.6);
  }
  .hub-bundles.on .hub-bundles-dot {
    transform: translateX(13px); background: var(--hub-tone, var(--accent-2));
  }
  .hub-bundles.on { color: var(--text-2); }
  .hub-publish {
    margin-left: auto; background: rgba(var(--hub-tone-rgb, var(--accent-rgb)), 0.14);
    border: 1px solid rgba(var(--hub-tone-rgb, var(--accent-rgb)), 0.45); color: var(--hub-tone, var(--accent));
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700;
    padding: 5px 12px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(var(--hub-tone-rgb, var(--accent-rgb)), 0.22);
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-grid {
    display: grid;
    grid-template-columns: repeat(var(--hub-cols, 2), minmax(0, 1fr));
    gap: 10px;
  }
  /* v0.52 (user spec items 3+4): cleaner cards — a REAL border, a shadow,
     the text-pop scrim over any background art, the icon column left of
     the name, and bigger ♥/⤓ stats. Everything rides theme vars.
     v0.54: the layout is UNIFORM now — the .hmsg-* rename killed the
     class collision that shrank/centered the body (align-self:stretch
     keeps it full-width belt-and-braces), the border reads at 1.5px,
     the scrim is deeper at the bottom, and the foot pins to the card's
     base so every card formats identically regardless of text length. */
  .hub-card {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden; min-height: 148px; padding: 0; border-radius: 14px;
    background: var(--surface-1); border: 1.5px solid var(--border-strong);
    box-shadow: 0 6px 18px rgba(0,0,0,0.32);
    cursor: pointer; text-align: left; font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-card:active { background-color: var(--surface-2); transform: scale(0.985); }
  .hub-card-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .hub-card-fade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top,
      rgba(var(--surface-1-rgb), 0.985) 0%,
      rgba(var(--surface-1-rgb), 0.90) 38%,
      rgba(var(--surface-1-rgb), 0.36) 74%,
      rgba(var(--surface-1-rgb), 0.06) 100%);
  }
  .hub-card-body {
    position: relative; display: flex; flex-direction: column; gap: 3px; padding: 10px 11px;
    align-self: stretch; margin-top: auto;
  }
  .hub-card-titlerow { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .hub-card-ico {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 9px;
    background: rgba(var(--surface-2-rgb), 0.82); border: 1px solid var(--border);
    color: var(--text-1);
  }
  .hub-card-ico .icl { display: block; }
  .hub-card-name {
    flex: 1 1 auto; min-width: 0;
    font-size: calc(var(--ui-fs) + 1px); font-weight: 800; color: var(--text-1); line-height: 1.22;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }
  /* v0.58 (pt 6): the inner name span — long names slowly slide across
     (the marquee; marqueeScan measures + paints --slide-d/--slide-t).
     v0.74: will-change rides the .marquee class ONLY — the always-on
     promotion composited every card name in the library (the
     shadow-only-names bug on WebView; see the [data-fmt-grad~="a1"]
     .hub-card-name-in note in the projection block). */
  .hub-card-name-in { display: inline-block; white-space: nowrap; }
  .hub-card-name.marquee { text-overflow: clip; }
  .hub-card-name.marquee .hub-card-name-in { will-change: transform; }
  .hub-card-name.marquee .hub-card-name-in {
    animation: hub-name-slide var(--slide-t, 6s) ease-in-out infinite alternate;
  }
  @keyframes hub-name-slide {
    0%, 12%   { transform: translateX(0); }
    88%, 100% { transform: translateX(var(--slide-d, -40px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hub-card-name.marquee .hub-card-name-in { animation: none; }
  }
  .hub-card-desc {
    font-size: var(--ui-small-fs); color: var(--text-2); line-height: 1.35; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .hub-card-author {
    font-size: calc(var(--ui-small-fs) - 2px); color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hub-card-foot {
    display: flex; gap: 14px; margin-top: 4px; color: var(--text-2);
    font-size: var(--ui-small-fs); font-variant-numeric: tabular-nums;
  }
  .hub-card-stat {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--text-2); font-weight: 600;
    font-size: calc(var(--ui-small-fs) + 1px);
  }
  .hub-card-stat .icl { display: block; }
  .hub-card-stat.on { color: var(--text-1); }
  /* v0.58 (pt 14): the endorse HOTBOX — padding + matching negative
     margins grow the hit target to ~44px with zero visual shift (the
     half-height panel made the old ~17px strip nearly untappable). */
  .hub-card-stat[data-heart] {
    cursor: pointer; padding: 14px 12px; margin: -14px -12px;
    border-radius: 12px;
  }
  .hub-card-stat[data-heart]:active { transform: scale(0.92); }
  /* v0.58 (pt 10): "~x stages" — two tabs of space right of the downloads */
  .hub-card-stat--stages {
    margin-left: 1.5em; color: var(--text-3); font-weight: 600;
    font-size: var(--ui-small-fs);
  }
  /* the BUNCH card — full art like every other card (v0.58 pt 2) */
  .hub-card--bunch { border: 1.5px solid var(--border-strong); }
  .hub-card--bunch .hub-card-ico {
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.18);
    color: var(--hub-tone, var(--accent-2));
    border-color: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.55);
  }
  /* the bunch member view */
  .hub-bunch-sec { margin: 0 0 14px; }
  /* v0.63 (user spec pt 4): the section headers are COLLAPSE toggles —
     tap the title row to fold/unfold that entire section. The chevron
     rides the right edge and rotates with the fold; collapsed is the
     default state on a fresh open. */
  .hub-bunch-sec-h {
    display: flex; align-items: center; gap: 6px;
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700;
    color: var(--text-3); letter-spacing: 0.06em;
    margin: 0 0 8px; cursor: pointer; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; padding: 4px 2px; border-radius: 8px;
  }
  .hub-bunch-sec-h:active { background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.08); }
  .hub-bunch-sec-h .hub-sec-chev {
    margin-left: auto; flex-shrink: 0; width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: calc(var(--ui-small-fs) - 2px);
    transition: transform 0.18s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .hub-bunch-sec:not(.folded) .hub-sec-chev { transform: rotate(90deg); }
  .hub-bunch-sec.folded .hub-grid { display: none; }
  .hub-bunch-sec.folded { margin-bottom: 6px; }
  .hub-bunch-sec-n {
    background-color: var(--raised-chrome); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 8px; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  /* v0.73.6: THE MEMBER FILTER — the bundle detail's own search row
     (mirrors the hub's top search pill; only bundles with 8+ members
     get it). The count chip reads "N of M" while a query is live; the
     ✕ clears; Esc clears; empty-match line sits under the row. */
  .hub-memrow {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px; flex: 0 0 auto;
  }
  .hub-memrow .hub-search { flex: 1 1 auto; min-width: 0; }
  .hub-memq-x {
    flex: 0 0 auto; width: 30px; height: 30px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background-color: var(--raised-chrome); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-2); cursor: pointer;
    font-size: 13px; line-height: 1; font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .hub-memq-x:hover { color: var(--hub-tone, var(--accent)); border-color: var(--hub-tone, var(--accent)); }
  .hub-memq-n {
    flex: 0 0 auto; font-size: var(--ui-small-fs); color: var(--text-3);
    font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 2px;
  }
  .hub-memq-empty {
    margin: -4px 0 12px; font-size: var(--ui-small-fs); color: var(--text-3);
    padding: 10px 12px; background: var(--surface-1);
    border: 1px dashed var(--border); border-radius: 10px;
  }
  /* v0.58 (pt 2): THE BUNDLE FLAG — a horizontal for-sale-style badge off
     the card's left edge (anchored just above the foot), showing "#tag"
     bold. The paint is the bunch's OWN design color (inline, per-item
     content data); the right end is notched like a tag. */
  /* v0.60 (pt A.2): bottom 44→62px — the flag rode over the desc/footer text
     on 3-line cards; +40% clears the name+desc stack (user report). */
  /* v0.63 (user spec pt 3): 62→81px (+30%) — clears the logo/title block
     too; the small "bundle" text after #xyz is RETIRED (the tag reads
     cleaner alone). */
  /* v0.67 (user spec pt 3, second bump): 81→113px (+40%) — the flag still
     rode over the card icon on tall cards; +40% of 81 = 32.4, snapped to
     113px clears the icon row entirely (user report: "move 40% higher"). */
  .hub-bundle-flag {
    position: absolute; left: 0; bottom: 113px; z-index: 2;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 14px 4px 10px;
    border-radius: 0 9px 9px 0;
    clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 50%, 100% 100%, 0 100%);
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 800; letter-spacing: 0.02em;
    max-width: 86%; overflow: hidden; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .hub-bundle-flag b { font-weight: 800; }
  .hub-bundle-flag i {
    font-style: normal; font-size: calc(var(--ui-small-fs) - 3px);
    font-weight: 600; opacity: 0.88; letter-spacing: 0.04em;
  }
  .hub-bunch-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background-color: var(--raised-chrome); border: 1px solid var(--hub-tone, var(--accent));
    color: var(--text-1); border-radius: 999px; padding: 2px 10px;
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 600;
  }
  /* v0.60 pt B: THE BUNCH VIEW HERO — the pushed bundle page's head. The
     bunch's own art shows through a contrast scrim (the hi-head pattern),
     the flag anchors its bottom-left edge. Theme vars only for chrome. */
  .hub-bunch-hero {
    position: relative; overflow: hidden;
    min-height: 150px; display: flex; align-items: flex-end;
    background-color: var(--surface-2); background-size: cover; background-position: center;
    border-radius: 18px; margin: 0 0 14px;
  }
  .hub-bunch-hero-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
  }
  .hub-bunch-hero-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(var(--bg-panel-rgb), 0.15) 0%,
      rgba(var(--bg-panel-rgb), 0.62) 62%,
      rgba(var(--bg-panel-rgb), 0.92) 100%);
  }
  .hub-bunch-hero-body {
    position: relative; z-index: 1; padding: 18px 16px 14px; width: 100%;
  }
  .hub-bunch-hero-titlerow { display: flex; align-items: center; gap: 8px; }
  .hub-bunch-hero-name {
    font-size: calc(var(--ui-fs) + 5px); font-weight: 800; color: var(--text-1);
    text-shadow: 0 1px 6px rgba(var(--bg-panel-rgb), 0.85);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hub-bunch-hero-desc {
    margin-top: 3px; font-size: var(--ui-small-fs); color: var(--text-2);
    text-shadow: 0 1px 4px rgba(var(--bg-panel-rgb), 0.8);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hub-bunch-hero .hub-bundle-flag { bottom: auto; top: 12px; z-index: 2; }
  /* v0.72 THE PARITY CARD — the bunch hero's body rows are the single
     item's EXACT classes (hi-desc / hi-meta / hi-chips / hi-counts); the
     hero only adds the art-safety text shadows (the rows sit on the
     bunch's own gradient, not on a plain surface) + a hair of top
     margin so the stack breathes like hi-head-body. */
  .hub-bunch-hero .hi-desc,
  .hub-bunch-hero .hi-meta {
    text-shadow: 0 1px 4px rgba(var(--bg-panel-rgb), 0.8);
  }
  .hub-bunch-hero .hi-meta { margin-top: 2px; }
  .hub-bunch-hero .hi-counts .icl { filter: drop-shadow(0 1px 2px rgba(var(--bg-panel-rgb), 0.7)); }
  /* v0.76.7: THE FOLDABLE HERO — the hi-head.folded pattern, with the
     bundle's CONTENT LINE kept (the user's collapsed layout: "name,
     x bundled items - x docs, y skills…"); the chips, the by-line and
     the stat icons fold away, the art dims, the bar compacts. */
  .hub-bunch-hero { cursor: pointer; }
  .hub-bunch-hero .hi-fold-ico {
    position: absolute; top: 8px; right: 10px; color: var(--text-2);
    font-size: var(--ui-small-fs);
    text-shadow: 0 1px 4px rgba(var(--bg-panel-rgb), 0.8);
  }
  .hub-bunch-hero.folded .hub-bunch-hero-bg,
  .hub-bunch-hero.folded .hub-bunch-hero-scrim { opacity: 0.25; }
  .hub-bunch-hero.folded { min-height: 0; }
  .hub-bunch-hero.folded .hub-bunch-hero-body { padding: 10px 14px 8px; }
  .hub-bunch-hero.folded .hi-chips,
  .hub-bunch-hero.folded .hi-meta,
  .hub-bunch-hero.folded .hi-counts { display: none; }
  /* the bunch root fills the panel body like hi-root does, so the FAB
     row's margin-top:auto + sticky dock behave exactly as the single
     item view's (short content → the FABs still land at the foot). */
  .hub-root--bunch { min-height: 100%; }
  /* v0.60 pt C.6 → v0.72: THE ONE-PRESS BUNDLE DOWNLOAD rides the
     single-item FAB row now (hi-fab, the ⤓ circle) — the old rectangular
     pill is retired. The registry contract is unchanged (paintDlPill
     still stamps --dl-p + is-running/is-done after every member); the
     FAB styles them: running = the terse N/M count + a conic progress
     RING around the circle (the mask trick, --dl-p 0..1, the ok tone);
     done = the ✓ glyph on the --ok tone. Every color rides theme vars
     (the house rule). */
  #hub-bundle-dl { position: relative; }
  #hub-bundle-dl .hub-dl-count {
    font-size: calc(var(--ui-fs) - 2px); font-weight: 800; color: var(--text-1);
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  #hub-bundle-dl .hub-dl-ok { color: var(--ok); font-weight: 800; font-size: calc(var(--ui-fs) + 2px); }
  #hub-bundle-dl.is-done {
    border-color: rgba(var(--ok-rgb), 0.65);
    color: var(--ok);
  }
  #hub-bundle-dl.is-running { cursor: default; }
  #hub-bundle-dl.is-running::after {
    content: ''; position: absolute; inset: -2.5px; border-radius: 50%;
    background: conic-gradient(var(--ok) calc(var(--dl-p, 0) * 360deg), transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #hub-bundle-dl.is-running::after { transition: none; }
  }
  /* v0.60 pt C.6: the mine view's bundle-group delete 🗑 + the sticky
     confirm bar (the hi-delbar pattern, bottom of the body zone). */
  .hub-group-del {
    margin-left: auto; width: 30px; height: 26px; border-radius: 8px;
    background: rgba(var(--err-rgb), 0.10); border: 1px solid rgba(var(--err-rgb), 0.45);
    color: var(--err); font-size: calc(var(--ui-small-fs) - 2px); cursor: pointer;
    font-family: inherit; flex-shrink: 0; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-mine-bundle {
    font-weight: 800; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%;
  }
  .hub-mine-delbar {
    position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 4; box-shadow: 0 -8px 20px -12px rgba(var(--bg-app-rgb), 0.5),
      0 10px 26px rgba(0,0,0,0.42), 0 2px 6px rgba(0,0,0,0.28);
    border-radius: 16px; margin-top: 10px;
  }
  /* v0.60 pt C.8: THE REPO VIEW — the file preview head + image wrap. */
  .hubrepo-file-head {
    display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 10px;
    border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .hubrepo-file-path {
    font-size: var(--ui-fs); font-weight: 700; color: var(--text-1);
    word-break: break-all;
  }
  .hubrepo-file-repo {
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    word-break: break-all;
  }
  .hubrepo-imgwrap { display: flex; justify-content: center; padding: 8px 0; }
  .hubrepo-imgwrap img {
    max-width: 100%; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .hub-empty {
    padding: 34px 18px; text-align: center; color: var(--text-3);
    font-size: var(--ui-small-fs); line-height: 1.6;
    border: 1px dashed var(--border); border-radius: 12px;
  }
  /* v0.67.4: the empty-state retry pill — one tap re-fetches the failed
     library (theme vars only, the dx-pill house pattern). */
  .hub-empty-retry {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 4px;
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: inherit;
    background: rgba(var(--accent-rgb), 0.10); border: 1px solid rgba(var(--accent-rgb), 0.40);
    color: var(--text-1); font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-empty-retry:active { transform: scale(0.95); }
  .hub-pager {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .hub-nav {
    width: 34px; height: 28px; border-radius: 8px; background-color: var(--raised-chrome);
    border: 1px solid var(--border); color: var(--text-2); font-size: var(--ui-small-fs);
    font-family: inherit; cursor: pointer; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-nav:disabled { opacity: 0.35; cursor: default; }
  /* v0.52: the publish form's icon picker (item 3) */
  .hp-icogrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 6px; max-height: 168px; overflow-y: auto; padding: 2px;
    border: 1px solid var(--border); border-radius: 10px;
  }
  .hp-icocell {
    display: flex; align-items: center; justify-content: center;
    height: 40px; border-radius: 9px; background-color: var(--raised-chrome);
    border: 1px solid transparent; color: var(--text-2); cursor: pointer;
    font-family: inherit; font-size: var(--ui-small-fs);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-icocell[data-on="1"] { border-color: var(--accent); color: var(--accent); background: var(--surface-3); }
  /* v0.61 (icons): the custom icon <img> — an item's own art file (png or
     svg) rendered where the Lucide glyphs go. Shape only; colors come from
     the image itself. The upload cell ＋ is dashed to read as an action. */
  img.icof {
    display: block; width: 20px; height: 20px; object-fit: contain;
    border-radius: 4px; flex-shrink: 0;
  }
  .hp-icocell img.icof { width: 19px; height: 19px; }
  .hp-icocell--up { border-style: dashed; color: var(--text-3); font-weight: 700; }
  .hp-icocell--custom { background: var(--surface-3); }
  .hub-card-ico img.icof { width: 20px; height: 20px; }
  .hp-opt { color: var(--text-3); font-weight: 400; }
  /* v0.58: the stage-count hint + the re-publish dirty hint */
  .hp-stagehint {
    font-size: var(--ui-micro-fs); color: var(--text-3); margin: 3px 1px 6px;
    font-variant-numeric: tabular-nums;
  }
  .hp-edithint {
    font-size: var(--ui-micro-fs); color: var(--text-3); text-align: center;
    margin: 6px 0 0; line-height: 1.5;
  }
  .hp-edithint b { color: var(--text-2); }

  /* ── the item detail (hubitem.js) — v0.58: the "lib · name" page ────
     iPhone-crisp: the hero carries a contrast SCRIM (bg-panel based —
     light theme → light veil + dark text, dark theme → dark veil + light
     text) so the title/description never blend into the art; the payload
     flows straight from the title card (the hero's base melts into the
     page); the fabs are big OPAQUE circles. */
  .hi-root {
    display: flex; flex-direction: column; min-height: 100%; gap: 12px;
    --hub-tone: var(--accent-2); --hub-tone-rgb: var(--accent-2-rgb);
  }
  /* v0.63: category tones on the customizable accents (matches .hub-root). */
  .hi-root[data-tone="persona"]  { --hub-tone: var(--accent-2);      --hub-tone-rgb: var(--accent-2-rgb); }
  .hi-root[data-tone="template"] { --hub-tone: var(--accent);        --hub-tone-rgb: var(--accent-rgb); }
  .hi-root[data-tone="skill"]    { --hub-tone: var(--accent-3);      --hub-tone-rgb: var(--accent-3-rgb); }
  .hi-root[data-tone="script"]   { --hub-tone: var(--accent-4);      --hub-tone-rgb: var(--accent-4-rgb); }
  .hi-root[data-tone="doc"]      { --hub-tone: var(--accent);        --hub-tone-rgb: var(--accent-rgb); }
  .hi-head {
    position: relative; border-radius: 16px; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--border); cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hi-head-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  /* v0.58: THE SCRIM — art shows through, text stays readable, and the
     base melts into the page (the payload flows straight out of the card) */
  .hi-head-scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(var(--bg-panel-rgb), 0.38) 0%,
      rgba(var(--bg-panel-rgb), 0.46) 55%,
      rgba(var(--bg-panel-rgb), 0.86) 100%);
  }
  .hi-head-body {
    position: relative; display: flex; flex-direction: column; gap: 4px;
    padding: 18px 15px 13px; min-height: 138px;
  }
  .hi-titlerow { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hi-ico {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 12px;
    background: rgba(var(--bg-panel-rgb), 0.55); border: 1px solid var(--border);
    color: var(--text-1);
  }
  .hi-ico .icl { display: block; }
  .hi-title {
    flex: 1 1 auto; min-width: 0;
    font-size: calc(var(--ui-fs) + 7px); font-weight: 800; color: var(--text-1);
    line-height: 1.15; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hi-desc { font-size: var(--ui-small-fs); color: var(--text-2); line-height: 1.5; }
  .hi-meta { font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3); }
  .hi-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 2px; }
  .hi-chip {
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.14);
    border: 1px solid rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.45);
    color: var(--hub-tone, var(--accent-2)); border-radius: 999px;
    padding: 2px 9px;
    font-size: calc(var(--ui-small-fs) - 2px); font-weight: 600;
  }
  .hi-stagen {
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.12);
    color: var(--hub-tone, var(--accent-2)); border-radius: 999px;
    padding: 2px 8px; font-size: calc(var(--ui-small-fs) - 2px);
    font-weight: 700; font-variant-numeric: tabular-nums;
  }
  /* v0.60 pt C.5: the INFO chips — shebang/lines/size (scripts) + the
     context budget (templates). Surface-tinted (not the tone) so the
     numbers read as METADATA, not tags. */
  .hi-chip--info {
    background: rgba(var(--surface-3-rgb, var(--surface-2-rgb)), 0.65);
    border-color: var(--border-strong);
    color: var(--text-2); font-variant-numeric: tabular-nums;
  }
  /* v0.60 pt C.5: the per-stage context budget subtitle (stage cards). */
  .hi-stage-mt {
    margin-left: auto; padding: 2px 8px; border-radius: 999px;
    background: rgba(var(--surface-3-rgb, var(--surface-2-rgb)), 0.65);
    border: 1px solid var(--border-strong); color: var(--text-2);
    font-size: calc(var(--ui-small-fs) - 2px); font-weight: 700;
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .hi-counts {
    display: flex; gap: 16px; margin-top: 5px; color: var(--text-2);
    font-size: var(--ui-small-fs); font-variant-numeric: tabular-nums;
  }
  .hi-counts span { display: inline-flex; align-items: center; gap: 5px; }
  .hi-counts .icl { display: block; }
  .hi-counts b { color: var(--text-1); font-weight: 700; }
  .hi-fold-ico {
    position: absolute; top: 8px; right: 10px; color: var(--text-2);
    font-size: var(--ui-small-fs);
  }
  /* the collapsible header — folded hides the description/tags and
     dims the background to a compact bar */
  .hi-head.folded .hi-head-bg, .hi-head.folded .hi-head-scrim { opacity: 0.25; }
  .hi-head.folded .hi-head-body { min-height: 0; padding: 10px 14px 8px; }
  .hi-head.folded .hi-desc, .hi-head.folded .hi-chips,
  .hi-head.folded .hi-meta { display: none; }
  .hi-body { flex: 1 1 auto; min-height: 0; }
  .hi-body .fmt { font-size: var(--ui-fs); }
  /* v0.58 (pt 8): the payload view toggle */
  .hi-viewrow { display: flex; margin: 0 0 10px; }
  /* v0.63 (user spec pt 4): the [cards|repo] / [stages|raw] segments —
     WIDER, more polished: bigger hit area, min-width per segment, a
     colored border on the active side, smooth transitions. */
  .hi-viewseg {
    display: inline-flex; padding: 3px; gap: 3px;
    background-color: var(--raised-chrome); border: 1px solid var(--border); border-radius: 999px;
  }
  .hi-viewseg button {
    border: none; background: transparent; color: var(--text-3);
    font-family: inherit; font-size: var(--ui-small-fs); font-weight: 700;
    padding: 5px 16px; min-width: 72px; text-align: center; border-radius: 999px;
    cursor: pointer; letter-spacing: 0.02em;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .hi-viewseg button.on {
    color: var(--hub-tone, var(--accent-2));
    background: rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.16);
    box-shadow: inset 0 0 0 1px rgba(var(--hub-tone-rgb, var(--accent-2-rgb)), 0.45);
  }
  .hi-viewseg button:disabled { cursor: default; opacity: 0.45; }
  .hi-stages { margin-top: 2px; }
  .hi-fabs {
    position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    margin-top: auto; display: flex; justify-content: flex-end; gap: 10px;
    z-index: 2;
  }
  /* v0.58 (VLM polish): the soft DOCK — content fades out under the fabs
     instead of hard-cutting beneath them. */
  .hi-fabs::before {
    content: ''; position: absolute; left: -14px; right: -14px;
    top: -26px; bottom: -12px; z-index: -1; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(var(--bg-panel-rgb), 0) 0%,
      rgba(var(--bg-panel-rgb), 0.82) 62%,
      rgba(var(--bg-panel-rgb), 0.9) 100%);
    border-radius: 20px;
  }
  /* v0.58 (pt 7): the fabs — round, OPAQUE, ~2× the visual weight of the
     old 54px squares. Real IconLib glyphs; the heart fills + goes solid
     err when on (opaque like an endorsement). */
  .hi-fab {
    width: 62px; height: 62px; border-radius: 50%; background-color: var(--raised-chrome);
    border: 1.5px solid var(--border-strong); color: var(--text-1);
    cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,0.42), 0 2px 6px rgba(0,0,0,0.28);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.14s ease;
  }
  .hi-fab:active { transform: scale(0.92); background: var(--surface-3); }
  .hi-fab .icl { display: block; }
  .hi-fab.on {
    color: var(--on-accent, #fff); border-color: var(--err);
    background: var(--err);
  }
  .hi-fab.locked { opacity: 0.55; }
  .hi-fab--use {
    color: var(--on-accent, #fff); border-color: transparent;
    background: var(--accent);
  }
  /* v0.60 (pt A.3): the DELETE fab — err-tinted (danger), shown only when
     the item is downloaded. */
  .hi-fab--del {
    color: var(--err); border-color: rgba(var(--err-rgb), 0.55);
    background: rgba(var(--err-rgb), 0.10);
  }
  /* v0.60 (pt A.3): the delete CONFIRM BAR — replaces the fab row so an
     accidental tap can never destroy a download. keep = neutral, remove =
     solid err. Theme vars only. */
  .hi-delbar {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background-color: var(--raised-chrome); border: 1.5px solid rgba(var(--err-rgb), 0.55);
    border-radius: 18px; padding: 8px 12px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.42), 0 2px 6px rgba(0,0,0,0.28);
  }
  .hi-delbar-text {
    flex: 1; min-width: 0; font-size: calc(var(--ui-small-fs) - 1px);
    color: var(--text-1); line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .hi-delbar-text b { color: var(--err); font-weight: 700; }
  .hi-delbar-btn {
    flex-shrink: 0; border-radius: 999px; padding: 9px 16px;
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700; font-family: inherit;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text-1);
  }
  .hi-delbar-btn--rm {
    background: var(--err); border-color: var(--err); color: var(--on-accent, #fff);
  }

  /* ── publish + the HF connect flow (hubpublish.js) ───────────────── */
  .hp-root { display: flex; flex-direction: column; gap: 8px; }
  .hp-textarea {
    width: 100%; box-sizing: border-box; background-color: var(--raised-chrome);
    border: 1px solid var(--border); color: var(--text-1); padding: 10px 12px;
    border-radius: 10px; font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit;
    outline: none; resize: vertical; min-height: 44px; line-height: 1.5;
  }
  .hp-textarea:focus { border-color: var(--accent); }
  .hp-payload { min-height: 170px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  /* v0.60 pt C.8: THE FILES SECTION — one path input + content textarea
     + remove per companion file (repo publishing). */
  .hp-file { margin: 0 0 12px; display: flex; flex-direction: column; gap: 6px; }
  .hp-file-pathrow { display: flex; gap: 6px; align-items: stretch; }
  .hp-file-path { flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .hp-file-rm {
    flex-shrink: 0; width: 38px; border-radius: 8px; cursor: pointer;
    background: rgba(var(--err-rgb), 0.10); border: 1px solid rgba(var(--err-rgb), 0.45);
    color: var(--err); font-size: var(--ui-small-fs); font-weight: 700; font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-file-content { min-height: 84px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .hp-addfile {
    width: 100%; padding: 9px 12px; border-radius: 10px; cursor: pointer;
    background: rgba(var(--accent-2-rgb), 0.08); border: 1px dashed rgba(var(--accent-2-rgb), 0.5);
    color: var(--text-1); font-size: var(--ui-small-fs); font-weight: 700; font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hp-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(var(--accent-2-rgb), 0.12); border: 1px solid rgba(var(--accent-2-rgb), 0.4);
    color: var(--text-2); border-radius: 999px; padding: 3px 9px;
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 600;
  }
  .hp-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: inherit; padding: 0; font-family: inherit; line-height: 1;
  }
  .hp-seg {
    display: flex; gap: 6px; border: 1px solid var(--border);
    border-radius: 11px 9px 12px 10px / 10px 12px 9px 11px;
    overflow: hidden; background: var(--surface-1);
  }
  .hp-seg button {
    flex: 1 1 0; background: transparent; border: none; color: var(--text-3);
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700; padding: 8px 4px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-seg button[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.16); color: var(--text-1);
  }
  .hp-design { display: flex; flex-direction: column; gap: 8px; }
  .hp-colors { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hp-color {
    width: 46px; height: 36px; border: 1px solid var(--border); border-radius: 8px;
    background-color: var(--raised-chrome); cursor: pointer; padding: 2px;
  }
  .hp-mini {
    background-color: var(--raised-chrome); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 8px; padding: 6px 10px; font-size: calc(var(--ui-small-fs) - 1px);
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-imgrow { display: flex; }
  .hp-pick {
    flex: 1; background-color: var(--raised-chrome); border: 1px solid var(--border);
    color: var(--text-1); padding: 11px 14px; min-height: 44px; border-radius: 10px;
    font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit; cursor: pointer;
  }
  .hp-imgmeta {
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--ok);
    display: flex; align-items: center; gap: 8px;
  }
  .hp-preview {
    height: 64px; border-radius: 10px; border: 1px solid var(--border);
    background-size: cover; background-position: center; flex-shrink: 0;
  }
  .hp-err { font-size: var(--ui-small-fs); color: var(--err); line-height: 1.5; min-height: 4px; }

  /* v0.31.2: the HF connect flow's step headers + subtexts — BRIGHTER,
     accent-tinted headers (--fmt-bright text + the step number in
     --fmt-link, the formatter's own accent slots) with LARGER step
     instructions in the theme's primary secondary color. The old
     micro-label + dim hint were too quiet for a two-step guide. */
  .hc-step {
    font-size: calc(var(--ui-fs) - 0.5px); font-weight: 700; letter-spacing: 0.2px;
    color: var(--fmt-bright); margin: 16px 2px 6px;
  }
  .hc-step .hc-num {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--fmt-link); margin-right: 5px;
  }
  .hc-sub {
    font-size: calc(var(--ui-small-fs) + 1px); color: var(--text-2);
    line-height: 1.6; margin: 0 2px 10px;
  }

  /* ══ v0.33 — THE SHARED UI KIT (uikit.js) ═══════════════════════════
     UIPills / GradientUI / CropUI. The pill system: ONE look for every
     pill in the app — matte surfaces, ORGANIC hand-drawn corner radii
     (each pill in a group gets its own corner set — drawn, not stamped),
     a 1px offset sketch stroke, theme-driven tints (accent by default,
     --persona-rgb / --template-rgb for the library tones). Compact by
     design: "as little as possible without compromising any visuals". */
  .dx-pill {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 6px 12px; min-height: 32px;
    background-color: var(--raised-chrome); color: var(--text-2);
    border: 1px solid var(--border);
    font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 700; letter-spacing: 0.25px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    box-shadow: 1px 1.5px 0 rgba(var(--border-rgb), 0.9);   /* the sketch stroke */
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  /* the hand-drawn corner sets — position-cycled so neighbors differ */
  .dx-pill:nth-child(4n+1) { border-radius: 10px 8px 11px 9px / 9px 11px 8px 10px; }
  .dx-pill:nth-child(4n+2) { border-radius: 8px 11px 9px 10px / 11px 8px 10px 9px; }
  .dx-pill:nth-child(4n+3) { border-radius: 11px 9px 8px 10px / 8px 10px 11px 9px; }
  .dx-pill:nth-child(4n)   { border-radius: 9px 10px 10px 8px / 10px 9px 8px 11px; }
  .dx-pill:active { background: var(--surface-3); }
  .dx-pill[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.14);
    border-color: rgba(var(--accent-2-rgb), 0.55); color: var(--text-1);
  }
  .dx-pill[data-tone="persona"][data-on="1"] {
    background: rgba(var(--persona-rgb), 0.14);
    border-color: rgba(var(--persona-rgb), 0.55); color: var(--persona-tint);
  }
  .dx-pill[data-tone="template"][data-on="1"] {
    background: rgba(var(--template-rgb), 0.13);
    border-color: rgba(var(--template-rgb), 0.55); color: var(--template-tint);
  }
  /* v0.44 var-twin: the ON pill layers the accent-2 gradient image over
     its tint (this pill's accent IS accent-2). Scoped with
     :not([data-tone]) — the persona/template tones keep their own look,
     and the base `background:` shorthand above can't reset the image
     from here. A no-op while accent-2 is a solid. */
  .dx-pill[data-on="1"]:not([data-tone]) {
    background-image: var(--accent-2-gradient, none);
  }
  .dx-pill--sm { padding: 3px 9px; min-height: 26px;
    font-size: calc(var(--ui-small-fs) - 1.5px); }
  .dx-pill--sm .dx-pill-ico { font-size: calc(var(--ui-small-fs) - 0.5px); }
  .dx-pill-ico { font-size: calc(var(--ui-small-fs) + 1px); line-height: 1; flex-shrink: 0; }
  .dx-pill-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* the tag chips (publish chips, item-detail tags) — same language */
  .dx-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(var(--accent-2-rgb), 0.12); border: 1px solid rgba(var(--accent-2-rgb), 0.4);
    color: var(--text-2); border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px;
    padding: 3px 9px; font-size: calc(var(--ui-small-fs) - 1px); font-weight: 600;
    box-shadow: 1px 1px 0 rgba(var(--border-rgb), 0.8);
  }
  .dx-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: inherit; padding: 0; font-family: inherit; line-height: 1;
  }

  /* GradientUI — the 1–15 color gradient editor.
     v0.54 POLISH (user spec: "the expanded options look extremely
     prototypish… much more finished and professional"): even radii,
     soft ambient shadows, hover/focus states, the ✕ INSIDE the chip
     (no more floating offsets) — the v0.33 hand-drawn wobble is gone.
     Everything rides theme vars. */
  .gr-editor { display: flex; flex-direction: column; gap: 10px; }
  .gr-swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 2px; }
  .gr-swatch { position: relative; display: inline-flex; }
  .gr-color {
    width: 46px; height: 36px; padding: 2px;
    border: 1px solid var(--border); border-radius: 10px;
    background-color: var(--raised-chrome); cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .gr-color:hover { border-color: var(--border-strong); }
  .gr-color:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.35);
  }
  .gr-rm {
    position: absolute; top: 3px; right: 3px;
    width: 17px; height: 17px; border-radius: 50%;
    background: var(--surface-3); color: var(--text-2);
    border: 1px solid var(--border-strong);
    box-shadow: 0 0 0 2px var(--surface-2);
    font-size: 9px; line-height: 1; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .gr-rm:hover { color: var(--text-1); border-color: var(--accent); }
  .gr-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gr-mini {
    background-color: var(--raised-chrome); border: 1px solid var(--raised-ring); color: var(--text-2);
    border-radius: 9px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.14);
    padding: 6px 11px; font-size: calc(var(--ui-small-fs) - 1px);
    font-family: inherit; cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .gr-mini:hover { border-color: var(--border-strong); color: var(--text-1); }
  .gr-mini:active { transform: translateY(1px); box-shadow: none; }
  .gr-mini:disabled { opacity: 0.35; cursor: default; }
  .gr-count { margin-left: auto; font-size: var(--ui-micro-fs); color: var(--text-3);
    font-variant-numeric: tabular-nums; font-weight: 700; }
  .gr-cap { font-size: var(--ui-micro-fs); color: var(--text-3); }
  /* the tweaks Background gradient preview (tweaks.js) — same polish */
  .gr-preview {
    height: 52px; border-radius: 12px;
    border: 1px solid var(--border); flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* CropUI — the drag-to-crop overlay (full-screen, above the panel) */
  .crop-ui {
    position: fixed; inset: 0; z-index: 9500;
    display: flex; flex-direction: column;
    background: rgba(var(--bg-panel-rgb), 0.97);
  }
  .crop-top {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  }
  .crop-title { flex: 1; text-align: center; color: var(--text-1);
    font-size: var(--ui-fs); font-weight: 700; }
  .crop-btn {
    min-width: 44px; min-height: 40px; padding: 6px 12px;
    background-color: var(--raised-chrome); border: 1px solid var(--raised-ring); color: var(--text-1);
    border-radius: 10px 8px 11px 9px / 9px 11px 8px 10px;
    font-family: inherit; font-size: var(--ui-small-fs); font-weight: 700; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .crop-ok { color: var(--ok); border-color: rgba(var(--ok-rgb), 0.5);
    background: rgba(var(--ok-rgb), 0.12); }
  .crop-stage {
    flex: 1 1 auto; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; overflow: hidden; cursor: grab;
  }
  .crop-stage.grabbing { cursor: grabbing; }
  .crop-fit { position: relative; }
  .crop-img { position: absolute; top: 0; left: 0;
    user-select: none; -webkit-user-drag: none; will-change: transform; }
  .crop-frame {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 0 9999px rgba(6,6,10,0.78);
  }
  .crop-ctl {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .crop-zoom { flex: 1; accent-color: var(--accent); }
  /* v0.34: touch-action REMOVED — `none` disabled the range input's native
     touch dragging (the slider ignored finger moves); the default lets the
     OS own the thumb, and the .crop-ui isInsideUI registration stops the
     document touchstart preventDefault that also killed it. */
  .crop-hint { color: var(--text-3); font-size: var(--ui-micro-fs); flex-shrink: 0; }

  /* v0.33 — the publish form: collapsible sections + the payload FOCUS
     mode (the payload can own the screen; the other sections collapse
     away and come back with one tap). The * rides the theme's primary. */
  .hp-root { display: flex; flex-direction: column; gap: 8px; min-height: 100%; }
  .hp-sec {
    border: 1px solid var(--border); border-radius: 13px 10px 14px 11px / 11px 14px 10px 13px;
    background: var(--surface-1); overflow: hidden;
    box-shadow: 1.5px 1.5px 0 rgba(var(--border-rgb), 0.5);
  }
  .hp-sec-bar {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 12px; background: transparent; border: none;
    color: var(--text-2); font-family: inherit; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-sec-title {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .hp-sec-chev { margin-left: auto; color: var(--text-3); font-size: var(--ui-small-fs);
    transition: transform 0.18s ease; }
  .hp-sec.folded .hp-sec-chev { transform: rotate(-90deg); }
  .hp-sec-body { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .hp-sec.folded .hp-sec-body { display: none; }
  .hp-star { color: var(--accent); }
  .hp-focus-btn {
    background-color: var(--raised-chrome); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px;
    font-family: inherit; font-size: var(--ui-micro-fs); font-weight: 700;
    padding: 4px 9px; cursor: pointer; flex-shrink: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  /* FOCUS MODE — the payload owns the screen */
  .hp-root.hp-focus { height: 100%; min-height: 0; }
  .hp-root.hp-focus > .pv-hint { display: none; }
  .hp-root.hp-focus .hp-sec { display: none; }
  .hp-root.hp-focus .hp-payload-sec { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .hp-root.hp-focus .hp-payload { flex: 1 1 auto; min-height: 0; height: auto; resize: none; }
  .hp-payload-sec .hp-sec-bar { align-items: center; }
  .hp-payload-sec .hp-sec-body { flex: 1 1 auto; min-height: 0; }

  /* v0.33 — the tweaks Background segment (color / gradient / image) */
  .tw-bgseg { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .tw-bgzone { display: flex; flex-direction: column; gap: 8px; }

  /* v0.52: the tweaks CHAT ICON grid — the family glyph cells + the
     letter + the custom image, all circular avatars (user spec item 10). */
  .tw-icongrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 2px; }
  .tw-iconcell {
    width: 52px; height: 52px; border-radius: 50%;
    background-color: var(--raised-chrome); border: 2px solid var(--border);
    color: var(--text-1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; overflow: hidden; flex-shrink: 0;
    font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .tw-iconcell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    pointer-events: none;
  }
  .tw-iconcell-letter {
    font-size: calc(var(--ui-fs) + 6px); font-weight: 800; color: var(--text-1);
    line-height: 1; pointer-events: none;
  }
  .tw-iconcell[data-on="1"] {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 2px rgba(var(--accent-2-rgb), 0.35);
  }

  /* the persona picker's heart badges (persona.js) ───────────────── */
  .pp-heart {
    position: absolute; right: 9px; bottom: 7px; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(var(--border-rgb), 0.75);
    color: var(--text-3-dim); font-size: calc(var(--ui-small-fs) - 1px);
    cursor: pointer; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pp-heart.on { color: var(--err); }

  /* ── v0.41 POLISH ──────────────────────────────────────────────── */
  /* themed text selection everywhere (was the OS-default harsh blue) */
  ::selection { background: rgba(var(--accent-rgb), 0.34); }
  ::selection:window-inactive { background: rgba(var(--accent-rgb), 0.20); }
  /* inputs share the accent caret so typing feels like the theme */
  input, textarea { caret-color: var(--accent); }

  /* ══ v0.66 THE PROJECTION SYSTEM — v1.01.5 THE LOCAL LIGHT ══════
     (the user's per-variable model, made literal — replaces the
     v0.45 twin catchers + v0.56 field + v0.57 layer/veil stack)
     Every customizable variable owns ONE gradient twin: theme.js
     writes --X-gradient, and EVERY consumer paints it LOCALLY (the
     element's own border-box — v1.01.5; the v0.66 fixed-attachment
     "viewport window" trick retired: it split into a second hidden
     field inside transformed panels and rode Chromium's slow path —
     docs/RESEARCH-V102-LOCAL-LIGHT.md).
     The canvas (--bg-panel) already paints its gradient natively in
     app.js; text gradients are the fmt track (local by v1.00.2).
     The v0.45 !important catchers stay (inline `background:`
     SHORTHAND still resets background-image; 'none' twins still
     no-op). The v0.57 VEILS are GONE — the ink washes were the
     "stained white" family of bugs (see the :root note); --veil-ink
     now feeds only --text-shadow.
     Inline catchers first, then the stylesheet groups. */
  /* — inline catchers — Layer 2 cards: the surface-1 projection window */
  [style*="background: var(--surface-1)"],
  [style*="background:var(--surface-1)"] {
    background-image: var(--surface-1-gradient, none) !important;
  }
  /* — inline catchers — Layer 3 pills/inputs: the surface-2 projection */
  [style*="background: var(--surface-2)"],
  [style*="background:var(--surface-2)"] {
    background-image: var(--surface-2-gradient, none) !important;
  }
  [style*="background: var(--bg-app)"],
  [style*="background:var(--bg-app)"] { background-image: var(--bg-app-gradient, none) !important; }
  [style*="background: var(--accent)"],
  [style*="background:var(--accent)"] { background-image: var(--accent-gradient, none) !important; }
  [style*="background: var(--accent-2)"],
  [style*="background:var(--accent-2)"] { background-image: var(--accent-2-gradient, none) !important; }
  [style*="background: var(--accent-3)"],
  [style*="background:var(--accent-3)"] { background-image: var(--accent-3-gradient, none) !important; }
  [style*="background: var(--accent-4)"],
  [style*="background:var(--accent-4)"] { background-image: var(--accent-4-gradient, none) !important; }
  /* v0.57: border-strong backgrounds (chatbot icon tiles, badges) ride the
     border sweep — theme.js derives --border-strong-gradient whenever the
     border is overridden (same family of color → same underlying field). */
  [style*="background: var(--border-strong)"],
  [style*="background:var(--border-strong)"] { background-image: var(--border-strong-gradient, none) !important; }

  /* — Layer 1: the big surfaces. The full field, NO veil (these ARE the
     panel — the canvas's own material) — but the TEXT safety net rides
     here (a user gradient can carry a white stop under the text). */
  #chat-panel, .panel-header, .panel-body {
    background-image: var(--surface-1-gradient, none);
    text-shadow: var(--text-shadow);
  }

  /* — Layer 2: cards on surfaces. v1.03.1 THE CARD (user spec: "have
     the elements inside the panel use something else… create a new card
     color variable and use that… having the boxes and nested elements
     within the panel use surface color makes them tile"). The 2-LAYER
     PLATE + the surface WINDOW die here — every nested card is the
     FLAT derived --card (it can never re-tile the panel's gradient);
     the ring stays the derived hairline. History: v0.72's 3-layer
     plate killed the border-gradient leak; v0.99.5 collapsed it to 2
     layers; v1.03.1 flattens it — the gradient language now lives on
     the big surfaces (Layer 1 + the overlay class) and the accent
     pills, while nested boxes read as raised card material. */
  .settings-section, .hub-card, .pv-row, .msg-assistant, .ts-row,
  .hmsg-card, .starter-chip, .fmt-codecard, .fmt-yt, .fmt-code, .fmt-pre,
  .code-card, .artifact-card, .art-panel, .art-row, .art-ed-body,
  .art-sheet, .cm-s-doomalay.CodeMirror, .hp-sec, #send-menu, .kb-card,
  .cv-section, .mb-more, .wsx-opt {
    background-color: var(--card);
    background-image: none;
    text-shadow: var(--text-shadow);
  }
  /* v0.79.3: THE GRADIENT-EDITOR BOXES — the expanded color-row dropdown
     joins the SURFACE family (user spec: "surface raised should not
     re-paint this box, that box should remain the surface color
     variable"). The editor surfaces read as cuts of the card they sit
     on; their inner controls (.gr-color/.gr-mini/.gr-dir) stay raised
     chrome on top.
     v0.91.2: NATIVE — the projected 3-layer window retires here (54 more
     viewport-rasters on the colors tab); a perceptual color-mix raises
     the box off the surface-1 card, the border mix carries the ring
     tone. Flat fallbacks for no-color-mix browsers. */
  .gr-editor, .gr-swatches, .gr-tools {
    /* v1.03.1: the editor boxes join the CARD family (flat — the
       nested tiling kill; was a surface-1×surface-2 mix) */
    background-color: var(--card);
    border-color: var(--border);
    text-shadow: var(--text-shadow);
  }
  /* v0.72 → v1.03.1: src-wrap / hub-wrap are the chat's overlay-class
     content boxes — nested in the panel, so they ride the flat CARD
     now (the bg-app plate re-tiled the canvas field inside the panel;
     the ring stays the derived hairline). */
  .src-wrap, .hub-wrap {
    background-color: var(--card);
    background-image: none;
    text-shadow: var(--text-shadow);
  }

  /* — Layer 3: pills / tabs / chips / inputs / small buttons — the
     SURFACE-2 projection (a different field than the cards behind them,
     so they always read as raised chrome). v0.66: no veil — pure
     windows. Includes the untyped inputs the input[type=text] selector
     misses. v0.72: the chat's OUTLINE pills join the family — the
     dashed tool-progress pill + the chatbot's own chrome (the icon
     disc + the metadata name pill + the sandbox corner badge) — every
     pill that appears in/around chat now windows its variable (user
     spec: "the pills in the chat metadata and the chatbot itself…
     still don't render the gradients or theme very nicely or at all").
     v0.77.8: THE PLATE + RING — the group upgrades from a bare window
     to the full stack (window + opaque s2 plate + the border ring):
     the bordered pills among them (the pickers…) were the "some
     borders render the FIRST COLOR" population — their window never
     carried a ring. Border-less members are unaffected (a zero-width
     border strip hides the ring; the plate is byte-identical to the
     old solid look).
     v0.79.3: THE REBALANCE (user spec: "assign less variables to
     surface raised and assign them to border") — the gr-editor boxes
     moved to the SURFACE family above; the outline-pill family
     (settings tabs, search bars, reset pills, kbd, util buttons)
     moved to the BORDER family below. What remains here: the TRUE
     raised chrome — inputs, textareas, selects, switch tracks, chips,
     hover states, the chatbot disc — the 'inputs · hover · raised
     cards' contract of the Surface-raised variable. */
  /* v0.91.2 → v0.99.4: THE RAISED CHROME derives from THE FIELDS now —
     one derivation point for every small control's fill + ring (flat
     fallback first for browsers without color-mix; the second block is
     dropped as invalid there). The ring sits between the hairline (13%)
     and border-strong (24%) so outline pills read distinctly from flat
     cards — calibrated with the rest of the table. */
  :root { --raised-chrome: var(--surface-2); --raised-ring: var(--border); }
  :root {
    --raised-chrome: color-mix(in oklab, var(--field-surface), var(--field-ink) 5%);
    --raised-ring: color-mix(in oklab, var(--field-surface), var(--field-ink) 16%);
  }
  /* v0.91.2: LAYER-3 GOES NATIVE (the color-rework Track 1). For four
     versions every control here was a 3-layer projected WINDOW on the
     surface-2/border fields (fixed-attachment → the PROJ painter poked
     background-position/size per element → 534 viewport-sized rasters on
     the colors tab alone, re-rastered on every --proj-tx/ty poke from the
     canvas physics tick — THE device-side colors-tab lag). The browser's
     own engine now derives the chrome: a perceptual color-mix of the
     surface/border variables — zero JS, zero projection, raster cost =
     the element's own box, theme flips re-derive natively in style
     recalc. Browsers without color-mix keep the flat fallbacks (the
     first declarations); the projected model survives on the BIG
     surfaces (panels, sections, the chatbot disc) where the field is
     actually visible. */
  .app-range, input[type=text], input[type=password], input[type=email],
  input[type=number], textarea, select, .app-switch-track,
  .ts-row:hover, .ts-row:active, .pv-btn:hover,
  .err-switch, .chat-jump, .ts-chip, .art-rename-input, .art-sheet-input,
  .art-toast, .hub-searchico, .hub-libpill, .hub-bunch-sec-n,
  .hub-bunch-chip, .hub-nav, .hp-icocell, .hi-fab, .hp-color, .hp-mini,
  .hp-pick, .dx-pill, .gr-color, .gr-mini, .crop-btn, .hp-focus-btn,
  .tw-iconcell, .chat-find-chip, .sm-ghost, #chat-send-more, .gr-dir,
  .cv-input, .cv-chip, .cv-badge, .cv-count-chip, .wsx-input, .wsx-act,
  .wsc-brsel, .pv-btn,
  #pe-name, #ph-key, #ph-val, #menu,
  .tool-pill-progress {
    background-color: var(--raised-chrome);   /* the flat fallback rides the var */
    border-color: var(--raised-ring);
  }
  /* v0.92.1 THE ORBIT REST — the chatbot disc + name go LOCAL
     (scroll-attachment: the gradient renders at the element's own box).
     The measured root cause of the sustained gradient lag: while a tab
     group orbits, every member's per-frame style.transform write woke
     the projection painter for a FULL anchor walk + raster (~30 paints/s
     + ~92 motion ticks/s, forever — RESEARCH-V092's orbit rig), and the
     disc's own projected window was the reason a moving icon needed
     re-anchoring at all. Precedent: v0.91.3 dere-projected the gradient
     editor previews with the exact argument — "viewport projection at
     52px is invisible" — the disc is 56px, the name pill smaller. Solid
     themes render byte-identical (no gradient vars — the plate + ring
     unchanged); gradient themes show the field at the disc's own scale
     instead of a 56px window into the viewport field. The projected
     model survives on the REAL scale surfaces (panels, sections,
     banners) — with (b) below, their anchors now only re-validate on
     genuine layout changes, never on icon motion. */
  .chatbot .icon, .chatbot .name {
    /* v1.03.1: the icon chrome + the name pill ride the flat CARD
       (nested elements must not re-tile the surface field — the pill
       was a local surface-gradient window) */
    background-color: var(--card);
    background-image: none;
  }
  /* ══ v0.74 BRIGHT-SURFACE INK (the settings colors wave) ══════════
     User report: "Surface raised … any color that is bright looks
     horrible." A bright surface-2 makes every Layer-3 pill a bright
     window — the light --text-1/2 ink vanishes on it. theme.js
     derives --on-surface-N (the --on-accent pattern) from the
     RESOLVED solid and trips [data-bright-sN] when it's the dark ink;
     these flips then carry the readable color. Base themes never
     trip the gates — byte-identical rendering. No !important: an
     element's OWN color rule still wins by source order where it
     comes later, which is exactly the escape hatch semantic colors
     (links, accents, warn states) need. */
  [data-bright-s2] .app-range, [data-bright-s2] input[type=text],
  [data-bright-s2] input[type=password], [data-bright-s2] input[type=email],
  [data-bright-s2] input[type=number], [data-bright-s2] textarea,
  [data-bright-s2] select, [data-bright-s2] .app-switch-track,
  [data-bright-s2] .err-switch,
  [data-bright-s2] .chat-jump, [data-bright-s2] .ts-chip,
  [data-bright-s2] .art-rename-input, [data-bright-s2] .art-sheet-input,
  [data-bright-s2] .art-toast, [data-bright-s2] .hub-searchico,
  [data-bright-s2] .hub-libpill, [data-bright-s2] .hub-bunch-sec-n,
  [data-bright-s2] .hub-bunch-chip, [data-bright-s2] .hub-nav,
  [data-bright-s2] .hp-icocell, [data-bright-s2] .hi-fab, [data-bright-s2] .hp-color,
  [data-bright-s2] .hp-mini, [data-bright-s2] .hp-pick, [data-bright-s2] .dx-pill,
  [data-bright-s2] .gr-color, [data-bright-s2] .gr-mini, [data-bright-s2] .crop-btn,
  [data-bright-s2] .hp-focus-btn, [data-bright-s2] .tw-iconcell,
  [data-bright-s2] .chat-find-chip, [data-bright-s2] .sm-ghost,
  [data-bright-s2] #chat-send-more, [data-bright-s2] .gr-dir,
  [data-bright-s2] .cv-input, [data-bright-s2] .cv-chip, [data-bright-s2] .cv-badge,
  [data-bright-s2] .cv-count-chip, [data-bright-s2] .wsx-input, [data-bright-s2] .wsx-act,
  [data-bright-s2] .wsc-brsel, [data-bright-s2] .pv-btn,
  [data-bright-s2] #pe-name, [data-bright-s2] #ph-key, [data-bright-s2] #ph-val,
  [data-bright-s2] #menu {
    color: var(--on-surface-2, var(--text-1));
    text-shadow: none;
  }
  /* bright Layer-2 cards: the readable ink + the dark-theme
     text-shadow retired (a dark shadow under dark text on a bright
     card was its own smudge artifact). */
  [data-bright-s1] .settings-section, [data-bright-s1] .hub-card,
  [data-bright-s1] .pv-row, [data-bright-s1] .msg-assistant,
  [data-bright-s1] .ts-row, [data-bright-s1] .hmsg-card,
  [data-bright-s1] .starter-chip, [data-bright-s1] .fmt-codecard,
  [data-bright-s1] .fmt-yt, [data-bright-s1] .fmt-code, [data-bright-s1] .fmt-pre,
  [data-bright-s1] .code-card, [data-bright-s1] .artifact-card,
  [data-bright-s1] .art-panel, [data-bright-s1] .art-row, [data-bright-s1] .art-ed-body,
  [data-bright-s1] .art-sheet, [data-bright-s1] .cm-s-doomalay.CodeMirror,
  [data-bright-s1] .hp-sec, [data-bright-s1] #send-menu, [data-bright-s1] .kb-card,
  [data-bright-s1] .cv-section, [data-bright-s1] .mb-more, [data-bright-s1] .wsx-opt,
  /* v0.79.3: the gradient-editor boxes ride the surface ink too */
  [data-bright-s1] .gr-editor, [data-bright-s1] .gr-swatches, [data-bright-s1] .gr-tools {
    color: var(--on-surface-1, var(--text-1));
    text-shadow: none;
  }
  /* a bright overlay background: the overlay screens + their headers. */
  [data-bright-bg] #connect-overlay, [data-bright-bg] .settings-section h3,
  [data-bright-bg] #chat-header, [data-bright-bg] .pub-head-bar,
  [data-bright-bg] .src-wrap, [data-bright-bg] .hub-wrap {
    color: var(--on-bg-app, var(--text-1));
    text-shadow: none;
  }
  /* v0.72 → v1.03.1: the chatbot's METADATA name pill — the user spec
  (v1.03 point 1): nested elements stop windowing the SURFACE field
  (each pill re-tiled the gradient in its own box). Flat card glass
  now — readable, tile-free, consistent with the DOM-side .name. */
  .chatbot .name {
    background-color: rgba(var(--card-rgb), 0.92);
    background-image: none;
  }
  /* v0.72 → v1.03.1: the sandbox corner badge — same card treatment
     (was a surface window). */
  .chatbot .sandbox-badge {
    background-color: rgba(var(--card-rgb), 0.92);
    background-image: none;
  }
  /* v0.49 → v1.01.5: the chat panel + settings pages are SURFACES —
     their gradient rides --surface-1 (above). The overlay screens ride
     the SURFACE too now (the overlay card paints inline
     background:var(--surface-1) in connectoverlay.js — the [style*]
     twin catcher layers the gradient; the old --bg-app base showed
     "the first color set for canvas", per the user's report).
     v0.56: the collapsible headers + util pills NO LONGER repaint the
     overlay background — nested same-var boxes tiled (user spec:
     "make them act like one big box"). Headers are TRANSPARENT VEILS over
     their parent's continuous field (see .settings-section h3 / #chat-header
