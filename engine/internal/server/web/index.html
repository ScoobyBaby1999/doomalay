    border-radius: 8px; padding: 6px 12px; font-size: var(--ui-small-fs); font-weight: 600;
    cursor: pointer; font-family: inherit; flex-shrink: 0; touch-action: manipulation;
  }
  .art-ed-btn.dirty { color: var(--fmt-a1); border-color: rgba(var(--accent-2-rgb),0.5); background: rgba(var(--accent-2-rgb),0.07); }
  .art-ed-btn:disabled { opacity: 0.45; }
  .art-ed-btn-danger { color: var(--err); border-color: rgba(var(--err-rgb),0.35); }
  .art-ed-body { flex: 1; min-height: 0; position: relative; background: var(--surface-1); }
  .art-cm-host { position: absolute; inset: 0; }
  .art-cm-host .CodeMirror { height: 100%; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }

  /* ── v0.29 THE FILE TREE (wunderbaum, vendored MIT — dist/wunderbaum.css
     is loaded lazily; these overrides re-skin it to the app's dark theme,
     VS-Code-style: root folders flush-left, one indent per nesting level,
     collapsible, VIRTUAL SCROLLING so a whole monorepo (100k+ nodes) stays
     smooth — only the visible rows ever exist in the DOM). ───────────── */
  .art-tree {
    height: 100%;
    --wb-font-stack: inherit;
    --wb-row-outer-height: 34px;
    --wb-row-inner-height: 32px;
    --wb-node-text-color: var(--text-1);
    --wb-border-color: var(--surface-2);
    --wb-background-color: transparent;
    --wb-background-color-dark: transparent;
    --wb-alternate-row-color: transparent;
    --wb-hover-color: rgba(var(--accent-2-rgb), 0.07);
    --wb-active-color: rgba(var(--accent-2-rgb), 0.14);
    --wb-active-cell-color: transparent;
    --wb-active-border-color: transparent;
    --wb-focus-border-color: transparent;
    --wb-grid-color: transparent;
    --wb-header-color: transparent;
    --wb-error-color: var(--err);
    font-size: var(--ui-fs);
  }
  .art-tree.wb-tree { background: transparent; }
  /* wunderbaum rows are position:absolute with only `top` set inline —
     `left` falls back to the ambiguous static position, which can shift
     an activated row leftward under some event orders. Pin it. */
  .art-tree .wb-row { left: 0; }
  .art-tree .wb-row {
    border-radius: 8px; cursor: pointer; margin: 0 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .art-tree .wb-row.wb-active .wb-col,
  .art-tree .wb-row.wb-active { background: transparent; }
  .art-tree .wb-row.wb-active > .wb-col span.wb-node { background: transparent; }
  .art-tree .wb-row:active { background: rgba(var(--accent-2-rgb), 0.10); }
  .art-tree .wb-col-span-title, .art-tree .wb-node span.wb-title {
    color: var(--text-1); font-weight: 500;
  }
  .art-tree .wb-node span.wb-icon { display: none; } /* we draw our own emoji icons */
  .art-tree .ft-ico {
    display: inline-block; width: 22px; text-align: center;
    margin-right: 6px; font-size: 15px; flex-shrink: 0;
  }
  .art-tree .wb-folder-closed .ft-ico, .art-tree span.ft-folder { opacity: 0.92; }
  .art-tree .wb-node.wb-folder .ft-ico, .art-tree .wb-row[data-wb-folder] .ft-ico { opacity: 0.92; }
  .art-tree .wb-col.ftc-size, .art-tree .wb-col.ftc-date {
    color: var(--text-3); font-size: calc(var(--ui-small-fs) - 1px);
    font-variant-numeric: tabular-nums; text-align: right; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
  }
  .art-tree .wb-col.ftc-act { flex-shrink: 0; text-align: center; }
  .art-tree .wb-expander { color: var(--text-3); }
  .art-tree .art-act-btn {
    background: transparent; border: none; color: var(--text-3);
    font-size: 15px; line-height: 1; padding: 4px 7px; cursor: pointer;
    border-radius: 6px; font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .art-tree .art-act-btn:active { background: var(--surface-2); color: var(--text-1); }
  /* the ⋯ action strip (mobile action sheet at the bottom of the drawer) */
  .art-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
    background: var(--surface-1); border-top: 1px solid var(--surface-2);
    border-radius: 16px 16px 0 0; padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateY(110%); transition: transform 0.22s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .art-sheet.open { transform: translateY(0); }
  .art-sheet-name {
    color: var(--text-1); font-weight: 700; font-size: var(--ui-fs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 2px 10px;
  }
  .art-sheet-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface-2); border: 1px solid var(--surface-2); border-radius: 10px;
    color: var(--text-1); font-size: var(--ui-fs); font-weight: 600;
    padding: 13px 14px; margin-bottom: 7px; cursor: pointer; font-family: inherit;
    text-align: left; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .art-sheet-btn:active { background: var(--surface-1); }
  .art-sheet-btn.danger { color: var(--err); border-color: rgba(var(--err-rgb),0.3); }
  .art-sheet-cancel { justify-content: center; opacity: 0.75; margin-bottom: 0; }
  .art-sheet-ico { width: 22px; text-align: center; flex-shrink: 0; }
  .art-sheet-input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--fmt-a1);
    border-radius: 8px; color: var(--text-1); font-size: var(--ui-fs);
    padding: 12px 12px; font-family: inherit; outline: none; margin-bottom: 8px;
  }

  /* ── v0.23 VIEWERS (docx · xlsx · archives) ── */
  .vw-xlsx, .vw-arch { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .vw-doc { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .vw-doc { padding: 22px 20px 40px; max-width: 720px; margin: 0 auto; color: var(--text-1); font-size: var(--ui-fs); line-height: 1.62; }
  .vw-title { font-size: 24px; font-weight: 800; text-align: center; color: var(--text-1); margin: 10px 0 18px; }
  .vw-h1 { font-size: calc(var(--ui-fs) + 4px); font-weight: 700; color: var(--text-1); margin: 20px 0 8px; border-bottom: 1px solid var(--surface-2); padding-bottom: 6px; }
  .vw-h2 { font-size: 15.5px; font-weight: 700; color: var(--text-1); margin: 16px 0 6px; }
  .vw-quote { border-left: 3px solid var(--fmt-a2, var(--accent)); padding: 4px 12px; margin: 10px 0; color: var(--text-2); font-style: italic; background: rgba(var(--accent-rgb),0.04); border-radius: 0 8px 8px 0; }
  .vw-li { margin: 4px 0 4px 4px; }
  .vw-li-bullet::before { content: "•"; color: var(--fmt-a2, var(--accent)); margin-right: 9px; }
  .vw-li-num { counter-increment: vwn; }
  .vw-li-num::before { content: counter(vwn) "."; color: var(--fmt-a2, var(--accent)); margin-right: 9px; font-weight: 700; font-size: var(--ui-small-fs); }
  .vw-p { margin: 8px 0; }
  .vw-b { font-weight: 700; color: var(--text-1); }
  .vw-sheets { display: flex; gap: 6px; padding: 10px 12px 0; overflow-x: auto; flex-shrink: 0; }
  .vw-tab {
    background: transparent; border: 1px solid var(--surface-3); color: var(--text-2);
    padding: 5px 14px; border-radius: 8px 8px 0 0; font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .vw-tab[data-on="1"] { background: rgba(var(--accent-2-rgb),0.08); border-color: rgba(var(--accent-2-rgb),0.4); color: var(--accent-2); }
  .vw-sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .vw-table { border-collapse: collapse; font-size: var(--ui-small-fs); min-width: 40%; }
  .vw-table td { border: 1px solid var(--surface-3); padding: 5px 10px; color: var(--text-2); white-space: nowrap; }
  .vw-table td.vw-th { background: rgba(var(--accent-rgb),0.07); color: var(--text-1); font-weight: 700; position: sticky; top: 0; }
  .vw-table td.vw-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ok); }
  .vw-arch-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--surface-2); flex-shrink: 0; }
  .vw-arch-fmt { font-size: calc(var(--ui-small-fs) - 2px); font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent-2); background: rgba(var(--accent-2-rgb),0.08); border: 1px solid rgba(var(--accent-2-rgb),0.3); padding: 3px 8px; border-radius: 6px; }
  .vw-arch-n { color: var(--text-3); font-size: calc(var(--ui-small-fs) - 0.5px); flex: 1; }
  .vw-arch-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px; }
  .vw-arch-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
  .vw-arch-row:active { background: rgba(255,255,255,0.04); }
  .vw-arch-ico { font-size: calc(var(--ui-fs) + 1px); width: 22px; text-align: center; flex-shrink: 0; }
  .vw-arch-name { flex: 1; min-width: 0; color: var(--text-1); font-size: calc(var(--ui-small-fs) + 0.5px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .vw-arch-size { color: var(--text-3); font-size: calc(var(--ui-small-fs) - 1.5px); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .vw-arch-member { flex: 2; min-height: 0; overflow-y: auto; border-top: 1px solid var(--surface-2); padding: 10px 12px; }
  .vw-member-title { color: var(--accent-2); font-size: 12px; font-weight: 700; margin-bottom: 8px; font-family: ui-monospace, Menlo, monospace; }
  .vw-member-pre {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: var(--ui-small-fs); line-height: 1.55; color: var(--text-2);
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  .vw-member-note { color: var(--text-2); font-size: var(--ui-small-fs); padding: 8px 0; }
  .vw-text-full { padding: 14px; }
  .art-fallback-ta {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: var(--surface-1); color: var(--text-1); border: none; outline: none;
    padding: 14px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    resize: none; line-height: 1.5; box-sizing: border-box;
  }
  .art-binary { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-2); }
  .art-binary-name { color: var(--text-1); font-size: calc(var(--ui-fs) + 2px); font-weight: 700; }
  .art-binary-sub { font-size: var(--ui-small-fs); color: var(--text-3); }
  .art-toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px);
    background: var(--surface-2); color: var(--text-1); border: 1px solid var(--border);
    padding: 9px 16px; border-radius: 10px; font-size: calc(var(--ui-small-fs) + 0.5px);
    opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 4000;
    max-width: 86%; text-align: center;
  }
  .art-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── v0.18: unsaved-changes banner (in-DOM, replaces window.confirm) ── */
  .art-unsaved {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #1a1420;
    border-top: 1px solid rgba(var(--err-rgb),0.35);
    transform: translateY(110%); opacity: 0;
    transition: transform 0.22s cubic-bezier(0.32,0.72,0,1), opacity 0.2s;
    z-index: 5;
  }
  .art-unsaved.show { transform: translateY(0); opacity: 1; }

  .pe-identity {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-bottom: 1px solid var(--surface-2);
    font-size: calc(var(--ui-small-fs) - 1px); flex-shrink: 0; overflow: hidden;
  }
  .pe-identity-k {
    flex-shrink: 0; font-weight: 700; font-size: var(--ui-micro-fs); letter-spacing: 0.4px;
    text-transform: uppercase; color: var(--accent);
    background: rgba(var(--accent-rgb),0.1); border: 1px solid rgba(var(--accent-rgb),0.3);
    padding: 2px 7px; border-radius: 5px;
  }
  .pe-identity-v {
    color: var(--text-3); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl; text-align: left;
  }
  .pe-identity-hint {
    display: block; flex-shrink: 0;
    font-size: 9.5px; color: var(--text-3-dim);
    background: rgba(var(--accent-rgb),0.06); border: 1px solid rgba(var(--accent-rgb),0.18);
    padding: 2px 7px; border-radius: 5px; white-space: nowrap;
  }
  .art-unsaved-text { flex: 1; min-width: 0; color: var(--err); font-size: calc(var(--ui-small-fs) + 0.5px); font-weight: 600; }
  .art-unsaved-discard, .art-unsaved-stay {
    background: transparent; border: 1px solid var(--border); color: var(--text-1);
    border-radius: 8px; padding: 7px 12px; font-size: var(--ui-small-fs); font-weight: 600;
    cursor: pointer; font-family: inherit; flex-shrink: 0; touch-action: manipulation;
  }
  .art-unsaved-discard { color: var(--err); border-color: rgba(var(--err-rgb),0.45); }
  .art-unsaved-stay { color: var(--ok); border-color: rgba(var(--ok-rgb),0.4); }

  /* CodeMirror theme — doomalay (matches the fmt scheme) */
  .cm-s-doomalay.CodeMirror { background: var(--surface-1); color: var(--text-1); }
  .cm-s-doomalay .CodeMirror-gutters { background: #101018; border-right: 1px solid var(--surface-2); }
  .cm-s-doomalay .CodeMirror-linenumber { color: var(--text-3-dim); }
  .cm-s-doomalay .CodeMirror-cursor { border-left: 2px solid var(--fmt-a1); }
  .cm-s-doomalay .CodeMirror-selected { background: rgba(var(--accent-2-rgb),0.13); }
  .cm-s-doomalay .CodeMirror-activeline-background { background: rgba(255,255,255,0.025); }
  .cm-s-doomalay .cm-keyword { color: var(--fmt-a1); }
  .cm-s-doomalay .cm-atom { color: var(--warn); }
  .cm-s-doomalay .cm-number { color: var(--warn); }
  .cm-s-doomalay .cm-def { color: var(--accent-3); }
  .cm-s-doomalay .cm-variable { color: var(--text-1); }
  .cm-s-doomalay .cm-variable-2 { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-variable-3, .cm-s-doomalay .cm-type { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-property { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-operator { color: var(--text-2); }
  .cm-s-doomalay .cm-comment { color: var(--text-3-dim); font-style: italic; }
  .cm-s-doomalay .cm-string { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-string-2 { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-meta { color: var(--text-2); }
  .cm-s-doomalay .cm-qualifier { color: var(--text-2); }
  .cm-s-doomalay .cm-builtin { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-bracket { color: var(--text-3); }
  .cm-s-doomalay .cm-tag { color: var(--fmt-a3); }
  .cm-s-doomalay .cm-attribute { color: var(--fmt-a2); }
  .cm-s-doomalay .cm-hr { color: var(--text-3-dim); }
  .cm-s-doomalay .cm-link { color: var(--fmt-link); }
  .cm-s-doomalay .cm-error { color: var(--err); }
  .CodeMirror { font-size: calc(var(--ui-fs) - 1px); }

  /* ══ v0.27 — PANEL VIEW STACK (the master panel is THE reusable panel) ══
     Every list-style surface (personas, placeholders, usage, export,
     mind) renders as a view stacked over the chat inside #chat-panel.
     The old v0.26 sheet.js is deleted; these are its list atoms,
     re-homed. */
  #panel-view-back, #panel-view-x {
    flex-shrink: 0; width: 34px; height: 34px;
    display: none; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-2); font-size: 16px; line-height: 1; cursor: pointer;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #panel-view-back:active, #panel-view-x:active { background: var(--surface-2); }
  /* v0.34: #panel-star-btn (the ★ quick-switch) REMOVED — favorites now
     live in the model browser's own ★ tab; the button + this CSS are gone. */
  .panel-body.pv-mode {
    padding: 12px 14px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  /* rows inside panel views */
  .pv-row {
    display: flex; align-items: center; gap: 11px; width: 100%;
    background: var(--surface-1); border: 1px solid var(--surface-2); border-radius: 10px;
    padding: 12px 13px; margin-bottom: 9px; cursor: pointer; text-align: left;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pv-row:active { background: var(--surface-2); }
  .pv-row-ico { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
  .pv-row-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pv-row-title { font-size: calc(var(--ui-fs) - 0.5px); font-weight: 600; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-row-sub { font-size: calc(var(--ui-small-fs) - 0.5px); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-row-chev { color: var(--text-3-dim); flex-shrink: 0; font-size: 14px; }
  /* v0.28: range sliders for the panel views (mind context window,
     export latest, compaction threshold). accent-color keeps the native
     thumb — themed by the engine's palette.
     v0.29 (user spec): ~14% NARROWER, taken evenly from both sides, and
     touch-action:none so a thumb drag NEVER scrolls the sheet under it
     (paired with gesture.js's ownsGesture guard). */
  .pv-range {
    display: block; width: 86%; margin: 2px auto 4px;
    height: 30px;
    accent-color: var(--accent);
    background: transparent; cursor: pointer;
    touch-action: none;
  }
  /* v0.29: EVERY range input inside the master panel claims its own
     gesture — the sheet's scroll chain must not eat thumb drags. Covers
     the appearance/theme sizing sliders too (their inline width:100%
     is gone — they inherit the same 86% centering). */
  .panel-body input[type="range"] {
    touch-action: none;
  }
  /* v0.29: the settings/appearance sliders — same 86% centered rule as
     .pv-range (their inline width:100% was removed so this applies). */
  .panel-body input.app-range {
    display: block; width: 86%; margin: 0 auto;
  }
  .pv-sub-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-top: 10px;
  }
  /* v0.29: the mind panel asked for breathing room — its rows use this
     roomier variant (labels up top, more space between groups). */
  .pv-sub-row.roomy { margin-top: 18px; }
  .pv-sub-row.roomy + .pv-range { margin-top: 4px; }
  .pv-sub-label {
    font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 600;
    color: var(--text-1); flex-shrink: 0;
  }
  .pv-sub-value {
    font-size: var(--ui-micro-fs); font-weight: 700; color: var(--text-3);
    font-variant-numeric: tabular-nums; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pv-hint { font-size: calc(var(--ui-small-fs) - 0.5px); color: var(--text-3); line-height: 1.55; margin: 2px 2px 12px; }
  /* v0.28: the persona editor's four compact mode pills (always /
     shuffle / trigger / off) — small, at the top, one tap. */
  .pe-mode-row {
    display: flex; gap: 6px; margin-bottom: 10px;
  }
  .pe-mode-pill {
    flex: 1 1 0; min-width: 0; padding: 7px 4px;
    border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px;
    box-shadow: 1px 1px 0 rgba(var(--surface-3-rgb), 0.85);
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.2px;
    font-family: inherit; cursor: pointer; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  /* v0.29 (user spec): the persona editor's action pills (save / ↺ default
     / ⇩ .md / delete) moved from BELOW the editor to the TOP, under the mode
     pills, MATCHING their size — one compact two-row pill block. The MD
     editor then fills the rest of the panel (pe-root column + flex). */
  .pe-action-row {
    display: flex; gap: 6px; margin: 6px 0 10px;
  }
  .pe-action-row .pe-mode-pill { flex: 1 1 0; }
  .pe-root {
    display: flex; flex-direction: column;
    height: 100%;            /* .panel-body has definite height (flex item) */
    min-height: 0;
  }
  .pe-root .pe-body-fill {
    flex: 1 1 auto; min-height: 140px; position: relative;
    border: 1px solid var(--surface-2); border-radius: 10px;
    overflow: hidden; margin-bottom: 2px;
  }
  .pe-body-fill .art-cm-host { position: absolute; inset: 0; }
  .pe-body-fill .art-cm-host .CodeMirror { height: 100%; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  /* placeholder scope pill (global ⇄ local) in the placeholders view */
  .ph-scope-pill {
    display: flex; align-items: stretch; border: 1px solid var(--surface-2);
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
    font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .ph-scope-pill button {
    background: transparent; border: none; color: var(--text-3);
    font-size: var(--ui-micro-fs); font-weight: 700; padding: 10px 12px;
    cursor: pointer; font-family: inherit; letter-spacing: 0.2px;
  }
  .ph-scope-pill button[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.16); color: var(--accent-2);
  }
  /* trigger builder: three boxes on one row + an example hint */
  .tr-grid {
    display: grid; grid-template-columns: 1fr 64px 1fr; gap: 8px;
    align-items: center; margin-top: 6px;
  }
  .pv-section-label {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-3); margin: 14px 2px 7px;
  }
  .pv-input, .pv-select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-1); padding: 11px 12px; border-radius: 10px;
    font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit; outline: none; min-height: 44px;
  }
  .pv-input:focus, .pv-select:focus { border-color: var(--accent); }
  .pv-btn {
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-1);
    border-radius: 10px; padding: 11px 14px; min-height: 44px; font-size: calc(var(--ui-fs) - 0.5px);
    font-weight: 600; font-family: inherit; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .pv-btn:active { background: var(--surface-3); }
  .pv-btn-primary { background: rgba(var(--accent-rgb),0.16); border-color: rgba(var(--accent-rgb),0.5); color: var(--accent); }
  /* v0.44 var-twin: the primary action layers the accent gradient over
     its tint (no-op while the accent is a solid) */
  .pv-btn-primary { background-image: var(--accent-gradient, none); }

  /* ══ v0.27→v0.33 — chat header pills: squared, matte, equal proportions ══
     One row of peers: sandbox · model · artifacts · persona · mind —
     every pill flexes the same basis (18%), wraps when the container is
     narrow. v0.33: the pills join the shared hand-drawn language (organic
     corner sets + the offset sketch stroke) — matte, theme-following. */
  #pill-row { flex-wrap: wrap; }
  #pill-row button, .pill-artifacts, #pill-persona, #pill-mind {
    border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px !important;   /* less rounded, drawn */
    flex: 1 1 18%; max-width: none !important;              /* equal proportions */
    background: var(--surface-2) !important;              /* matte finish */
    border: 1px solid var(--border) !important;
    color: var(--text-2) !important;
    box-shadow: 1px 1.5px 0 rgba(var(--surface-3-rgb), 0.9) !important;
    justify-content: center !important;
    padding: 7px 3px !important;
    font-size: 10.5px !important;
    min-width: 0 !important;
    line-height: 1.2 !important;      /* one baseline for type/artifacts/persona/mind pills */
    align-items: center !important;
  }
  #pill-row > button:nth-child(4n+2), #pill-row .pill-artifacts:nth-child(4n+2),
  #pill-row #pill-persona:nth-child(4n+2), #pill-row #pill-mind:nth-child(4n+2) {
    border-radius: 7px 10px 8px 9px / 10px 8px 9px 7px !important;
  }
  #pill-row > button:nth-child(4n+3), #pill-row .pill-artifacts:nth-child(4n+3),
  #pill-row #pill-persona:nth-child(4n+3), #pill-row #pill-mind:nth-child(4n+3) {
    border-radius: 10px 8px 9px 7px / 7px 9px 10px 8px !important;
  }
  #pill-row > button:nth-child(4n), #pill-row .pill-artifacts:nth-child(4n),
  #pill-row #pill-persona:nth-child(4n), #pill-row #pill-mind:nth-child(4n) {
    border-radius: 8px 9px 7px 10px / 9px 7px 10px 8px !important;
  }
  /* the search row: input takes ALL remaining width, arrows + counter
     pack to the right — on any screen width */
  #chat-searchbar { display: flex; align-items: center; gap: 6px; padding: 6px 0 4px; }
  #chat-search-input {
    flex: 1 1 auto; min-width: 0;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-1);
    padding: 7px 12px; border-radius: 6px; font-size: 11px; font-weight: 600;
    font-family: inherit; outline: none; touch-action: manipulation;
  }
  #chat-search-input::placeholder { color: var(--text-3); font-weight: 500; }
  #chat-search-input:focus { border-color: var(--accent); }
  .chat-search-nav {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 6px; width: 34px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1; padding-top: 3px; /* ▲▼ draw high in the em box — recenter */
    font-family: inherit; cursor: pointer; flex-shrink: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .chat-search-nav:active { background: var(--surface-3); }
  .chat-search-count {
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3);
    font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; flex-shrink: 0;
  }

  /* ══ v0.27 — util row: export/share + usage, small + dark-adjacent ══
     Same squared matte language as the pills above them, one shade
     darker (surface-3 border family), visibly smaller. */
  #util-row .util-btn {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--bg-panel); border: 1px solid var(--surface-3);
    color: var(--text-3); padding: 5px 8px;
    border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px;
    box-shadow: 1px 1px 0 rgba(var(--surface-3-rgb), 0.85);
    font-size: 10px; font-weight: 700; letter-spacing: 0.2px;
    font-family: inherit; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; line-height: 1.25;
    text-transform: uppercase;
  }
  #util-row .util-btn:active { background: var(--surface-2); color: var(--text-2); }

  /* ══ v0.27 — the header METERS: context ring + per-chat cost ══
     The usage panel's context bar, duplicated as two tiny front-facing
     elements on the far right of the expand/collapse metadata row (same
     data source — /api/sessions/{id}/usage).
     v0.38 THE RING, PER SPEC: the full circle = the model's context
     window. A SOLID theme-tinted fill marks the auto-compaction ZONE
     (0 → threshold) — the part auto-compact absorbs when it fills. The
     dynamic progress bar grows 0 → used% and shifts primary → warn as
     it slides toward the compaction point; when it crosses, compaction
     fires and the bar resets. Compaction OFF: no zone, the whole circle
     is the runway, and near-full uses the adjacent --notice tone
     instead of the bright warn. Both elements open the usage view. */
  #chat-header-meters { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .ctx-ring-btn {
    width: 30px; height: 30px; padding: 3px; background: transparent;
    border: none; cursor: pointer; font-family: inherit; flex-shrink: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  /* registered so the fill animates smoothly as --p changes */
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  .ctx-ring {
    --p: 0; --thr: 70; --ring: var(--accent);
    --zone: rgba(var(--accent-rgb), 0.16); --tick-op: .95;
    /* v0.38 FIX: an empty inline <span> in a non-flex button computed to
       0×0 — the ring has been INVISIBLE since v0.27. display:block. */
    display: block;
    width: 100%; height: 100%; border-radius: 50%; position: relative;
    background: conic-gradient(
      from 0deg,
      /* the live progress — primary → warn as it climbs */
      var(--ring) 0 calc(var(--p) * 1%),
      /* the auto-compaction ZONE — solid theme-tinted fill up to the point
         (transparent when compaction is OFF — no zone, all runway) */
      var(--zone) calc(var(--p) * 1%) calc(var(--thr) * 1%),
      /* the headroom above the compaction point */
      var(--surface-3) calc(var(--thr) * 1%) 100%
    );
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
    transition: --p 0.4s ease;
  }
  /* the compaction point — a crisp hairline tick where the zone ends */
  .ctx-ring::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from calc(var(--thr) * 3.6deg - 0.45deg),
      var(--border-strong) 0 0.9deg, transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 4px));
    opacity: var(--tick-op); pointer-events: none;
  }
  .ctx-cost {
    border: none; background: transparent; cursor: pointer; font-family: inherit;
    font-size: calc(var(--ui-micro-fs) - 0.5px); font-weight: 700; letter-spacing: 0.2px;
    color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0;
    padding: 4px 2px; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-cost.priced { color: var(--warn); }

  /* ══ v0.31→v0.33 — THE PUBLIC LIBRARY (the modular hub) ════════════
     hub.js (library panel), hubitem.js (item detail), hubpublish.js
     (publish + HF connect) — all views on the master panel's stack.
     v0.33 (user spec): everything that isn't the grid rides a
     COLLAPSIBLE header; the search bar sits UNDER it, sticky together
     with the filter row (funnel + Recent|Downloads|Endorsements columns
     + the subtext) — the grid owns the rest of the screen. Every text
     size derives from --ui-fs / --ui-small-fs; the card grid sizes
     from --hub-cols (clamped so a column never drops under ~150px). */
  .hub-root { display: flex; flex-direction: column; gap: 10px; }

  /* the collapsible header (title bar + everything-but-the-grid) */
  .pub-head {
    border: 1px solid var(--surface-2); border-radius: 14px 11px 13px 12px / 12px 13px 11px 14px;
    background: var(--surface-1); overflow: hidden;
    box-shadow: 1.5px 1.5px 0 rgba(var(--surface-3-rgb), 0.55);
  }
  .pub-head-bar {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 13px; background: transparent; border: none;
    font-family: inherit; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pub-title {
    font-size: calc(var(--ui-fs) + 1px); font-weight: 800; letter-spacing: 0.4px;
    color: var(--text-1);
  }
  .pub-status {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: var(--ui-micro-fs); color: var(--text-3); min-width: 0;
  }
  .pub-status b { color: var(--ok); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pub-status button {
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: var(--accent-2); font-size: var(--ui-micro-fs); padding: 0; flex-shrink: 0;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .pub-chev { color: var(--text-3); font-size: var(--ui-small-fs); flex-shrink: 0;
    transition: transform 0.18s ease; }
  .pub-head.folded .pub-chev { transform: rotate(-90deg); }
  .pub-head-body { display: flex; flex-direction: column; gap: 10px; padding: 0 13px 13px; }
  .pub-head.folded .pub-head-body { display: none; }

  /* "Browse the community for:" + the full-row library pills */
  .pub-sub {
    font-size: var(--ui-small-fs); color: var(--text-3); letter-spacing: 0.2px;
  }
  .hub-librow { display: flex; flex-direction: column; gap: 8px; }
  .hub-libpill {
    display: flex; align-items: center; gap: 10px; width: 100%;
    min-height: 48px; padding: 9px 13px;
    background: var(--surface-2); border: 1px solid var(--surface-3); color: var(--text-2);
    border-radius: 13px 10px 14px 11px / 11px 14px 10px 13px;
    box-shadow: 1.5px 1.5px 0 rgba(var(--surface-3-rgb), 0.5);
    font-size: calc(var(--ui-fs) - 0.5px); font-weight: 700; text-align: left;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .hub-libpill .dx-pill-ico { font-size: calc(var(--ui-fs) + 2px); flex-shrink: 0; }
  .hub-libpill-count {
    margin-left: auto; font-size: var(--ui-small-fs); color: var(--text-3);
    font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0;
  }
  .hub-libpill[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.10);
    border-color: rgba(var(--accent-2-rgb), 0.5); color: var(--accent-2);
  }
  .hub-libpill[data-tone="persona"][data-on="1"] {
    background: rgba(var(--persona-rgb), 0.13);
    border-color: rgba(var(--persona-rgb), 0.55); color: var(--persona-tint);
  }
  .hub-libpill[data-tone="template"][data-on="1"] {
    background: rgba(var(--template-rgb), 0.12);
    border-color: rgba(var(--template-rgb), 0.55); color: var(--template-tint);
  }
  .hub-libpill-ghost { cursor: default; }

  /* the sticky zone under the header: search + the filter columns */
  .hub-sticky {
    position: sticky; top: 0; z-index: 6;
    display: flex; flex-direction: column; gap: 7px;
    margin: 0 -14px; padding: 8px 14px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--surface-2);
  }
  .hub-search {
    width: 100%; box-sizing: border-box; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-1);
    padding: 10px 12px; border-radius: 11px 9px 12px 10px / 10px 12px 9px 11px;
    outline: none; min-height: 40px;
    font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit;
  }
  .hub-search:focus { border-color: var(--accent); }
  .hub-filters { display: flex; align-items: stretch; }
  .hub-funnel {
    display: flex; align-items: center; justify-content: center;
    width: 30px; flex-shrink: 0; color: var(--text-3);
  }
  .hub-funnel svg { width: 16px; height: 16px; fill: currentColor; }
  .hub-fcols { display: flex; flex: 1 1 auto; min-width: 0; }
  .hub-fcol {
    flex: 1 1 0; min-width: 0; padding: 7px 2px;
    background: transparent; border: none; border-left: 1px solid var(--surface-3);
    color: var(--text-3); font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 700;
    letter-spacing: 0.2px; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .hub-fcol:first-child { border-left: none; }
  .hub-fcol[data-on="1"] {
    color: var(--accent-2);
    background: rgba(var(--accent-2-rgb), 0.10);
    box-shadow: inset 0 2px 0 rgba(var(--accent-2-rgb), 0.65);
  }
  .hub-fsub {
    font-size: var(--ui-micro-fs); color: var(--text-3);
    padding: 0 2px 1px 30px; min-height: 14px;
  }

  /* tag pills (inside the collapsible header) — the shared .dx-pill */
  .hub-pillrow { display: flex; gap: 6px; flex-wrap: wrap; }

  .hub-ctlrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hub-ctl {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3); font-weight: 600;
  }
  .hub-step {
    width: 24px; height: 24px; border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px;
    background: var(--surface-2);
    border: 1px solid var(--surface-3); color: var(--text-2); font-size: var(--ui-small-fs);
    font-family: inherit; cursor: pointer; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-step:disabled { opacity: 0.35; cursor: default; }
  .hub-step-val {
    min-width: 16px; text-align: center; color: var(--text-1);
    font-variant-numeric: tabular-nums; font-weight: 700;
  }
  .hub-publish {
    margin-left: auto; background: rgba(var(--accent-rgb), 0.14);
    border: 1px solid rgba(var(--accent-rgb), 0.45); color: var(--accent);
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700;
    padding: 5px 12px; border-radius: 11px 9px 12px 10px / 10px 12px 9px 11px;
    box-shadow: 1px 1.5px 0 rgba(var(--accent-rgb), 0.30);
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-grid {
    display: grid;
    grid-template-columns: repeat(var(--hub-cols, 2), minmax(0, 1fr));
    gap: 10px;
  }
  .hub-card {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden; min-height: 138px; padding: 0; border-radius: 12px;
    background: var(--surface-1); border: 1px solid var(--surface-2);
    cursor: pointer; text-align: left; font-family: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-card:active { background: var(--surface-2); }
  .hub-card-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .hub-card-body {
    position: relative; display: flex; flex-direction: column; gap: 2px; padding: 9px 10px;
  }
  .hub-card-name {
    font-size: var(--ui-fs); font-weight: 700; color: var(--text-1); line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }
  .hub-card-desc {
    font-size: var(--ui-small-fs); color: var(--text-2); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hub-card-author {
    font-size: calc(var(--ui-small-fs) - 2px); color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hub-card-foot {
    display: flex; gap: 12px; margin-top: 3px; color: var(--text-3);
    font-size: var(--ui-small-fs); font-variant-numeric: tabular-nums;
  }
  .hub-empty {
    padding: 34px 18px; text-align: center; color: var(--text-3);
    font-size: var(--ui-small-fs); line-height: 1.6;
    border: 1px dashed var(--surface-3); border-radius: 12px;
  }
  .hub-pager {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .hub-nav {
    width: 34px; height: 28px; border-radius: 8px; background: var(--surface-2);
    border: 1px solid var(--surface-3); color: var(--text-2); font-size: var(--ui-small-fs);
    font-family: inherit; cursor: pointer; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-nav:disabled { opacity: 0.35; cursor: default; }

  /* ── the item detail (hubitem.js) ─────────────────────────────────── */
  .hi-root { display: flex; flex-direction: column; min-height: 100%; gap: 12px; }
  .hi-head {
    position: relative; border-radius: 12px; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--surface-2); cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hi-head-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .hi-head-body {
    position: relative; display: flex; flex-direction: column; gap: 3px;
    padding: 16px 14px 12px; min-height: 132px;
  }
  .hi-title {
    font-size: calc(var(--ui-fs) + 4px); font-weight: 800; color: var(--text-1);
    line-height: 1.2; text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .hi-desc { font-size: var(--ui-small-fs); color: var(--text-2); line-height: 1.45; }
  .hi-meta { font-size: calc(var(--ui-small-fs) - 1px); color: var(--text-3); }
  .hi-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .hi-chip {
    background: rgba(var(--accent-2-rgb), 0.13); border: 1px solid rgba(var(--accent-2-rgb), 0.4);
    color: var(--accent-2); border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px;
    padding: 2px 9px;
    font-size: calc(var(--ui-small-fs) - 2px); font-weight: 600;
  }
  .hi-counts {
    display: flex; gap: 14px; margin-top: 4px; color: var(--text-3);
    font-size: var(--ui-small-fs); font-variant-numeric: tabular-nums;
  }
  .hi-fold-ico {
    position: absolute; top: 8px; right: 10px; color: var(--text-2);
    font-size: var(--ui-small-fs); text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  /* the collapsible header — folded hides the description/tags and
     dims the background to a compact bar */
  .hi-head.folded .hi-head-bg { opacity: 0.25; }
  .hi-head.folded .hi-head-body { min-height: 0; padding: 10px 14px 8px; }
  .hi-head.folded .hi-desc, .hi-head.folded .hi-chips,
  .hi-head.folded .hi-meta { display: none; }
  .hi-body { flex: 1 1 auto; min-height: 0; }
  .hi-body .fmt { font-size: var(--ui-fs); }
  .hi-fabs {
    position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    margin-top: auto; display: flex; justify-content: flex-end; gap: 10px;
  }
  .hi-fab {
    width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2);
    border: 1px solid var(--border-strong); color: var(--text-1); font-size: 17px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .hi-fab:active { background: var(--surface-3); }
  .hi-fab:disabled { opacity: 0.4; cursor: not-allowed; }
  .hi-fab.on {
    color: var(--err); border-color: rgba(var(--err-rgb), 0.5);
    background: rgba(var(--err-rgb), 0.12);
  }

  /* ── publish + the HF connect flow (hubpublish.js) ───────────────── */
  .hp-root { display: flex; flex-direction: column; gap: 8px; }
  .hp-textarea {
    width: 100%; box-sizing: border-box; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-1); padding: 10px 12px;
    border-radius: 10px; font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit;
    outline: none; resize: vertical; min-height: 44px; line-height: 1.5;
  }
  .hp-textarea:focus { border-color: var(--accent); }
  .hp-payload { min-height: 170px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .hp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hp-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(var(--accent-2-rgb), 0.12); border: 1px solid rgba(var(--accent-2-rgb), 0.4);
    color: var(--accent-2); border-radius: 999px; padding: 3px 9px;
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 600;
  }
  .hp-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: inherit; padding: 0; font-family: inherit; line-height: 1;
  }
  .hp-seg {
    display: flex; gap: 6px; border: 1px solid var(--surface-2);
    border-radius: 11px 9px 12px 10px / 10px 12px 9px 11px;
    overflow: hidden; background: var(--surface-1);
  }
  .hp-seg button {
    flex: 1 1 0; background: transparent; border: none; color: var(--text-3);
    font-size: calc(var(--ui-small-fs) - 1px); font-weight: 700; padding: 8px 4px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-seg button[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.16); color: var(--accent-2);
  }
  .hp-design { display: flex; flex-direction: column; gap: 8px; }
  .hp-colors { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hp-color {
    width: 46px; height: 36px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); cursor: pointer; padding: 2px;
  }
  .hp-mini {
    background: var(--surface-2); border: 1px solid var(--surface-3); color: var(--text-2);
    border-radius: 8px; padding: 6px 10px; font-size: calc(var(--ui-small-fs) - 1px);
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-imgrow { display: flex; }
  .hp-pick {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-1); padding: 11px 14px; min-height: 44px; border-radius: 10px;
    font-size: calc(var(--ui-fs) - 0.5px); font-family: inherit; cursor: pointer;
  }
  .hp-imgmeta {
    font-size: calc(var(--ui-small-fs) - 1px); color: var(--ok);
    display: flex; align-items: center; gap: 8px;
  }
  .hp-preview {
    height: 64px; border-radius: 10px; border: 1px solid var(--surface-2);
    background-size: cover; background-position: center; flex-shrink: 0;
  }
  .hp-err { font-size: var(--ui-small-fs); color: var(--err); line-height: 1.5; min-height: 4px; }

  /* v0.31.2: the HF connect flow's step headers + subtexts — BRIGHTER,
     accent-tinted headers (--fmt-bright text + the step number in
     --fmt-link, the formatter's own accent slots) with LARGER step
     instructions in the theme's primary secondary color. The old
     micro-label + dim hint were too quiet for a two-step guide. */
  .hc-step {
    font-size: calc(var(--ui-fs) - 0.5px); font-weight: 700; letter-spacing: 0.2px;
    color: var(--fmt-bright); margin: 16px 2px 6px;
  }
  .hc-step .hc-num {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--fmt-link); margin-right: 5px;
  }
  .hc-sub {
    font-size: calc(var(--ui-small-fs) + 1px); color: var(--text-2);
    line-height: 1.6; margin: 0 2px 10px;
  }

  /* ══ v0.33 — THE SHARED UI KIT (uikit.js) ═══════════════════════════
     UIPills / GradientUI / CropUI. The pill system: ONE look for every
     pill in the app — matte surfaces, ORGANIC hand-drawn corner radii
     (each pill in a group gets its own corner set — drawn, not stamped),
     a 1px offset sketch stroke, theme-driven tints (accent by default,
     --persona-rgb / --template-rgb for the library tones). Compact by
     design: "as little as possible without compromising any visuals". */
  .dx-pill {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 6px 12px; min-height: 32px;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--surface-3);
    font-size: calc(var(--ui-small-fs) - 0.5px); font-weight: 700; letter-spacing: 0.25px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    box-shadow: 1px 1.5px 0 rgba(var(--surface-3-rgb), 0.9);   /* the sketch stroke */
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  /* the hand-drawn corner sets — position-cycled so neighbors differ */
  .dx-pill:nth-child(4n+1) { border-radius: 10px 8px 11px 9px / 9px 11px 8px 10px; }
  .dx-pill:nth-child(4n+2) { border-radius: 8px 11px 9px 10px / 11px 8px 10px 9px; }
  .dx-pill:nth-child(4n+3) { border-radius: 11px 9px 8px 10px / 8px 10px 11px 9px; }
  .dx-pill:nth-child(4n)   { border-radius: 9px 10px 10px 8px / 10px 9px 8px 11px; }
  .dx-pill:active { background: var(--surface-3); }
  .dx-pill[data-on="1"] {
    background: rgba(var(--accent-2-rgb), 0.14);
    border-color: rgba(var(--accent-2-rgb), 0.55); color: var(--accent-2);
  }
  .dx-pill[data-tone="persona"][data-on="1"] {
    background: rgba(var(--persona-rgb), 0.14);
    border-color: rgba(var(--persona-rgb), 0.55); color: var(--persona-tint);
  }
  .dx-pill[data-tone="template"][data-on="1"] {
    background: rgba(var(--template-rgb), 0.13);
    border-color: rgba(var(--template-rgb), 0.55); color: var(--template-tint);
  }
  /* v0.44 var-twin: the ON pill layers the accent-2 gradient image over
     its tint (this pill's accent IS accent-2). Scoped with
     :not([data-tone]) — the persona/template tones keep their own look,
     and the base `background:` shorthand above can't reset the image
     from here. A no-op while accent-2 is a solid. */
  .dx-pill[data-on="1"]:not([data-tone]) {
    background-image: var(--accent-2-gradient, none);
  }
  .dx-pill--sm { padding: 3px 9px; min-height: 26px;
    font-size: calc(var(--ui-small-fs) - 1.5px); }
  .dx-pill--sm .dx-pill-ico { font-size: calc(var(--ui-small-fs) - 0.5px); }
  .dx-pill-ico { font-size: calc(var(--ui-small-fs) + 1px); line-height: 1; flex-shrink: 0; }
  .dx-pill-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* the tag chips (publish chips, item-detail tags) — same language */
  .dx-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(var(--accent-2-rgb), 0.12); border: 1px solid rgba(var(--accent-2-rgb), 0.4);
    color: var(--accent-2); border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px;
    padding: 3px 9px; font-size: calc(var(--ui-small-fs) - 1px); font-weight: 600;
    box-shadow: 1px 1px 0 rgba(var(--surface-3-rgb), 0.8);
  }
  .dx-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: inherit; padding: 0; font-family: inherit; line-height: 1;
  }

  /* GradientUI — the 1–10 color gradient editor */
  .gr-editor { display: flex; flex-direction: column; gap: 8px; }
  /* top padding gives the floating ✕ remove buttons room INSIDE the
     collapsible section box (overflow:hidden would clip them) */
  .gr-swatches { display: flex; flex-wrap: wrap; gap: 10px 8px; padding: 8px 2px 2px; }
  .gr-swatch { position: relative; display: inline-flex; }
  .gr-color {
    width: 46px; height: 36px; padding: 2px;
    border: 1px solid var(--border); border-radius: 10px 8px 11px 9px / 9px 11px 8px 10px;
    background: var(--surface-2); cursor: pointer;
  }
  .gr-rm {
    position: absolute; top: -7px; right: -7px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface-3); color: var(--text-2);
    border: 1px solid var(--border-strong);
    font-size: 10px; line-height: 1; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .gr-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gr-mini {
    background: var(--surface-2); border: 1px solid var(--surface-3); color: var(--text-2);
    border-radius: 9px 7px 10px 8px / 8px 10px 7px 9px;
    box-shadow: 1px 1px 0 rgba(var(--surface-3-rgb), 0.9);
    padding: 6px 10px; font-size: calc(var(--ui-small-fs) - 1px);
    font-family: inherit; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .gr-mini:disabled { opacity: 0.35; cursor: default; }
  .gr-count { margin-left: auto; font-size: var(--ui-micro-fs); color: var(--text-3);
    font-variant-numeric: tabular-nums; font-weight: 700; }
  .gr-cap { font-size: var(--ui-micro-fs); color: var(--text-3); }
  .gr-preview {
    height: 56px; border-radius: 10px 8px 11px 9px / 9px 11px 8px 10px;
    border: 1px solid var(--surface-2); flex-shrink: 0;
  }

  /* CropUI — the drag-to-crop overlay (full-screen, above the panel) */
  .crop-ui {
    position: fixed; inset: 0; z-index: 9500;
    display: flex; flex-direction: column;
    background: rgba(6,6,10,0.97);
  }
  .crop-top {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  }
  .crop-title { flex: 1; text-align: center; color: var(--text-1);
    font-size: var(--ui-fs); font-weight: 700; }
  .crop-btn {
    min-width: 44px; min-height: 40px; padding: 6px 12px;
    background: var(--surface-2); border: 1px solid var(--surface-3); color: var(--text-1);
    border-radius: 10px 8px 11px 9px / 9px 11px 8px 10px;
    font-family: inherit; font-size: var(--ui-small-fs); font-weight: 700; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .crop-ok { color: var(--ok); border-color: rgba(var(--ok-rgb), 0.5);
    background: rgba(var(--ok-rgb), 0.12); }
  .crop-stage {
    flex: 1 1 auto; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; overflow: hidden; cursor: grab;
  }
  .crop-stage.grabbing { cursor: grabbing; }
  .crop-fit { position: relative; }
  .crop-img { position: absolute; top: 0; left: 0;
    user-select: none; -webkit-user-drag: none; will-change: transform; }
  .crop-frame {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 0 9999px rgba(6,6,10,0.78);
  }
  .crop-ctl {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .crop-zoom { flex: 1; accent-color: var(--accent); }
  /* v0.34: touch-action REMOVED — `none` disabled the range input's native
     touch dragging (the slider ignored finger moves); the default lets the
     OS own the thumb, and the .crop-ui isInsideUI registration stops the
     document touchstart preventDefault that also killed it. */
  .crop-hint { color: var(--text-3); font-size: var(--ui-micro-fs); flex-shrink: 0; }

  /* v0.33 — the publish form: collapsible sections + the payload FOCUS
     mode (the payload can own the screen; the other sections collapse
     away and come back with one tap). The * rides the theme's primary. */
  .hp-root { display: flex; flex-direction: column; gap: 8px; min-height: 100%; }
  .hp-sec {
    border: 1px solid var(--surface-2); border-radius: 13px 10px 14px 11px / 11px 14px 10px 13px;
    background: var(--surface-1); overflow: hidden;
    box-shadow: 1.5px 1.5px 0 rgba(var(--surface-3-rgb), 0.5);
  }
  .hp-sec-bar {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 12px; background: transparent; border: none;
    color: var(--text-2); font-family: inherit; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hp-sec-title {
    font-size: var(--ui-micro-fs); font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .hp-sec-chev { margin-left: auto; color: var(--text-3); font-size: var(--ui-small-fs);
    transition: transform 0.18s ease; }
  .hp-sec.folded .hp-sec-chev { transform: rotate(-90deg); }
  .hp-sec-body { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .hp-sec.folded .hp-sec-body { display: none; }
  .hp-star { color: var(--accent); }
  .hp-focus-btn {
    background: var(--surface-2); border: 1px solid var(--surface-3); color: var(--text-2);
    border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px;
    font-family: inherit; font-size: var(--ui-micro-fs); font-weight: 700;
    padding: 4px 9px; cursor: pointer; flex-shrink: 0;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  /* FOCUS MODE — the payload owns the screen */
  .hp-root.hp-focus { height: 100%; min-height: 0; }
  .hp-root.hp-focus > .pv-hint { display: none; }
  .hp-root.hp-focus .hp-sec { display: none; }
  .hp-root.hp-focus .hp-payload-sec { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .hp-root.hp-focus .hp-payload { flex: 1 1 auto; min-height: 0; height: auto; resize: none; }
  .hp-payload-sec .hp-sec-bar { align-items: center; }
  .hp-payload-sec .hp-sec-body { flex: 1 1 auto; min-height: 0; }

  /* v0.33 — the tweaks Background segment (color / gradient / image) */
  .tw-bgseg { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .tw-bgzone { display: flex; flex-direction: column; gap: 8px; }

  /* the persona picker's heart badges (persona.js) ───────────────── */
  .pp-heart {
    position: absolute; right: 9px; bottom: 7px; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(var(--surface-3-rgb), 0.75);
    color: var(--text-3-dim); font-size: calc(var(--ui-small-fs) - 1px);
    cursor: pointer; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pp-heart.on { color: var(--err); }

  /* ── v0.41 POLISH ──────────────────────────────────────────────── */
  /* themed text selection everywhere (was the OS-default harsh blue) */
  ::selection { background: rgba(var(--accent-rgb), 0.34); }
  ::selection:window-inactive { background: rgba(var(--accent-rgb), 0.20); }
  /* inputs share the accent caret so typing feels like the theme */
  input, textarea { caret-color: var(--accent); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="chatbots"></div>
<div id="menu" class="hidden">
  <button data-action="new-chat">＋ New Chat</button>
</div>
<button id="settings-btn" aria-label="Reset view">
  <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.42-.49-.42h-3.84c-.24 0-.43.17-.47.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.12.62l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
</button>
<!-- v0.31.2: THE CANVAS DOCK — the › arrow left of the settings gear.
     Tapping it flips to ‹ and expands the vertical strip: the cloud
     glyph opens the provider screen (relocated from Settings → Cloud)
     and the library glyph opens the hub library (relocated from the
     chat util row's ◈ pill). The collapsed/expanded state persists in
     localStorage (doomalay.dock.v1). Wired in app.js. -->
<button id="dock-toggle" aria-label="Expand dock" aria-expanded="false">›</button>
<div id="dock-strip" class="hidden">
  <button class="dock-btn" id="dock-cloud" title="Cloud providers" aria-label="Cloud providers">
    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
  </button>
  <button class="dock-btn" id="dock-library" title="Hub library" aria-label="Hub library">
    <svg viewBox="0 0 24 24"><path d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.19 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM12 8c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
  </button>
  <!-- v0.42: the all-chats index — every conversation, most recently
       active first, with a one-line preview of where it left off -->
  <button class="dock-btn" id="dock-chats" title="All chats" aria-label="All chats">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
  </button>
  <!-- v0.41: global chat search — the transcript across every chat -->
  <button class="dock-btn" id="dock-search" title="Search all chats" aria-label="Search all chats">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
  </button>
</div>

<!-- Slide-up chat panel (hidden by default, opened by tapping a chatbot) -->
<div id="chat-scrim"></div>
<div id="chat-panel">
  <div class="handle" id="panel-handle">
    <div class="handle-bar"></div>
  </div>
  <div class="panel-header">
    <!-- v0.27 view-stack chrome: ‹ back takes the model button's slot while
         a view (personas, usage, export, mind) is stacked over the chat;
         ✕ on the far right drops every view but keeps the panel open. -->
    <button id="panel-view-back" aria-label="Back" style="display:none">‹</button>
    <button id="panel-model-btn" aria-label="Change model"></button>
    <div class="avatar" id="panel-avatar"></div>
    <div class="meta">
      <!-- v0.19: tap the name to rename. data-nodrag exempts it from the
           header drag-gesture so the tap actually lands (Android WebView
           suppresses clicks after a preventDefaulted touchstart).
           In view mode panel.js swaps the text and app.js ignores taps. -->
      <div class="name" id="panel-name" data-nodrag title="Tap to rename" style="cursor:text">Chat</div>
      <div class="sub" id="panel-sub">Family · ID</div>
    </div>
    <button id="panel-view-x" aria-label="Close view" style="display:none">✕</button>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="placeholder">Chat interface goes here.<br>Each chat has its own conversation, settings, and storage.</div>
  </div>
</div>

<script src="recovery.js"></script>
<script src="physics.js"></script>
<!-- v0.15: the PrivateMode SDK bridge (ES module — imports the vendored
     privatemode-ai SDK + WASM). Loads async; PM turns await window.PMBridge. -->
<script type="module" src="vendor/pm/pmsdk.js"></script>
<!-- v0.17 formatting stack (all vendored, permissive licenses):
     marked MIT · DOMPurify Apache-2.0/MPL-2.0 · Prism MIT (core; language
     components lazy-load per code block from /vendor/format/). -->
<script src="vendor/format/marked.min.js"></script>
<script src="vendor/format/purify.min.js"></script>
<script src="vendor/format/prism.min.js"></script>
<script src="gridicon.js"></script>
<script src="chatbot.js"></script>
<script src="panel.js"></script>
<script src="settings.js"></script>
<!-- v0.33→v0.44: THE SHARED UI KIT — the modular pill system (UIPills),
     GradientUI v2 (the 1–15 color gradient engine + the compact editor)
     and the drag-to-crop overlay (CropUI). One kit, reused by the hub /
     publish / tweaks / theme / appearance. v0.44: loads BEFORE theme.js
     + formatter.js — both boot-apply gradient specs the moment their
     IIFEs run, so window.GradientUI must already exist. -->
<script src="uikit.js"></script>
<script src="theme.js"></script>
<script src="appearance.js"></script>
<script src="connectoverlay.js"></script>
<script src="uiactive.js"></script>
<script src="sandboxpicker.js"></script>
<script src="modelpicker.js"></script>
<script src="providers.js"></script>
<script src="localmodels.js"></script>
<script src="modelbrowser.js"></script>
<script src="chatclient.js"></script>
<!-- v0.16: the OO chat-type framework (ChatType base + QuickChat + registry).
     chatpanel.js is now a GENERIC host that delegates to registered types. -->
<script src="chatframework.js"></script>
<!-- v0.17: file-type registry (editor modes, icons, mimes) + the formatting
     engine + artifacts drawer/editor (CodeMirror 5 lazy-loads per open) +
     message long-press actions + snap-point panel gestures. -->
<script src="filetypes.js"></script>
<script src="formatter.js"></script>
<script src="artifacts.js"></script>
<!-- v0.19→v0.27: the multi-persona system + usage/cost panel — every view
     now renders on the MASTER PANEL's view stack (panel.js pushView); the
     v0.26 sheet.js experiment is deleted (dead-on-Android: isInsideUI()
     never knew it, so document touch handlers ate its clicks and panned
     the grid behind it). -->
<script src="persona.js"></script>
<!-- v0.31: THE HUB — the modular library system (personas, templates, …):
     hub.js = the library panel (tabs/search/sort/tag pills/the resizable
     card grid), hubitem.js = the item detail (payload + the floating
     download/endorse buttons), hubpublish.js = publish + the Hugging
     Face connect flow. All views on the master panel's stack; persona.js
     links into them (library pill + publish pill) at click time. -->
<script src="hub.js"></script>
<script src="hubitem.js"></script>
<script src="hubpublish.js"></script>
<script src="usagepanel.js"></script>
<script src="tweaks.js"></script>
<script src="msgactions.js"></script>
<!-- v0.41: GLOBAL CHAT SEARCH — the transcript across every chat, opened
     from the canvas dock's ⌕ glyph. Results grouped by chat with marked
     snippets; tapping a result jumps straight to the message in its chat
     (data-ei + find-hit pulse). -->
<script src="globalsearch.js"></script>
<!-- v0.42: THE ALL-CHATS INDEX — every conversation, date-grouped, with
     previews; opened from the canvas dock's 💬 glyph. Tapping a row
     opens that chat (materializing an icon when missing). -->
<script src="chatsview.js"></script>
<!-- v0.42: THE GLOBAL KEYBOARD LAYER — '?' opens the shortcuts overlay,
     Ctrl/Cmd+F opens the live chat's find bar, Ctrl/Cmd+K opens global
     chat search (the command-palette entry). -->
<script src="keys.js"></script>
<script src="gesture.js"></script>
<!-- v0.44: THE TEMPLATE SHEET — the ⧉ template pill's library browser
     (search / favorites / groups / detail view / the hub links). Renders
     as a view on the master panel's stack; chatpanel.js opens it from
     the composer toolbar and feeds it the activation callback. -->
<script src="templatesheet.js"></script>
<script src="chatpanel.js"></script>
<script src="app.js"></script>
</body>
</html>
