<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
body { background: #0a0a0b; color: #e4e4e7; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#header { padding: 12px 16px; background: #131316; border-bottom: 1px solid #2a2a32; display: flex; gap: 8px; align-items: center; padding-top: env(safe-area-inset-top); }
#header h1 { font-size: 16px; font-weight: 600; color: #a78bfa; }
#status { font-size: 11px; color: #71717a; margin-left: auto; }
#setup { padding: 24px 16px; overflow-y: auto; flex: 1; }
#setup h2 { font-size: 18px; margin-bottom: 12px; color: #a78bfa; }
#setup label { display: block; font-size: 13px; color: #71717a; margin: 12px 0 4px; }
#setup input, #setup select { width: 100%; padding: 10px 12px; background: #1c1c21; border: 1px solid #2a2a32; border-radius: 8px; color: #e4e4e7; font-size: 14px; outline: none; }
#setup input:focus, #setup select:focus { border-color: #a78bfa; }
#setup button { width: 100%; padding: 12px; background: #a78bfa; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; margin-top: 16px; cursor: pointer; }
#setup button:hover { background: #c4b5fd; }
#chat { display: none; flex: 1; flex-direction: column; overflow: hidden; }
#messages { flex: 1; overflow-y: auto; padding: 16px; }
#messages .msg { margin-bottom: 12px; max-width: 85%; }
#messages .user { margin-left: auto; background: #a78bfa; color: #fff; padding: 8px 14px; border-radius: 14px 14px 4px 14px; }
#messages .assistant { background: #1c1c21; padding: 8px 14px; border-radius: 14px 14px 14px 4px; white-space: pre-wrap; word-break: break-word; }
#messages .assistant.streaming { border-left: 2px solid #a78bfa; }
#messages .error { background: #7f1d1d; padding: 8px 14px; border-radius: 8px; }
#messages .system { color: #71717a; font-size: 12px; text-align: center; }
#input-bar { padding: 12px 16px; background: #131316; border-top: 1px solid #2a2a32; display: flex; gap: 8px; padding-bottom: env(safe-area-inset-bottom); }
#msg-input { flex: 1; padding: 10px 14px; background: #1c1c21; border: 1px solid #2a2a32; border-radius: 8px; color: #e4e4e7; font-size: 14px; outline: none; }
#msg-input:focus { border-color: #a78bfa; }
#send-btn { padding: 10px 16px; background: #a78bfa; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
#send-btn:disabled { opacity: 0.4; }
#model-bar { padding: 8px 16px; background: #131316; border-bottom: 1px solid #2a2a32; display: flex; gap: 8px; align-items: center; font-size: 12px; }
#model-bar select { background: #1c1c21; border: 1px solid #2a2a32; color: #e4e4e7; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
#model-bar button { background: none; border: none; color: #71717a; font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div id="header">
  <h1>Doomalay</h1>
  <span id="status">connecting...</span>
</div>

<!-- Setup screen: API key + model selection -->
<div id="setup">
  <h2>Quick Chat Setup</h2>
  <p style="color:#71717a;font-size:13px;margin-bottom:16px">Add a cloud API key to start chatting.</p>
  
  <label>Provider</label>
  <select id="provider-select" onchange="updateProviderInfo()">
    <option value="">Loading providers...</option>
  </select>
  
  <label>API Key</label>
  <input id="api-key-input" type="password" placeholder="sk-...">
  
  <label>Model</label>
  <select id="model-select">
    <option value="">Select provider first</option>
  </select>
  
  <button onclick="saveKeyAndStart()">Start Chatting</button>
</div>

<!-- Chat screen -->
<div id="chat">
  <div id="model-bar">
    <span>Model:</span>
    <select id="chat-model-select" onchange="changeModel()"></select>
    <button onclick="logout()">Change Key</button>
  </div>
  <div id="messages"></div>
  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="Send a message..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="send-btn" onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
let ws = null;
let isStreaming = false;
let providers = {};
let models = [];
let currentSession = null;

// ── Init: check engine health ──
async function init() {
  try {
    const r = await fetch('/api/health');
    const h = await r.json();
    document.getElementById('status').textContent = h.brain ? 'engine+brain' : 'engine';
    
    // Load providers + models
    const mr = await fetch('/api/models');
    const m = await mr.json();
    providers = m.providers || {};
    models = m.models || [];
    
    const sel = document.getElementById('provider-select');
    sel.innerHTML = '<option value="">Choose...</option>';
    for (const [name, cfg] of Object.entries(providers)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = cfg.label || name;
      sel.appendChild(opt);
    }
    
    // Check if user already has a key
    const kr = await fetch('/api/keys');
    const keys = await kr.json();
    const hasKey = Object.values(keys).some(k => k.has_key);
    if (hasKey) {
      // Skip to chat
      startChat();
    }
  } catch (e) {
    document.getElementById('status').textContent = 'engine offline';
    document.getElementById('setup').innerHTML = '<h2>Engine not running</h2><p>Cannot connect to the engine. Please restart the app.</p>';
  }
}

function updateProviderInfo() {
  const prov = document.getElementById('provider-select').value;
  if (!prov) return;
  const cfg = providers[prov];
  if (!cfg) return;
  document.getElementById('api-key-input').placeholder = cfg.env_var || 'API key';
  
  // Update model dropdown
  const ms = document.getElementById('model-select');
  const providerModels = models.filter(m => m.provider === prov);
  if (providerModels.length > 0) {
    ms.innerHTML = providerModels.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
  } else {
    ms.innerHTML = `<option value="${prov}/auto">auto</option>`;
  }
}

async function saveKeyAndStart() {
  const prov = document.getElementById('provider-select').value;
  const key = document.getElementById('api-key-input').value;
  const model = document.getElementById('model-select').value;
  
  if (!prov || !key) { alert('Select a provider and enter an API key'); return; }
  
  const cfg = providers[prov];
  const envVar = cfg.env_var;
  
  try {
    await fetch('/api/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ env_var: envVar, provider: prov, key: key })
    });
    startChat(model);
  } catch (e) {
    alert('Failed to save key: ' + e.message);
  }
}

async function startChat(forceModel) {
  // Create a session
  try {
    const r = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'Quick Chat' })
    });
    currentSession = await r.json();
    
    // Load models for the model bar
    const mr = await fetch('/api/models');
    const m = await mr.json();
    models = m.models || [];
    
    const cms = document.getElementById('chat-model-select');
    if (models.length > 0) {
      cms.innerHTML = models.map(mo => `<option value="${mo.id}">${mo.label}</option>`).join('');
      if (forceModel) cms.value = forceModel;
    } else {
      cms.innerHTML = '<option value="openrouter/auto">auto</option>';
    }
    
    // Set the model on the session
    const selectedModel = cms.value || 'openrouter/auto';
    const provider = selectedModel.split('/')[0];
    await fetch(`/api/sessions/${currentSession.ID}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: selectedModel, provider: provider })
    });
    currentSession.Model = selectedModel;
    currentSession.Provider = provider;
    
    // Show chat
    document.getElementById('setup').style.display = 'none';
    document.getElementById('chat').style.display = 'flex';
    
    // Connect WebSocket
    connectWS();
    
    addMessage('system', 'Ready! Send a message to start chatting.');
  } catch (e) {
    alert('Failed to start chat: ' + e.message);
  }
}

function connectWS() {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/api/chat?session_id=${currentSession.ID}`);
  
  ws.onopen = () => {
    document.getElementById('status').textContent = 'connected';
  };
  
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev);
  };
  
  ws.onerror = (e) => {
    document.getElementById('status').textContent = 'ws error';
  };
  
  ws.onclose = () => {
    document.getElementById('status').textContent = 'disconnected';
    // Reconnect after 2s
    setTimeout(() => { if (currentSession) connectWS(); }, 2000);
  };
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'user':
      addMessage('user', ev.text);
      break;
    case 'assistant_delta':
      appendToStreaming(ev.text);
      break;
    case 'status':
      if (ev.state === 'idle' || ev.state === 'error') {
        finalizeStreaming();
        isStreaming = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('send-btn').textContent = 'Send';
      }
      if (ev.state === 'running') {
        isStreaming = true;
        document.getElementById('send-btn').disabled = true;
        document.getElementById('send-btn').textContent = '...';
      }
      break;
    case 'error':
      addMessage('error', ev.message || ev.error || 'Unknown error');
      isStreaming = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('send-btn').textContent = 'Send';
      break;
    case 'thinking':
      // Ignore for now (or show a subtle indicator)
      break;
  }
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollDown();
}

let streamingDiv = null;
function appendToStreaming(text) {
  if (!streamingDiv) {
    streamingDiv = document.createElement('div');
    streamingDiv.className = 'msg assistant streaming';
    document.getElementById('messages').appendChild(streamingDiv);
  }
  streamingDiv.textContent += text;
  scrollDown();
}

function finalizeStreaming() {
  if (streamingDiv) {
    streamingDiv.classList.remove('streaming');
    streamingDiv = null;
  }
}

function scrollDown() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !ws || isStreaming) return;
  input.value = '';
  ws.send(JSON.stringify({ type: 'send', message: text }));
}

async function changeModel() {
  const model = document.getElementById('chat-model-select').value;
  const provider = model.split('/')[0];
  if (!currentSession) return;
  await fetch(`/api/sessions/${currentSession.ID}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: model, provider: provider })
  });
  currentSession.Model = model;
  currentSession.Provider = provider;
}

function logout() {
  if (ws) ws.close();
  ws = null;
  currentSession = null;
  document.getElementById('chat').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  document.getElementById('messages').innerHTML = '';
}

// Start
init();
</script>
</body>
</html>
